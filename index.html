d faith, remain grounded in prayer and love, and show appropriate mercy to those in danger.","verses":[{"ref":"1:3","why":"contend for faith"},{"ref":"1:21–23","why":"keep in God's love"},{"ref":"1:24–25","why":"God keeps his people"}],"summary":"Jude warns that false teachers have slipped into the church and turned grace into license. Drawing on vivid examples of rebellion and judgment, he calls believers to remember apostolic teaching. The letter ends by urging prayer, mercy, and confidence in God's ability to preserve his people.","outline":["Warning about intruders (1–16)","Perseverance and mercy (17–25)"],"themes":["Truth","Mercy","Perseverance"],"era":11,"places":["Jerusalem"],"relations":["2 Peter","Revelation"]},{"id":65,"name":"Revelation","section":7,"testament":"NT","author":"John of Patmos (the named writer; identification with John the apostle remains disputed).","date":"Often c. AD 90–96; earlier dating proposed","purpose":"Address seven churches in Roman Asia through letters and symbolic visions of the heavenly throne, beasts, Babylon, final judgment, and new Jerusalem. It places their experience of pressure and compromise within a larger portrayal of Christ's victory and the renewal of creation.","verses":[{"ref":"1:17–18","why":"living Christ"},{"ref":"21:1–4","why":"new creation"},{"ref":"22:20","why":"come, Lord Jesus"}],"summary":"John receives symbolic visions addressed to seven churches confronting pressure and compromise. The visions portray the conflict between God's kingdom and the powers of evil, centering victory on the slain and risen Lamb. The book ends with final judgment and the promise that God will dwell with his people in a renewed heaven and earth.","outline":["Messages to churches (1–3)","Visions of conflict and victory (4–20)","New creation and invitation (21–22)"],"themes":["Hope","Worship","New creation"],"era":11,"places":["Ephesus"],"relations":["Daniel","John","Zechariah"]}],"sections":[{"title":"The Pentateuch","desc":"Origins, covenant, and Israel’s formation","kind":"Origins","count":5},{"title":"Leadership History","desc":"Israel’s land, kings, exile, and return","kind":"History","count":12},{"title":"Wisdom Literature","desc":"Worship, wisdom, suffering, and love","kind":"Wisdom","count":5},{"title":"Major Prophets","desc":"Judgment, redemption, and future hope","kind":"Prophecy","count":5},{"title":"Minor Prophets","desc":"Twelve prophetic voices to God’s people","kind":"Prophecy","count":12},{"title":"Gospels + Acts","desc":"Jesus Christ and the early church","kind":"Gospels","count":5},{"title":"Pauline Epistles","desc":"Paul’s letters to churches and coworkers","kind":"Letters","count":13},{"title":"General Epistles + Prophecy","desc":"Christian endurance, truth, and hope","kind":"Letters","count":9}],"eras":[{"name":"Beginnings & Patriarchs","date":"Primeval history; patriarchs traditionally c. 2100–1700 BC","testament":"OT","short":"Origins"},{"name":"Exodus & Wilderness","date":"Traditionally 15th–13th centuries BC","testament":"OT","short":"Exodus"},{"name":"Land & Judges","date":"Traditionally c. 1400–1050 BC","testament":"OT","short":"Judges"},{"name":"United Monarchy","date":"c. 1050–930 BC","testament":"OT","short":"Monarchy"},{"name":"Divided Kingdoms","date":"c. 930–586 BC","testament":"OT","short":"Kingdoms"},{"name":"Exile","date":"c. 586–539 BC","testament":"OT","short":"Exile"},{"name":"Return & Restoration","date":"c. 539–400 BC","testament":"OT","short":"Return"},{"name":"Life of Jesus","date":"c. 6 BC–AD 30","testament":"NT","short":"Jesus"},{"name":"Early Church","date":"c. AD 30–48","testament":"NT","short":"Church"},{"name":"Missionary Expansion","date":"c. AD 48–60","testament":"NT","short":"Missions"},{"name":"Later Apostolic Ministry","date":"c. AD 60–70","testament":"NT","short":"Ministry"},{"name":"Late Apostolic Era","date":"c. AD 70–100","testament":"NT","short":"Witness"}],"locations":{"Rome":[12.5,41.9],"Corinth":[22.93,37.91],"Philippi":[24.29,41. function formatAuthor(v){const i=v.indexOf(' (');return i<0?safe(v):'<strong>'+safe(v.slice(0,i))+'</strong>'+safe(v.slice(i));}
function formatDate(v){
 const terms=['monarchic to postexilic era','Collected over centuries','Date uncertain','Late 7th–early 6th c. BC'];
 const x=terms.find(t=>v.includes(t));
 if(x){const i=v.indexOf(x);return safe(v.slice(0,i))+'<strong>'+safe(x)+'</strong>'+safe(v.slice(i+x.length));}
 const match=/(?:\bc\.\s*)?(?:AD\s*)?\d{1,4}(?:st|nd|rd|th|s)?(?:\s*[–-]\s*(?:AD\s*)?\d{1,4}(?:st|nd|rd|th|s)?)?(?:\s*c\.)?(?:\s*(?:BC|AD))?/i.exec(v);
 if(!match){const i=v.indexOf(';');return '<strong>'+safe(i<0?v:v.slice(0,i))+'</strong>'+safe(i<0?'':v.slice(i));}
 return safe(v.slice(0,match.index))+'<strong>'+safe(match[0])+'</strong>'+safe(v.slice(match.index+match[0].length));
}
function formatPurpose(b){
 const value=b.purpose,picks=BOLD_PHRASES[b.id]||[],ranges=[];
 for(const p of picks){const i=value.toLowerCase().indexOf(p.toLowerCase());if(i>=0)ranges.push([i,i+p.length]);}
 ranges.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);
 let out='',pos=0;
 for(const [a,z] of ranges){if(a<pos)continue;out+=safe(value.slice(pos,a))+'<strong>'+safe(value.slice(a,z))+'</strong>';pos=z;}
 return out+safe(value.slice(pos));
}

 let h='<section class="timeline-panel era-timeline"><div class="timeline-top"><div><strong>'+(testament==='OT'?'Old Testament':'New Testament')+'</strong><p class="timeline-subtitle">Five major movements in biblical history</p></div><span class="timeline-tag">'+count+' books · 5 eras</span></div><div class="timeline-scroll"><div class="five-timeline-track">';
 shown.forEach((e,i)=>{
  let books=B.filter(b=>e.eras.includes(b.era));
  let links=books.map(b=>'<button class="era-chip" onclick="navigate(\'book\','+b.id+')"><i></i>'+esc(b.name)+'</button>');
  let featured=links.slice(0,5).join('');
  let extra=links.length>5?'<details class="timeline-more"><summary>+'+(links.length-5)+' more books</summary><div class="era-more-books">'+links.slice(5).join('')+'</div></details>':'';
  h+='<article class="epoch '+testament.toLowerCase()+'"><div class="epoch-marker"><span class="epoch-symbol" aria-hidden="true">'+esc(e.symbol)+'</span><span class="epoch-date">'+esc(e.date)+'</span></div><div class="epoch-rail"></div><div class="epoch-card"><div class="epoch-step">ERA '+String(i+1).padStart(2,'0')+'</div><h4>'+esc(e.title)+'</h4><p>'+esc(e.subtitle)+'</p><div class="era-books">'+featured+extra+'</div></div></article>';
 });
 h+='</div></div><div class="timeline-note">Dates are approximate historical settings, not the dates the books were composed. Early biblical chronology is debated; a book may span several eras. '+(testament==='OT'?'The period c. 400 BC to Jesus’ birth bridges the two testaments.':'Revelation’s final vision looks beyond the first century; AD 70–100 describes the era of its composition, not a date for future events.')+' Scroll sideways to explore →</div></section>';
 return h;
};
