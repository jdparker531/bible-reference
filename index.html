/* Book abstract: readable, content-sized cards with a shorter first screen. */
.book-back{margin-bottom:13px}
.book-intro h1{margin:5px 0 7px}
.book-header{margin-bottom:17px}
.details-grid{grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:12px}
.book-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.book-fact{padding:14px 21px 15px;min-width:0}
.book-fact + .book-fact{border-left:1px solid var(--line)}
.book-fact .info-title{color:#8b7258;font-size:10px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;margin-bottom:5px}
.book-fact p{margin:0;font-size:16px;line-height:1.5;color:#253a4f;overflow-wrap:anywhere}
.info-box{min-height:0;padding:14px 21px 16px;border-radius:13px}
.info-box .info-title{margin-bottom:6px}
.info-box p{font-size:16px;line-height:1.55;color:#43566a}
.verse-list{gap:9px}
.verse{padding:10px 12px;display:flex;flex-direction:column;justify-content:center;min-height:61px;gap:2px}
.verse strong{font-size:14px;margin-bottom:0;line-height:1.4}
.verse span{font-size:12px;line-height:1.4}
.summarycard{padding:20px 23px 23px;border-radius:13px}
.summarycard h2{font-size:24px;margin:2px 0 7px}
.summarycard p{font-size:17px;line-height:1.72}
.actions{margin-top:14px}
@media(max-width:600px){
 .book-header{gap:10px}
 .details-grid{grid-template-columns:1fr;gap:9px}
 .book-facts{grid-template-columns:1fr}
 .book-fact{padding:12px 16px}
 .book-fact + .book-fact{border-left:0;border-top:1px solid var(--line)}
 .book-fact p,.info-box p{font-size:15px}
 .info-box{padding:12px 16px 13px}
 .verse-list{grid-template-columns:1fr;gap:6px}
 .verse{min-height:0;flex-direction:row;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 11px}
 .verse strong{flex:0 0 auto;font-size:13px}
 .verse span{text-align:right;font-size:12px}
 .summarycard{padding:18px 17px 20px}
 .summarycard p{font-size:16px;line-height:1.7}
}

<script>
const DATA={"books":[{"id":0,"name":"Genesis","section":0,"testament":"OT","author":"Moses (traditional author; final compilation and editing are debated).","date":"Traditionally 15th–13th c. BC; final form debated","purpose":"Recount creation, humanity's rebellion, the flood, and Babel before tracing Abraham, Isaac, Jacob, and Joseph. These accounts explain the origins of Israel and the covenant promises of land, descendants, and blessing that drive the rest of Scripture.","verses":[{"ref":"1:1","why":"God creates"},{"ref":"12:2–3","why":"blessing to the nations"},{"ref":"50:20","why":"providence amid evil"}],"summary":"Genesis begins with God's good creation and humanity's rebellion, followed by judgment and mercy. God calls Abraham and makes covenant promises of land, descendants, and worldwide blessing. The stories of Isaac, Jacob, and Joseph show God preserving that promise through flawed people and unexpected circumstances.","outline":["Creation and fall (1–11)","Patriarchs and covenant (12–36)","Joseph and preservation (37–50)"],"themes":["Creation","Covenant","Providence"],"era":0,"places":["Canaan","Egypt","Babylon"],"relations":["Exodus","Romans","Hebrews"]},{"id":1,"name":"Exodus","section":0,"testament":"OT","author":"Moses (traditional author; final compilation and editing are debated).","date":"Traditionally 15th–13th c. BC; final form debated","purpose":"Tell how Moses led Israel out of Egypt through the plagues, Passover, and Red Sea crossing, then received the covenant law at Sinai and instructions for the tabernacle. It records how an enslaved people became a nation organized around God's presence and worship.","verses":[{"ref":"3:14","why":"divine name"},{"ref":"12:13","why":"Passover deliverance"},{"ref":"19:5–6","why":"covenant calling"}],"summary":"Israel suffers in Egypt until God raises Moses to lead the people out through mighty acts and the Passover. At Sinai, God establishes his covenant and gives the law to shape Israel as a holy nation. The tabernacle instructions and completion emphasize God's presence among his people despite their unfaithfulness.","outline":["Slavery and rescue (1–18)","Sinai covenant (19–24)","Tabernacle and divine presence (25–40)"],"themes":["Deliverance","Covenant","Presence"],"era":1,"places":["Egypt","Sinai","Canaan"],"relations":["Leviticus","John","Hebrews"]},{"id":2,"name":"Leviticus","section":0,"testament":"OT","author":"Moses (traditional author; priestly compilation and later editing are debated).","date":"Traditionally 15th–13th c. BC; final form debated","purpose":"Preserve the laws governing Israel's sacrifices, priests, ritual purity, Day of Atonement, festivals, and everyday holiness. It explains how Israel was to approach and worship God at the tabernacle and supplies the background for the New Testament's account of sacrifice and priesthood.","verses":[{"ref":"16:30","why":"Day of Atonement"},{"ref":"19:2","why":"holiness"},{"ref":"19:18","why":"love your neighbor"}],"summary":"Leviticus explains sacrifices and priestly service as part of Israel's covenant worship. Laws concerning purity, the Day of Atonement, and holiness teach how a sinful people may live near a holy God. Its ethical commands connect worship of God with justice, love, and daily conduct.","outline":["Sacrifices and priests (1–10)","Purity and atonement (11–16)","Holy living and feasts (17–27)"],"themes":["Holiness","Atonement","Worship"],"era":1,"places":["Sinai"],"relations":["Hebrews","Romans"]},{"id":3,"name":"Numbers","section":0,"testament":"OT","author":"Moses (traditional author; later compilation and editing are debated).","date":"Traditionally 15th–13th c. BC; final form debated","purpose":"Record Israel's census, camp organization, rebellion after the spies' report, forty years of wilderness wandering, and preparations to enter Canaan. It explains why the exodus generation did not inherit the land and how a new generation arrived at its borders.","verses":[{"ref":"6:24–26","why":"priestly blessing"},{"ref":"14:18","why":"mercy and justice"},{"ref":"21:9","why":"bronze serpent"}],"summary":"Numbers follows Israel from Sinai through the wilderness toward the promised land. Complaints, rebellion, and refusal to trust God's promise lead to a generation's prolonged wandering. Yet God preserves the nation and prepares a new generation to enter Canaan.","outline":["Preparation at Sinai (1–10)","Rebellion and wandering (11–25)","New generation (26–36)"],"themes":["Faithfulness","Unbelief","Journey"],"era":1,"places":["Sinai","Moab","Canaan"],"relations":["Deuteronomy","1 Corinthians"]},{"id":4,"name":"Deuteronomy","section":0,"testament":"OT","author":"Moses (principal speaker and traditional author; the final chapter and later editing reflect other hands).","date":"Traditionally 15th–13th c. BC; final form debated","purpose":"Preserve Moses' final speeches to the generation preparing to enter Canaan: a review of the journey, a restatement of the law, and a renewal of the covenant. It establishes the terms by which Israel's later kings, prophets, and history are evaluated.","verses":[{"ref":"6:4–5","why":"love the Lord"},{"ref":"8:3","why":"live by God's word"},{"ref":"30:19–20","why":"choose life"}],"summary":"Moses addresses a new generation on the plains of Moab before Israel enters Canaan. He retells God's acts and renews the covenant, emphasizing wholehearted love and obedience. The book sets blessings and curses before Israel while anticipating both failure and God's future restoration.","outline":["Remember God's work (1–4)","Covenant instruction (5–26)","Choice, blessing, and succession (27–34)"],"themes":["Love","Law","Covenant"],"era":1,"places":["Moab","Canaan"],"relations":["Joshua","Matthew"]},{"id":5,"name":"Joshua","section":1,"testament":"OT","author":"Joshua (traditional attribution; author unknown; later materials are linked to Eleazar, Phinehas, or later Israelite editors).","date":"Often placed in exilic or later final form; events traditionally c. 1400s–1200s BC","purpose":"Record how Joshua led Israel across the Jordan, captured Jericho and other Canaanite strongholds, divided the land among the tribes, and renewed the covenant at Shechem. It explains how Israel came to occupy the homeland promised to its ancestors.","verses":[{"ref":"1:9","why":"courage and God's presence"},{"ref":"21:45","why":"promises fulfilled"},{"ref":"24:15","why":"choose whom to serve"}],"summary":"Joshua leads Israel across the Jordan and into the promised land. Battles, land allotments, and covenant ceremonies depict God's fulfillment of his promises, while also revealing Israel's incomplete obedience. Joshua concludes by urging the nation to reject idols and serve the Lord faithfully.","outline":["Entrance and conquest (1–12)","Land allotments (13–21)","Covenant renewal (22–24)"],"themes":["Promise","Faith","Obedience"],"era":2,"authorOptions":["Joshua (traditional attribution)","Eleazar or another early witness (traditional proposals)","A later covenant historian/editor"],"places":["Canaan","Jerusalem"],"relations":["Judges","Hebrews"]},{"id":6,"name":"Judges","section":1,"testament":"OT","author":"Samuel (traditional attribution; author unknown; later Israelite compilers are also proposed).","date":"Likely exilic or later final form; events c. 1200s–1000s BC","purpose":"Recount Israel's life between Joshua and the monarchy through leaders such as Deborah, Gideon, Jephthah, and Samson. Its repeated episodes of idolatry, oppression, deliverance, and civil disorder explain the instability that preceded Israel's demand for a king.","verses":[{"ref":"2:16","why":"God raises judges"},{"ref":"17:6","why":"everyone did what seemed right"},{"ref":"21:25","why":"no king in Israel"}],"summary":"After Joshua, Israel repeatedly abandons God and falls under oppression. God raises judges to deliver the people, but each cycle exposes deepening moral and spiritual disorder. The book ends with disturbing accounts of violence and a refrain that points to the need for righteous leadership.","outline":["Early deliverers (1–5)","Cycles of decline (6–16)","Moral chaos (17–21)"],"themes":["Leadership","Idolatry","Deliverance"],"era":2,"authorOptions":["Samuel (traditional attribution)","An unnamed monarchic-period writer","A later exilic compiler"],"places":["Canaan"],"relations":["Ruth","1 Samuel"]},{"id":7,"name":"Ruth","section":1,"testament":"OT","author":"Samuel (traditional attribution; author unknown; an anonymous Israelite storyteller is a common alternative).","date":"Possibly monarchic to postexilic era; uncertain","purpose":"Tell how the widowed Ruth accompanied Naomi to Bethlehem, gleaned in Boaz's field, and married him through a family-redeemer arrangement. The account explains how a Moabite woman entered the family line of King David, and ultimately Jesus, amid the troubled era of the judges.","verses":[{"ref":"1:16–17","why":"Ruth's loyalty"},{"ref":"2:12","why":"refuge under God"},{"ref":"4:17","why":"lineage of David"}],"summary":"In a period of famine and loss, Ruth remains loyal to her mother-in-law Naomi and follows her to Bethlehem. Through the integrity of Ruth and Boaz, God provides protection, redemption, and a new family. Their child becomes an ancestor of King David, linking a small family story to God's larger purposes.","outline":["Loss and loyalty (1)","Kindness in the fields (2)","Redemption and lineage (3–4)"],"themes":["Loyalty","Providence","Redemption"],"era":2,"authorOptions":["Samuel (traditional attribution)","An unnamed royal-era storyteller","A later postexilic writer"],"places":["Moab","Bethlehem"],"relations":["Matthew","1 Samuel"]},{"id":8,"name":"1 Samuel","section":1,"testament":"OT","author":"Samuel (linked to early prophetic sources; final author unknown; materials may also derive from Nathan, Gad, and later editors).","date":"Likely assembled in exilic era; events c. 1100s–1000 BC","purpose":"Trace Israel's transition from the judges to kingship through Samuel's ministry, Saul's selection and downfall, and David's anointing and rise—including his encounter with Goliath. It establishes how the monarchy began and why David, rather than Saul, became the central royal figure.","verses":[{"ref":"8:7","why":"Israel rejects divine kingship"},{"ref":"15:22","why":"obedience over sacrifice"},{"ref":"16:7","why":"God sees the heart"}],"summary":"Samuel guides Israel at a turning point from judges to monarchy. Saul becomes king but repeatedly fails to obey God, while David is chosen and anointed as his successor. The book contrasts human expectations of power with God's concern for the heart and covenant faithfulness.","outline":["Samuel and the ark (1–7)","Rise and failure of Saul (8–15)","David and Saul (16–31)"],"themes":["Kingship","Obedience","Heart"],"era":3,"authorOptions":["Samuel (early traditions)","Nathan (prophetic records)","Gad (prophetic records)"],"places":["Samaria","Jerusalem"],"relations":["2 Samuel","Psalms"]},{"id":9,"name":"2 Samuel","section":1,"testament":"OT","author":"Nathan (traditionally associated with Gad and prophetic records; final author and editors unknown).","date":"Likely assembled in exilic era; events c. 1000–970 BC","purpose":"Document David's reign: the unification of the tribes, establishment of Jerusalem, promise of an enduring dynasty, and crises following his sin with Bathsheba. It preserves the origins of the Davidic kingship that later biblical writers associate with the promised Messiah.","verses":[{"ref":"7:12–16","why":"Davidic covenant"},{"ref":"12:13","why":"repentance"},{"ref":"22:31","why":"God's trustworthy way"}],"summary":"David consolidates his kingdom and receives God's promise of an enduring royal dynasty. His adultery with Bathsheba and the killing of Uriah bring grievous consequences to his family and nation. Even through judgment and disorder, the book keeps God's covenant promise in view.","outline":["Kingdom established (1–10)","David's sin and aftermath (11–20)","Reflections on his reign (21–24)"],"themes":["Covenant","Leadership","Repentance"],"era":3,"authorOptions":["Nathan (prophetic records)","Gad (prophetic records)","A later historical compiler"],"places":["Jerusalem"],"relations":["1 Kings","Luke"]},{"id":10,"name":"1 Kings","section":1,"testament":"OT","author":"Jeremiah (traditional candidate; author unknown; many scholars instead favor anonymous exilic historians or editors).","date":"Likely 6th c. BC final form; covers c. 970–850 BC","purpose":"Recount Solomon's reign and construction of the Jerusalem temple, the kingdom's division after his death, and the rival royal houses that followed, including Elijah's confrontations with Ahab. It explains the split between Israel and Judah and the struggle over legitimate worship.","verses":[{"ref":"3:9","why":"wisdom in leadership"},{"ref":"8:27","why":"God transcends the temple"},{"ref":"18:21","why":"divided allegiance"}],"summary":"Solomon begins his reign with wisdom and builds the temple in Jerusalem. His compromises contribute to the kingdom's division after his death, and later rulers repeatedly turn toward idolatry. Elijah's ministry confronts false worship and calls Israel back to the living God.","outline":["Solomon and temple (1–11)","Divided kingdom (12–16)","Elijah and royal conflict (17–22)"],"themes":["Wisdom","Idolatry","Kingship"],"era":4,"authorOptions":["Jeremiah (traditional attribution)","A Deuteronomistic historian","An exilic editorial school"],"places":["Jerusalem","Samaria"],"relations":["2 Kings","Ecclesiastes"]},{"id":11,"name":"2 Kings","section":1,"testament":"OT","author":"Jeremiah (traditional candidate; author unknown; many scholars instead favor anonymous exilic historians or editors).","date":"Likely 6th c. BC final form; covers c. 850–560 BC","purpose":"Continue the history of Israel and Judah through Elisha, royal reforms, the Assyrian conquest of Samaria, and Babylon's destruction of Jerusalem. It explains the loss of both kingdoms and the exile, ending with a small sign that David's royal line has not disappeared.","verses":[{"ref":"17:13–15","why":"warnings ignored"},{"ref":"22:19","why":"responsive humility"},{"ref":"25:27–30","why":"Davidic hope"}],"summary":"Elisha's ministry opens the book amid turmoil in Israel and Judah. Despite prophetic warnings and occasional reforms, Israel falls to Assyria and Judah eventually falls to Babylon. The exile displays the consequences of persistent covenant rejection, while the ending offers a small sign of hope for David's line.","outline":["Elisha and both kingdoms (1–13)","Assyrian judgment (14–17)","Judah to Babylonian exile (18–25)"],"themes":["Judgment","Prophets","Exile"],"era":4,"authorOptions":["Jeremiah (traditional attribution)","A Deuteronomistic historian","An exilic editorial school"],"places":["Samaria","Jerusalem","Babylon"],"relations":["Jeremiah","Ezra"]},{"id":12,"name":"1 Chronicles","section":1,"testament":"OT","author":"Ezra (traditional attribution; author unknown; many scholars posit an anonymous Chronicler).","date":"Likely 5th–4th c. BC","purpose":"Retell Israel's ancestry through genealogies and revisit David's reign, with special attention to the ark, Levites, temple worship, and preparations for Solomon's temple. Written for a later community, it connects the people returning from exile to their ancestral and religious institutions.","verses":[{"ref":"16:11","why":"seek God's presence"},{"ref":"17:11–14","why":"Davidic promise"},{"ref":"29:11","why":"God reigns"}],"summary":"Genealogies connect postexilic readers to the story of God's covenant people. The narrative then focuses on David, emphasizing worship, priestly organization, and preparation for the temple. By retelling Israel's past selectively, the book offers hope and a renewed identity centered on God's promises.","outline":["Genealogies (1–9)","David's rise (10–21)","Temple preparation (22–29)"],"themes":["Identity","Worship","Davidic covenant"],"era":3,"authorOptions":["Ezra (traditional attribution)","An unknown temple-connected scribe","A later postexilic compiler"],"places":["Jerusalem"],"relations":["2 Samuel","Ezra"]},{"id":13,"name":"2 Chronicles","section":1,"testament":"OT","author":"Ezra (traditional attribution; author unknown; many scholars posit an anonymous Chronicler).","date":"Likely 5th–4th c. BC","purpose":"Retell the reigns of Solomon and Judah's kings, focusing on the temple, priesthood, worship reforms, and reasons for exile. Its conclusion with Cyrus's decree to rebuild the temple helps a postexilic community understand both its collapse and its opportunity to begin again.","verses":[{"ref":"7:14","why":"humble repentance"},{"ref":"16:9","why":"God seeks faithful hearts"},{"ref":"36:23","why":"permission to return"}],"summary":"Solomon's temple and dedication occupy the opening chapters. The rest of the book recounts Judah's kings with particular emphasis on worship, reform, and the consequences of forsaking God. It closes with exile and Cyrus's decree, looking toward restoration and renewed worship.","outline":["Solomon's temple (1–9)","Judah's kings (10–35)","Exile and return decree (36)"],"themes":["Worship","Reform","Restoration"],"era":4,"authorOptions":["Ezra (traditional attribution)","An unknown temple-connected scribe","A later postexilic compiler"],"places":["Jerusalem","Babylon"],"relations":["1 Kings","Ezra"]},{"id":14,"name":"Ezra","section":1,"testament":"OT","author":"Ezra (source of memoir material; final editor unknown).","date":"Likely 5th–4th c. BC","purpose":"Describe the return of Judean exiles under Persian authorization, the rebuilding of Jerusalem's altar and temple, and Ezra's later instruction in the law. It documents how temple worship and a distinct Jewish covenant community were reestablished after Babylonian exile.","verses":[{"ref":"3:11","why":"God's steadfast love"},{"ref":"7:10","why":"study and obey"},{"ref":"9:6","why":"confession"}],"summary":"Exiles return to Judah under Persian rule and rebuild the temple despite opposition. Decades later, Ezra arrives to teach the law and confront serious covenant failures. The book highlights the spiritual as well as physical work of rebuilding God's people.","outline":["Return and temple (1–6)","Ezra's mission (7–8)","Covenant crisis (9–10)"],"themes":["Return","Scripture","Reform"],"era":6,"authorOptions":["Ezra (memoirs and some material)","An anonymous postexilic compiler","A scribal circle that preserved return traditions"],"places":["Babylon","Jerusalem"],"relations":["Nehemiah","Haggai"]},{"id":15,"name":"Nehemiah","section":1,"testament":"OT","author":"Nehemiah (source of memoir material; final editor unknown).","date":"Likely 5th–4th c. BC","purpose":"Tell how Nehemiah organized the rebuilding of Jerusalem's walls despite opposition, alongside the public reading of the law and reforms of community life. It records the practical and religious reorganization of Jerusalem after exile, beyond the earlier rebuilding of the temple.","verses":[{"ref":"2:18","why":"rise and build"},{"ref":"8:10","why":"joy of the Lord"},{"ref":"9:17","why":"mercy and patience"}],"summary":"Nehemiah returns to Jerusalem and leads the rebuilding of its walls despite hostility and internal pressures. Ezra and the Levites help the people hear the law, confess sin, and renew their covenant. Further reforms expose the ongoing need for perseverance and wholehearted faithfulness.","outline":["Wall rebuilding (1–7)","Law and covenant renewal (8–10)","Community reform (11–13)"],"themes":["Leadership","Renewal","Perseverance"],"era":6,"authorOptions":["Nehemiah (memoir sections)","Ezra or a scribal associate (traditional theory)","An anonymous postexilic compiler"],"places":["Susa","Jerusalem"],"relations":["Ezra","Malachi"]},{"id":16,"name":"Esther","section":1,"testament":"OT","author":"Mordecai (traditional proposal; author unknown; an anonymous Jewish writer familiar with Persia is widely proposed).","date":"Possibly 4th–2nd c. BC; events in 5th c. BC","purpose":"Recount how Esther and Mordecai thwarted Haman's plan to destroy Jews living in the Persian Empire. The story explains the origin of the festival of Purim and preserves the memory of Jewish survival and courage while living far from Jerusalem.","verses":[{"ref":"4:14","why":"courage for such a time"},{"ref":"8:16","why":"reversal and joy"},{"ref":"9:22","why":"Purim remembered"}],"summary":"Esther becomes queen of Persia while concealing her Jewish identity. When Haman plots to destroy the Jews, Mordecai urges Esther to act with courage. A dramatic reversal preserves the people and establishes the celebration of Purim, illustrating providence operating through human choices.","outline":["Danger in Persia (1–4)","Reversal and rescue (5–8)","Purim and remembrance (9–10)"],"themes":["Providence","Courage","Deliverance"],"era":6,"authorOptions":["Mordecai (traditional proposal)","Ezra (later attribution)","An anonymous Jewish author familiar with Persia"],"places":["Susa"],"relations":["Ezra","Daniel"]},{"id":17,"name":"Job","section":2,"testament":"OT","author":"Moses (ancient proposal; author unknown; Solomon or an anonymous Israelite wisdom teacher have also been suggested, with no consensus).","date":"Perhaps 7th–4th c. BC; setting intentionally archaic","purpose":"Present the ordeal of a righteous sufferer, debates with friends who blame him, and God's final response from the whirlwind. The book challenges the assumption that suffering always results from personal wrongdoing and explores how people can speak about justice when they cannot see the whole story.","verses":[{"ref":"1:21","why":"worship amid loss"},{"ref":"19:25","why":"hope in a redeemer"},{"ref":"42:5","why":"deeper encounter with God"}],"summary":"Job, a righteous man, loses his possessions, children, and health in a profound test. His friends insist that suffering must signal wrongdoing, while Job challenges their simplistic explanations. God finally speaks of creation's vast complexity, inviting humility even where full explanations remain unavailable.","outline":["Trial and lament (1–3)","Debates and speeches (4–37)","God's answer and restoration (38–42)"],"themes":["Suffering","Wisdom","Trust"],"era":0,"authorOptions":["Moses (traditional proposal)","Solomon (traditional proposal)","An anonymous wisdom poet"],"places":["Edom"],"relations":["Psalms","James"]},{"id":18,"name":"Psalms","section":2,"testament":"OT","author":"David (principal named contributor; Asaph, the sons of Korah, Solomon, Moses, and anonymous poets also contributed).","date":"Collected over centuries; final form likely postexilic","purpose":"Collect Israel's prayers and songs—praise, lament, thanksgiving, royal psalms, confession, and wisdom—for personal devotion and communal worship. Their inclusion gives generations of worshipers biblical language for grief, joy, repentance, kingship, and expectation of God's future rule.","verses":[{"ref":"1:1–3","why":"blessed life"},{"ref":"23:1","why":"shepherd care"},{"ref":"150:6","why":"universal praise"}],"summary":"Psalms gathers Israel's songs and prayers across generations. Its poems move through lament, gratitude, confession, trust, royal hope, and exuberant worship. Together they teach believers to bring every season of life before God while awaiting his righteous reign.","outline":["Books I–II (1–72)","Books III–IV (73–106)","Book V and final praise (107–150)"],"themes":["Prayer","Worship","Hope"],"era":3,"places":["Jerusalem"],"relations":["Matthew","Hebrews"]},{"id":19,"name":"Proverbs","section":2,"testament":"OT","author":"Solomon (primary author by attribution; Agur, Lemuel, Hezekiah's scribes, and later editors also contributed).","date":"Collections from 10th c. BC onward; edited later","purpose":"Gather sayings and instructions about speech, money, work, family, friendship, sexuality, and leadership, framed by the fear of the Lord. It teaches practical discernment in ordinary life rather than recounting a single narrative or issuing laws for specific situations.","verses":[{"ref":"1:7","why":"fear of the Lord"},{"ref":"3:5–6","why":"trust and direction"},{"ref":"31:30","why":"enduring character"}],"summary":"Proverbs presents wisdom as a life shaped by reverence for God. Short sayings address speech, diligence, money, friendship, marriage, parenting, and justice. Its teachings invite readers to pursue discernment while recognizing that proverbs describe general patterns rather than unconditional guarantees.","outline":["Wisdom invitations (1–9)","Solomon's sayings (10–29)","Agur and Lemuel (30–31)"],"themes":["Wisdom","Character","Speech"],"era":3,"places":["Jerusalem"],"relations":["James","Ecclesiastes"]},{"id":20,"name":"Ecclesiastes","section":2,"testament":"OT","author":"Solomon (traditional identification with Qoheleth; author unknown; an anonymous wisdom teacher using a royal voice is also proposed).","date":"Possibly 5th–3rd c. BC; disputed","purpose":"Record the Teacher's examination of work, pleasure, wealth, injustice, time, and death under the sun. By repeatedly showing the limits of human achievement and control, it gives Scripture a sustained reflection on mortality and what makes life worth living.","verses":[{"ref":"3:1","why":"times and seasons"},{"ref":"12:1","why":"remember Creator"},{"ref":"12:13","why":"fear God"}],"summary":"The Teacher reflects on work, pleasure, injustice, time, and death under the sun. He finds that human efforts cannot secure lasting control or ultimate satisfaction in a fleeting world. The book commends receiving life as God's gift and concludes by calling readers to fear God and keep his commandments.","outline":["The puzzle of life (1–3)","Limits of toil and wisdom (4–11)","Aging and conclusion (12)"],"themes":["Meaning","Mortality","Reverence"],"era":3,"authorOptions":["Solomon (traditional identification)","A later sage using a Solomonic literary voice","An anonymous compiler/editor"],"places":["Jerusalem"],"relations":["Proverbs","James"]},{"id":21,"name":"Song of Solomon","section":2,"testament":"OT","author":"Solomon (traditional association; author unknown; an anonymous poet or several poets have also been proposed).","date":"Date uncertain; perhaps monarchic to postexilic","purpose":"Present a collection of poems voiced by lovers, depicting attraction, longing, delight, separation, and reunion. It gives romantic and embodied love a distinctive place in biblical wisdom literature, celebrating mutual desire and relationship rather than narrating Israel's public history.","verses":[{"ref":"2:16","why":"mutual belonging"},{"ref":"8:6–7","why":"powerful enduring love"}],"summary":"Song of Solomon is a collection of passionate love poetry expressed by lovers and their companions. It celebrates physical attraction, longing, admiration, and the desire for enduring commitment. Read within the wider canon, it honors the goodness of covenant love while leaving room for careful theological reflection.","outline":["Longing and courtship (1–3)","Delight and separation (4–6)","Reunion and lasting love (7–8)"],"themes":["Love","Delight","Commitment"],"era":3,"authorOptions":["Solomon (traditional attribution)","An anonymous court poet","An editor of earlier love poems"],"places":["Jerusalem"],"relations":["Genesis","Ephesians"]},{"id":22,"name":"Isaiah","section":3,"testament":"OT","author":"Isaiah son of Amoz (named prophet and traditional primary author; composition of later chapters is disputed).","date":"Core prophecies in 8th c. BC; later composition debated","purpose":"Collect prophecies responding to Judah's political crises, Assyrian threats, idolatry, exile, and eventual restoration. The book moves from warnings to visions of a coming Davidic ruler, the Lord's servant, renewed Zion, and blessing reaching the nations—central texts for later messianic interpretation.","verses":[{"ref":"6:8","why":"prophetic call"},{"ref":"53:5","why":"suffering servant"},{"ref":"61:1","why":"good news"}],"summary":"Isaiah condemns Judah's injustice and misplaced trust in political power. Alongside warnings of judgment, he announces a holy God who will preserve a remnant and bring future redemption. Images of the promised king, suffering servant, and new creation make Isaiah central to the Bible's hope of salvation.","outline":["Judgment and royal hope (1–39)","Comfort and servant (40–55)","Restoration and new creation (56–66)"],"themes":["Holiness","Servant","Restoration"],"era":4,"places":["Jerusalem","Babylon"],"relations":["Matthew","Romans"]},{"id":23,"name":"Jeremiah","section":3,"testament":"OT","author":"Jeremiah (named prophet; Baruch assisted as scribe, and later editors likely shaped the book).","date":"Late 7th–early 6th c. BC; final form later","purpose":"Preserve Jeremiah's warnings to Judah before Babylon conquered Jerusalem, his confrontations with false prophets, and his counsel to the exiles. It interprets the catastrophe as the consequence of long-standing covenant violations while announcing a future return and a new covenant.","verses":[{"ref":"1:5","why":"prophetic call"},{"ref":"29:11","why":"future hope for exiles"},{"ref":"31:31–34","why":"new covenant"}],"summary":"Jeremiah warns Judah that idolatry and injustice will bring Babylonian conquest. His personal suffering reflects the cost of faithful prophecy amid rejection. Even as Jerusalem falls, God promises eventual restoration and a new covenant written on his people's hearts.","outline":["Calls to repent (1–25)","Conflict and new covenant (26–45)","Nations and Jerusalem's fall (46–52)"],"themes":["Repentance","New covenant","Hope"],"era":4,"places":["Jerusalem","Babylon"],"relations":["Lamentations","Hebrews"]},{"id":24,"name":"Lamentations","section":3,"testament":"OT","author":"Jeremiah (leading traditional proposal; author unknown because the book does not identify its writer; alternative views propose an anonymous eyewitness poet or multiple poets).","date":"Shortly after Jerusalem's fall in 586 BC; final author unknown","purpose":"Give poetic voice to the siege, destruction, hunger, and grief that followed Jerusalem's fall in 586 BC. Its five laments preserve a way for a devastated community to mourn, confess, question, and appeal for mercy after losing its city and temple.","verses":[{"ref":"3:22–23","why":"mercies renewed"},{"ref":"3:25–26","why":"patient hope"},{"ref":"5:21","why":"restore us"}],"summary":"Five poems mourn the destruction of Jerusalem and the suffering of its people. The speaker acknowledges the gravity of sin and judgment without minimizing human pain. At the center, the poems recall God's compassion and encourage persistent hope and prayer for restoration.","outline":["City's grief (1–2)","Hope amid sorrow (3)","Ruin and plea for renewal (4–5)"],"themes":["Lament","Judgment","Mercy"],"era":5,"authorOptions":["Jeremiah (traditional attribution)","An unnamed survivor of Jerusalem’s fall","A poet or group of poets preserving communal lament"],"places":["Jerusalem"],"relations":["Jeremiah","Psalms"]},{"id":25,"name":"Ezekiel","section":3,"testament":"OT","author":"Ezekiel (named prophet; later collection and editing are possible).","date":"c. 593–571 BC; editing may be later","purpose":"Record the exiled priest Ezekiel's visions and prophetic actions surrounding Jerusalem's destruction, including the departure of God's glory, the valley of dry bones, and a restored temple. It explains exile to displaced Judeans and portrays their anticipated renewal and return.","verses":[{"ref":"18:32","why":"turn and live"},{"ref":"36:26","why":"new heart"},{"ref":"37:5","why":"dry bones live"}],"summary":"Ezekiel prophesies among exiles in Babylon through vivid visions and symbolic actions. He describes Jerusalem's judgment and exposes Israel's idolatry, but also foresees a transformed heart and restored community. The final vision of a renewed temple expresses hope for God's life-giving presence.","outline":["Judgment on Judah (1–24)","Oracles against nations (25–32)","New heart and restored presence (33–48)"],"themes":["Glory","Renewal","Presence"],"era":5,"places":["Babylon","Jerusalem"],"relations":["Jeremiah","Revelation"]},{"id":26,"name":"Daniel","section":3,"testament":"OT","author":"Daniel (traditional attribution; authorship and final composition disputed, with a later anonymous Jewish writer also proposed).","date":"Events 6th c. BC; composition dated 6th or 2nd c. BC across traditions","purpose":"Relate stories of Jewish fidelity under Babylonian and Persian rulers—such as the fiery furnace and lions' den—alongside visions of successive empires and divine judgment. It addresses how God's people can endure foreign domination while expecting a kingdom beyond earthly empires.","verses":[{"ref":"2:44","why":"everlasting kingdom"},{"ref":"6:22","why":"deliverance"},{"ref":"7:13–14","why":"son of man"}],"summary":"Daniel and his companions remain faithful while serving in foreign courts. God protects them through trials and reveals the limits of seemingly powerful empires. Apocalyptic visions depict conflict, judgment, and God's final rule, calling readers to patient endurance.","outline":["Court narratives (1–6)","Kingdom visions (7–9)","Final visions (10–12)"],"themes":["Kingdom","Faithfulness","Hope"],"era":5,"places":["Babylon","Susa"],"relations":["Matthew","Revelation"]},{"id":27,"name":"Hosea","section":4,"testament":"OT","author":"Hosea (named prophet; later editorial collection is possible).","date":"c. 750–715 BC","purpose":"Use Hosea's troubled marriage and the names of his children to portray the northern kingdom's infidelity through Baal worship and political alliances. The prophecies explain Israel's approaching collapse and describe the possibility of restoration after judgment.","verses":[{"ref":"6:6","why":"steadfast love over ritual"},{"ref":"11:1","why":"love for Israel"},{"ref":"14:4","why":"healing apostasy"}],"summary":"Hosea's difficult marriage becomes a prophetic picture of Israel's covenant infidelity. The prophet denounces idolatry, corruption, and shallow religion in the northern kingdom. Yet God's love remains steadfast, and the book ends by calling Israel to repentance and renewed fruitfulness.","outline":["Marriage as sign (1–3)","Charges against Israel (4–13)","Call to return (14)"],"themes":["Steadfast love","Idolatry","Repentance"],"era":4,"places":["Samaria"],"relations":["Romans","Matthew"]},{"id":28,"name":"Joel","section":4,"testament":"OT","author":"Joel (named prophet; his identity beyond the book is unknown).","date":"Date highly disputed, often 9th–5th c. BC","purpose":"Interpret a devastating locust plague as a summons to communal mourning and repentance, then look toward the day of the Lord. Its promise that God's Spirit will be poured out on all kinds of people becomes especially important in Acts 2.","verses":[{"ref":"2:12–13","why":"return wholeheartedly"},{"ref":"2:28–29","why":"Spirit poured out"},{"ref":"3:16","why":"God is refuge"}],"summary":"A devastating locust plague becomes the setting for a warning about the day of the Lord. Joel summons the whole community to repentance and prayer, trusting God's compassion. He anticipates restoration, the Spirit poured out broadly, and God's final judgment of evil.","outline":["Locust disaster (1)","Repentance and Spirit (2)","Judgment and refuge (3)"],"themes":["Day of the Lord","Spirit","Repentance"],"era":4,"places":["Jerusalem"],"relations":["Acts","Revelation"]},{"id":29,"name":"Amos","section":4,"testament":"OT","author":"Amos (named prophet from Tekoa; later editing is possible).","date":"c. 760–750 BC","purpose":"Deliver warnings to the prosperous northern kingdom for exploiting the poor, corrupting justice, and relying on religious ceremonies while practicing wrongdoing. Amos explains why apparent national success cannot shield Israel from judgment and ends with a vision of restoration.","verses":[{"ref":"5:24","why":"justice like waters"},{"ref":"5:21–23","why":"rejected ritual"},{"ref":"9:11","why":"David's tent restored"}],"summary":"Amos, a shepherd from Judah, confronts the prosperous northern kingdom of Israel. He exposes oppression of the poor and worship that conceals unrighteousness. Divine judgment is announced, yet the book closes with hope for a renewed people under God's restoring rule.","outline":["Oracles against nations (1–2)","Israel's injustice (3–6)","Visions and restoration (7–9)"],"themes":["Justice","Worship","Restoration"],"era":4,"places":["Samaria","Jerusalem"],"relations":["James","Acts"]},{"id":30,"name":"Obadiah","section":4,"testament":"OT","author":"Obadiah (named prophet; his identity is otherwise uncertain, and no widely accepted alternative named author exists).","date":"Date disputed, often around or after 586 BC","purpose":"Announce judgment against Edom for standing against its brother nation Judah during Jerusalem's calamity. The short prophecy addresses betrayal between neighboring peoples and envisions the reversal of Edom's triumph as the Lord's kingdom is established.","verses":[{"ref":"1:15","why":"day of the Lord"},{"ref":"1:17","why":"deliverance on Zion"},{"ref":"1:21","why":"kingdom belongs to the Lord"}],"summary":"Obadiah addresses Edom's pride and its betrayal of Judah during calamity. The prophet warns that those who exploit others' suffering will face God's judgment. The short book moves from Edom's downfall to the hope of deliverance and divine kingship.","outline":["Edom's arrogance (1–9)","Violence against Judah (10–14)","Day of the Lord (15–21)"],"themes":["Pride","Justice","Kingdom"],"era":5,"places":["Edom","Jerusalem"],"relations":["Jeremiah","Revelation"]},{"id":31,"name":"Jonah","section":4,"testament":"OT","author":"Jonah (traditional association with the prophet; actual narrator unknown and not identified in the story).","date":"Possibly 8th–4th c. BC; debated","purpose":"Tell how Jonah fled his commission to Nineveh, survived a great fish, saw the city repent, and resented God's mercy. The narrative challenges Israel's reluctance to see compassion extended to an enemy people and confronts the prophet's own attitudes.","verses":[{"ref":"2:9","why":"salvation belongs to the Lord"},{"ref":"3:10","why":"mercy toward Nineveh"},{"ref":"4:2","why":"God's compassion"}],"summary":"Jonah flees God's call to warn the Assyrian city of Nineveh and is rescued from the sea by a great fish. When Nineveh repents, God shows mercy rather than bringing the threatened destruction. Jonah's anger exposes the contrast between divine compassion and a prophet's reluctance to love enemies.","outline":["Flight and rescue (1–2)","Nineveh repents (3)","Mercy questioned (4)"],"themes":["Mercy","Repentance","Mission"],"era":4,"authorOptions":["Jonah son of Amittai (traditional proposal)","An unnamed preexilic narrator","A later postexilic storyteller"],"places":["Nineveh"],"relations":["Matthew","Nahum"]},{"id":32,"name":"Micah","section":4,"testament":"OT","author":"Micah of Moresheth (named prophet; later compilation is possible).","date":"c. 735–700 BC","purpose":"Condemn land seizures, dishonest rulers, and corrupt religious leaders in Samaria and Jerusalem while warning of the cities' coming downfall. It also preserves promises of a ruler from Bethlehem and a restored people gathered under God's peaceful reign.","verses":[{"ref":"5:2","why":"ruler from Bethlehem"},{"ref":"6:8","why":"justice, mercy, humility"},{"ref":"7:18","why":"God pardons"}],"summary":"Micah warns Samaria and Jerusalem that corruption and exploitation invite judgment. He especially confronts leaders who misuse power and religious people who neglect justice. Alongside these warnings, the prophet anticipates a ruler from Bethlehem and a future restoration grounded in God's mercy.","outline":["Judgment and hope (1–2)","Leaders and coming ruler (3–5)","Covenant lawsuit and mercy (6–7)"],"themes":["Justice","Messiah","Mercy"],"era":4,"places":["Jerusalem"],"relations":["Matthew","Isaiah"]},{"id":33,"name":"Nahum","section":4,"testament":"OT","author":"Nahum of Elkosh (named prophet; little other biographical information survives).","date":"c. 663–612 BC","purpose":"Proclaim the approaching downfall of Nineveh, the capital of Assyria, in vivid poetry about siege and destruction. Written against the backdrop of imperial brutality, it explains why the collapse of this oppressive power would be welcomed by those it conquered.","verses":[{"ref":"1:7","why":"refuge for the trusting"},{"ref":"1:15","why":"good news of peace"},{"ref":"3:19","why":"lasting ruin"}],"summary":"Nahum declares that the violent Assyrian capital of Nineveh will fall. The poetry portrays God's opposition to cruelty, exploitation, and arrogant imperial power. For Judah, the message offers comfort that injustice will not endure forever.","outline":["God's judgment (1)","Nineveh's downfall (2)","Reasons for judgment (3)"],"themes":["Justice","Judgment","Refuge"],"era":4,"places":["Nineveh"],"relations":["Jonah","Revelation"]},{"id":34,"name":"Habakkuk","section":4,"testament":"OT","author":"Habakkuk (named prophet; his personal background is otherwise unknown).","date":"c. 609–597 BC, commonly","purpose":"Preserve a prophet's dialogue with God over violence in Judah and the troubling prospect of Babylon being used to punish it. The exchange and closing prayer wrestle with delayed justice and ask how the righteous should live while awaiting God's answer.","verses":[{"ref":"2:4","why":"righteous live by faith"},{"ref":"2:14","why":"earth filled with God's glory"},{"ref":"3:19","why":"strength in God"}],"summary":"Habakkuk questions why God tolerates violence and then why a wicked empire will be used in judgment. God responds that arrogant power will not ultimately prevail and that the righteous must live by faithfulness. The prophet closes in worship, choosing joy in God even when circumstances fail.","outline":["Questions and answers (1–2)","Prayer and trust (3)"],"themes":["Faith","Justice","Trust"],"era":4,"places":["Jerusalem","Babylon"],"relations":["Romans","Galatians"]},{"id":35,"name":"Zephaniah","section":4,"testament":"OT","author":"Zephaniah (named prophet active in Josiah's reign).","date":"c. 640–609 BC","purpose":"Warn Judah, Jerusalem, and surrounding nations of a sweeping day of judgment during the era of King Josiah. Alongside the warnings, it anticipates a purified people and a restored Jerusalem, showing that judgment is not the book's final word.","verses":[{"ref":"1:14","why":"day approaching"},{"ref":"2:3","why":"seek humility"},{"ref":"3:17","why":"God rejoices over his people"}],"summary":"Zephaniah warns Judah and surrounding nations of God's coming judgment. Religious complacency, pride, and injustice are exposed as dangers for everyone. The book ends with a vision of a purified people gathered into God's joyful presence.","outline":["Coming judgment (1)","Seek the Lord (2)","Restoration and joy (3)"],"themes":["Judgment","Humility","Joy"],"era":4,"places":["Jerusalem"],"relations":["Revelation","Malachi"]},{"id":36,"name":"Haggai","section":4,"testament":"OT","author":"Haggai (named prophet whose messages form the book; a later compiler may have shaped it).","date":"520 BC","purpose":"Record dated prophetic messages urging returned exiles, including Zerubbabel and the high priest Joshua, to resume rebuilding Jerusalem's neglected temple. It explains the urgency of restoring a place of worship after the exile despite economic hardship and discouragement.","verses":[{"ref":"1:7–8","why":"consider your ways"},{"ref":"2:4–5","why":"work without fear"},{"ref":"2:9","why":"future glory"}],"summary":"Haggai speaks to returned exiles who have neglected rebuilding the temple while improving their own homes. He urges them to reorder their priorities around worship and trust God's presence. The people respond, and the prophet points toward a future glory surpassing their immediate circumstances.","outline":["Rebuild the house (1)","Encouragement and promise (2)"],"themes":["Priorities","Presence","Worship"],"era":6,"places":["Jerusalem"],"relations":["Ezra","Zechariah"]},{"id":37,"name":"Zechariah","section":4,"testament":"OT","author":"Zechariah (named prophet associated with chapters 1–8; authorship of chapters 9–14 is disputed).","date":"c. 520–518 BC for early oracles; later material debated","purpose":"Encourage Jerusalem's rebuilding community through night visions, symbolic acts, and prophecies concerning the priesthood, temple, a humble king, and future restoration. The book connects the immediate task of rebuilding with a larger hope for Jerusalem and the nations.","verses":[{"ref":"4:6","why":"by God's Spirit"},{"ref":"9:9","why":"humble king"},{"ref":"13:1","why":"cleansing fountain"}],"summary":"Zechariah uses night visions and prophetic messages to encourage a discouraged postexilic community. God promises to cleanse his people and empower their rebuilding by his Spirit. Later oracles anticipate a humble king, a pierced figure, and the Lord's ultimate reign.","outline":["Night visions (1–6)","True fasting and hope (7–8)","Coming king and kingdom (9–14)"],"themes":["Spirit","Messiah","Hope"],"era":6,"places":["Jerusalem"],"relations":["Matthew","Revelation"]},{"id":38,"name":"Malachi","section":4,"testament":"OT","author":"Malachi (traditional name; possibly a title meaning 'my messenger,' so the writer's identity is uncertain).","date":"Often c. 460–430 BC","purpose":"Confront corrupt priestly offerings, broken marriage commitments, withheld contributions, and public doubts about divine justice in the postexilic community. It closes the prophetic collection with an expectation of a coming messenger and day of the Lord.","verses":[{"ref":"1:6","why":"honor God's name"},{"ref":"3:1","why":"messenger prepares the way"},{"ref":"4:2","why":"sun of righteousness"}],"summary":"Malachi challenges priests and people who offer careless worship and break covenant commitments. The prophet addresses marriage, justice, giving, and the widespread belief that serving God is futile. He promises God's refining arrival and urges Israel to remember the law while awaiting a coming messenger.","outline":["Corrupt worship and relationships (1–2)","Purification and coming day (3–4)"],"themes":["Faithfulness","Worship","Preparation"],"era":6,"places":["Jerusalem"],"relations":["Mark","Luke"]},{"id":39,"name":"Matthew","section":5,"testament":"NT","author":"Matthew the apostle (traditional attribution; the Gospel itself is anonymous and authorship remains debated).","date":"Often c. AD 60–90","purpose":"Narrate Jesus' genealogy, birth, teaching, miracles, death, and resurrection, repeatedly linking his life with Israel's Scriptures. Its sustained presentation of Jesus as Messiah and teacher—including the Sermon on the Mount—explains the kingdom and commissions disciples to all nations.","verses":[{"ref":"5:3–12","why":"kingdom blessings"},{"ref":"16:16","why":"confession of Christ"},{"ref":"28:18–20","why":"Great Commission"}],"summary":"Matthew traces Jesus' life from his genealogy and birth through his teachings, miracles, death, and resurrection. Repeated connections to Israel's Scriptures present him as the promised king who fulfills God's purposes. The Gospel emphasizes kingdom ethics and ends with a commission to make disciples of all nations.","outline":["Messiah arrives (1–4)","Teaching and ministry (5–25)","Passion and resurrection (26–28)"],"themes":["Messiah","Kingdom","Discipleship"],"era":7,"authorOptions":["Matthew the apostle (church tradition)","An anonymous Greek-writing Jewish Christian author","An early church compiler drawing on apostolic traditions"],"places":["Bethlehem","Galilee","Jerusalem"],"relations":["Genesis","Isaiah","Mark"]},{"id":40,"name":"Mark","section":5,"testament":"NT","author":"John Mark (traditional attribution associated with Peter; the Gospel itself is anonymous).","date":"Often c. AD 60–75","purpose":"Tell the story of Jesus' public ministry, confrontations, journey to Jerusalem, suffering, crucifixion, and empty tomb in a fast-moving narrative. It centers on the question of Jesus' identity and explains why the Messiah's mission included suffering and death.","verses":[{"ref":"1:15","why":"kingdom at hand"},{"ref":"8:34","why":"take up the cross"},{"ref":"10:45","why":"servant gives life"}],"summary":"Mark tells Jesus' story in a swift narrative of healings, exorcisms, and confrontations. As the disciples struggle to understand, Jesus explains that the Messiah must suffer and calls them to take up the cross. The story culminates in his crucifixion and the announcement of resurrection.","outline":["Authority revealed (1–8)","Road to Jerusalem (8–10)","Passion and resurrection announcement (11–16)"],"themes":["Servanthood","Cross","Discipleship"],"era":7,"authorOptions":["John Mark (church tradition)","An anonymous early Christian narrator","A writer preserving Petrine memories"],"places":["Galilee","Jerusalem"],"relations":["Matthew","Luke"]},{"id":41,"name":"Luke","section":5,"testament":"NT","author":"Luke (traditional attribution to Paul's companion; the Gospel itself is anonymous).","date":"Often c. AD 60–90","purpose":"Provide an orderly account of Jesus' birth, ministry, parables, journey to Jerusalem, death, and resurrection for Theophilus and other readers. Its attention to women, the poor, Samaritans, and outsiders establishes the first volume of a story continued in Acts.","verses":[{"ref":"4:18–19","why":"good news to the poor"},{"ref":"19:10","why":"seek the lost"},{"ref":"24:46–49","why":"witnesses"}],"summary":"Luke tells the story of Jesus with attention to historical setting, prayer, women, the poor, and social outsiders. Jesus announces God's salvation and demonstrates mercy through teaching, healing, and table fellowship. His death and resurrection lead into the church's mission continued in Acts.","outline":["Birth and preparation (1–4)","Galilean ministry and journey (4–19)","Jerusalem, cross, and resurrection (19–24)"],"themes":["Salvation","Mercy","Mission"],"era":7,"authorOptions":["Luke, companion of Paul (church tradition)","An anonymous educated early Christian author","A member of the Pauline mission circle"],"places":["Bethlehem","Galilee","Jerusalem"],"relations":["Acts","Matthew"]},{"id":42,"name":"John","section":5,"testament":"NT","author":"John the apostle (traditional attribution; other Johannine writers or editors are also proposed).","date":"Often c. AD 80–100","purpose":"Select Jesus' signs, conversations, 'I am' sayings, death, and resurrection to make a case for his identity as the Messiah and Son of God. The Gospel states its aim directly: that readers may believe and have life in his name (20:30–31).","verses":[{"ref":"1:14","why":"Word became flesh"},{"ref":"3:16","why":"divine love"},{"ref":"20:31","why":"purpose of belief"}],"summary":"John opens by identifying Jesus as the eternal Word made flesh. Selected signs, extended conversations, and intimate teaching reveal his identity and invite faith. The Gospel culminates in the cross, resurrection, and a commission to bear witness to him.","outline":["Prologue and signs (1–12)","Farewell and passion (13–19)","Resurrection and witness (20–21)"],"themes":["Belief","Eternal life","Love"],"era":7,"authorOptions":["John son of Zebedee (church tradition)","John the Elder (ancient proposal)","A Johannine community writer/editor"],"places":["Galilee","Jerusalem"],"relations":["1 John","Revelation"]},{"id":43,"name":"Acts","section":5,"testament":"NT","author":"Luke (traditional attribution to Paul's companion; Acts itself is anonymous).","date":"Often c. AD 62–90","purpose":"Continue Luke's account from Jesus' ascension and Pentecost through Peter's preaching, the inclusion of Gentiles, the Jerusalem council, and Paul's journeys to Rome. It explains how the early Christian movement grew from Jerusalem into an international church.","verses":[{"ref":"1:8","why":"witness to the ends of earth"},{"ref":"2:42","why":"church life"},{"ref":"20:24","why":"finish the mission"}],"summary":"Acts begins with Jesus' ascension and the coming of the Holy Spirit at Pentecost. The gospel spreads from Jerusalem through Judea and Samaria, then across the Roman world through witnesses including Peter and Paul. The book emphasizes the Spirit's guidance, perseverance under opposition, and the inclusion of Gentiles in God's people.","outline":["Jerusalem church (1–7)","Beyond Jerusalem (8–12)","Paul's missions and Rome (13–28)"],"themes":["Spirit","Church","Mission"],"era":8,"authorOptions":["Luke, companion of Paul (church tradition)","An anonymous writer of Luke–Acts","A Pauline mission associate"],"places":["Jerusalem","Antioch","Ephesus","Corinth","Rome"],"relations":["Luke","Romans","Galatians"]},{"id":44,"name":"Romans","section":6,"testament":"NT","author":"Paul (named author; Tertius served as scribe).","date":"c. AD 56–58","purpose":"Explain Paul's gospel to Christians in Rome: humanity's sin, justification through Christ, life in the Spirit, Israel's place in God's purposes, and the ethics of a united church. The letter addresses tensions between Jewish and Gentile believers and prepares for Paul's hoped-for mission to Spain.","verses":[{"ref":"1:16–17","why":"gospel's power"},{"ref":"3:23–24","why":"grace and justification"},{"ref":"12:1–2","why":"transformed worship"}],"summary":"Paul explains humanity's universal need for salvation and God's justification through faith in Jesus Christ. He explores new life in the Spirit, Israel's place in God's purposes, and the mercy shown to Jews and Gentiles. The letter concludes with practical instructions for transformed relationships and unity in the church.","outline":["Sin and justification (1–5)","New life and Israel (6–11)","Christian conduct (12–16)"],"themes":["Justification","Grace","Unity"],"era":9,"places":["Rome","Corinth"],"relations":["Galatians","Ephesians"]},{"id":45,"name":"1 Corinthians","section":6,"testament":"NT","author":"Paul (named author; Sosthenes also appears in the greeting).","date":"c. AD 53–55","purpose":"Address specific problems reported in Corinth: church factions, sexual misconduct, lawsuits, marriage questions, food offered to idols, disorder in worship, spiritual gifts, and confusion about resurrection. It shows how the gospel should reshape an actual, deeply divided congregation.","verses":[{"ref":"1:18","why":"message of the cross"},{"ref":"13:4–7","why":"love"},{"ref":"15:3–4","why":"resurrection gospel"}],"summary":"Paul writes to a gifted but divided church struggling with morality, worship, and public witness. He addresses disputes, marriage, spiritual gifts, and the necessity of self-giving love. His lengthy defense of bodily resurrection anchors Christian hope and faithful labor.","outline":["Unity and holiness (1–6)","Relationships and worship (7–14)","Resurrection and closing (15–16)"],"themes":["Church","Unity","Resurrection"],"era":9,"places":["Corinth","Ephesus"],"relations":["2 Corinthians","Romans"]},{"id":46,"name":"2 Corinthians","section":6,"testament":"NT","author":"Paul (named author; Timothy also appears in the greeting).","date":"c. AD 55–56","purpose":"Respond to tensions between Paul and the Corinthian church, defend his apostleship against rival claims, and encourage participation in a collection for believers in Jerusalem. His account of weakness, suffering, and reconciliation clarifies what credible Christian ministry looks like.","verses":[{"ref":"4:7","why":"treasure in jars of clay"},{"ref":"5:17","why":"new creation"},{"ref":"12:9","why":"grace sufficient"}],"summary":"Paul opens his heart about suffering, comfort, and the integrity of his ministry. He urges the Corinthians toward reconciliation and generous support for believers in need. Against boasts of impressive power, he portrays authentic service as Christlike weakness sustained by divine grace.","outline":["Comfort and ministry (1–7)","Generosity (8–9)","Apostolic defense (10–13)"],"themes":["Weakness","Reconciliation","Generosity"],"era":9,"places":["Corinth"],"relations":["1 Corinthians","Philippians"]},{"id":47,"name":"Galatians","section":6,"testament":"NT","author":"Paul (named author; he defends his apostolic commission in the letter).","date":"c. AD 48–55; destination and chronology debated","purpose":"Oppose teachers pressuring Gentile Christians in Galatia to accept circumcision and Mosaic-law observance as necessary for full belonging. Paul defends his apostolic gospel, argues from Abraham and Christ, and explains freedom and life by the Spirit.","verses":[{"ref":"2:16","why":"justification through faith"},{"ref":"3:28","why":"unity in Christ"},{"ref":"5:22–23","why":"Spirit's fruit"}],"summary":"Paul confronts teachers who require Gentile Christians to adopt the Jewish law as a condition of belonging. He insists that people are justified through faith in Christ rather than works of the law. Genuine freedom is not selfish license but loving service and a life shaped by the Spirit.","outline":["Gospel defended (1–2)","Promise and law (3–4)","Freedom and Spirit (5–6)"],"themes":["Grace","Freedom","Spirit"],"era":9,"places":["Antioch","Ephesus"],"relations":["Romans","Acts"]},{"id":48,"name":"Ephesians","section":6,"testament":"NT","author":"Paul (traditional attribution; some scholars propose an anonymous later Pauline writer).","date":"c. AD 60–90, depending on authorship","purpose":"Explain how Christ has formed one people from Jews and Gentiles, then describe the church as his body and household. The letter applies that identity to unity, maturity, family relationships, and resistance to spiritual evil.","verses":[{"ref":"2:8–10","why":"salvation by grace"},{"ref":"2:14","why":"Christ our peace"},{"ref":"6:10–18","why":"spiritual armor"}],"summary":"Ephesians praises God's grace in choosing, redeeming, and uniting people through Christ. The church is portrayed as one new humanity, breaking down hostility between Jews and Gentiles. Believers are called to mature unity, holiness, love, and faithfulness in their households and spiritual lives.","outline":["New identity in Christ (1–3)","Life in community (4–5)","Households and spiritual struggle (5–6)"],"themes":["Unity","Grace","Church"],"era":10,"places":["Ephesus"],"relations":["Colossians","Romans"]},{"id":49,"name":"Philippians","section":6,"testament":"NT","author":"Paul (named author; Timothy also appears in the greeting).","date":"c. AD 55–62; imprisonment location debated","purpose":"Thank the Philippian church for its partnership and financial gift, update them on Paul's imprisonment, and urge unity amid opposition. The portrait of Christ's humility and Paul's own circumstances show how a congregation can persevere together.","verses":[{"ref":"1:21","why":"Christ is life"},{"ref":"2:5–11","why":"humility of Jesus"},{"ref":"4:4–7","why":"rejoice and pray"}],"summary":"Writing from imprisonment, Paul thanks the Philippians for their partnership in the gospel. He points to Christ's self-emptying humility as the model for Christian unity and service. The letter calls for joy, perseverance, contentment, and prayer amid hardship.","outline":["Partnership in suffering (1)","Christlike humility (2)","Press on with joy (3–4)"],"themes":["Joy","Humility","Perseverance"],"era":10,"places":["Philippi","Rome"],"relations":["2 Corinthians","1 Thessalonians"]},{"id":50,"name":"Colossians","section":6,"testament":"NT","author":"Paul (traditional attribution; Timothy is named in the greeting, and some scholars propose a later Pauline disciple).","date":"c. AD 60–80, depending on authorship","purpose":"Address teachings that threatened to supplement or diminish Christ through religious regulations and spiritual intermediaries. Paul emphasizes Christ's supremacy over creation and the church, then describes how belonging to him changes worship, conduct, and household life.","verses":[{"ref":"1:15–20","why":"Christ supreme"},{"ref":"2:9–10","why":"fullness in Christ"},{"ref":"3:12–14","why":"put on love"}],"summary":"Colossians exalts Jesus Christ as the image of the invisible God and head of the church. The letter warns against philosophies and regulations that distract from his sufficiency. Because believers are raised with Christ, they are to reject old patterns and practice compassion, forgiveness, and love.","outline":["Supremacy of Christ (1)","Fullness and freedom (2)","New life and relationships (3–4)"],"themes":["Christ","Fullness","New life"],"era":10,"places":["Colossae"],"relations":["Ephesians","Philemon"]},{"id":51,"name":"1 Thessalonians","section":6,"testament":"NT","author":"Paul (principal named author; Silvanus and Timothy also appear in the greeting).","date":"c. AD 49–51","purpose":"Reassure a newly established Thessalonian church facing hostility, encourage sexual holiness and mutual care, and answer concerns about believers who died before Christ's return. It preserves one of Paul's earliest pastoral explanations of Christian hope in the resurrection.","verses":[{"ref":"4:3","why":"God's will is holiness"},{"ref":"4:13–18","why":"resurrection hope"},{"ref":"5:16–18","why":"rejoice and pray"}],"summary":"Paul encourages Thessalonian believers who have remained faithful despite persecution. He commends their love and urges sexual holiness, brotherly care, and diligent work. Teaching about Christ's return comforts those grieving deceased believers and strengthens alert, hopeful living.","outline":["Thanksgiving and example (1–3)","Holiness and hope (4–5)"],"themes":["Hope","Holiness","Endurance"],"era":9,"places":["Thessalonica"],"relations":["2 Thessalonians","Acts"]},{"id":52,"name":"2 Thessalonians","section":6,"testament":"NT","author":"Paul (traditional attribution; Silvanus and Timothy are also named; some scholars question Pauline authorship).","date":"c. AD 50–52, or later if non-Pauline","purpose":"Correct claims that the day of the Lord had already arrived, strengthen a persecuted church, and rebuke members refusing to work. It clarifies the community's response to end-times speculation and insists on steady, responsible living.","verses":[{"ref":"2:1–3","why":"do not be shaken"},{"ref":"2:15","why":"stand firm"},{"ref":"3:10–13","why":"work and do good"}],"summary":"The church faces persecution and anxiety about the timing of Christ's return. Paul or a writer in his name warns against false claims and calls believers to stand firm in apostolic teaching. Practical instruction addresses idleness and encourages quiet, responsible work.","outline":["Endurance in trouble (1)","Day of the Lord (2)","Work and steadfastness (3)"],"themes":["Endurance","Hope","Responsibility"],"era":9,"places":["Thessalonica"],"relations":["1 Thessalonians","Revelation"]},{"id":53,"name":"1 Timothy","section":6,"testament":"NT","author":"Paul (traditional attribution; some scholars favor an anonymous later writer in the Pauline tradition).","date":"c. AD 62–65 or late 1st–early 2nd c.","purpose":"Instruct Timothy on confronting false teaching in Ephesus and organizing church life, public worship, care for widows, and qualifications for overseers and deacons. The letter supplies practical guidance for safeguarding teaching and selecting congregational leaders.","verses":[{"ref":"3:1–7","why":"overseer character"},{"ref":"4:12","why":"example in conduct"},{"ref":"6:6","why":"godliness with contentment"}],"summary":"Paul instructs Timothy in guarding the church against false teaching. The letter discusses prayer, worship, leadership qualifications, and care for vulnerable members. It emphasizes that doctrinal integrity must be matched by godly character and wise stewardship.","outline":["Truth and worship (1–2)","Leaders and community (3–5)","Contentment and charge (6)"],"themes":["Leadership","Doctrine","Godliness"],"era":10,"places":["Ephesus"],"relations":["2 Timothy","Titus"]},{"id":54,"name":"2 Timothy","section":6,"testament":"NT","author":"Paul (traditional attribution; some scholars favor an anonymous later writer in the Pauline tradition).","date":"c. AD 64–67 or later if pseudonymous","purpose":"Present Paul's urgent instructions to Timothy to preserve and teach the apostolic message, train dependable successors, endure opposition, and preach Scripture. Written in the voice of a final pastoral charge, it emphasizes continuity of the gospel beyond one generation of leaders.","verses":[{"ref":"1:7","why":"Spirit of power and love"},{"ref":"3:16–17","why":"Scripture equips"},{"ref":"4:7","why":"finished the race"}],"summary":"In a personal and urgent letter, Paul encourages Timothy to remain courageous under opposition. He warns about corrupt teaching and stresses the enduring authority of Scripture. His reflections on approaching death reinforce the call to preach faithfully and complete one's ministry.","outline":["Guard the gospel (1)","Endure as worker (2)","Scripture and final charge (3–4)"],"themes":["Scripture","Courage","Perseverance"],"era":10,"places":["Rome"],"relations":["1 Timothy","Titus"]},{"id":55,"name":"Titus","section":6,"testament":"NT","author":"Paul (traditional attribution; some scholars favor an anonymous later writer in the Pauline tradition).","date":"c. AD 62–65 or later if pseudonymous","purpose":"Direct Titus to appoint qualified elders on Crete, counter misleading teachers, and instruct different groups within the churches. It links sound teaching to visible conduct as emerging congregations establish healthy leadership and communal practices.","verses":[{"ref":"1:5–9","why":"appoint elders"},{"ref":"2:11–14","why":"grace trains godliness"},{"ref":"3:5","why":"mercy saves"}],"summary":"Paul instructs Titus to appoint qualified elders and resist destructive teaching in Crete. The letter addresses conduct across generations and social roles, linking sound doctrine with visible good works. It grounds transformed living in God's saving grace and mercy rather than human merit.","outline":["Leaders and false teaching (1)","Gospel-shaped living (2)","Grace and public conduct (3)"],"themes":["Leadership","Grace","Good works"],"era":10,"places":["Crete"],"relations":["1 Timothy","James"]},{"id":56,"name":"Philemon","section":6,"testament":"NT","author":"Paul (named author; Timothy also appears in the greeting).","date":"c. AD 55–62; imprisonment location debated","purpose":"Ask Philemon, a Christian householder, to receive Onesimus—an enslaved man who has become Paul's fellow believer—not merely in his former social role but as a brother. The personal appeal shows the consequences of Christian reconciliation for an unequal relationship.","verses":[{"ref":"1:6","why":"faith active in love"},{"ref":"1:15–16","why":"beloved brother"},{"ref":"1:17","why":"receive him as me"}],"summary":"Paul writes to Philemon on behalf of Onesimus, a man bound to Philemon's household who has become Paul's beloved brother in Christ. Rather than issuing a harsh command, Paul appeals to love and shared faith. The brief letter shows how the gospel presses believers to treat one another with costly dignity and reconciliation.","outline":["Thanksgiving (1–7)","Appeal for Onesimus (8–21)","Closing (22–25)"],"themes":["Reconciliation","Brotherhood","Love"],"era":10,"places":["Colossae"],"relations":["Colossians","Ephesians"]},{"id":57,"name":"Hebrews","section":7,"testament":"NT","author":"Apollos (plausible proposed author; actual author unknown; Barnabas, Paul, and Priscilla have also been suggested without consensus).","date":"Often c. AD 60–90; precise dating debated","purpose":"Argue that Jesus surpasses angels, Moses, the Levitical priesthood, and the old sacrificial system because his priesthood and self-offering establish a better covenant. Using Israel's Scriptures, the sermon urges a pressured Christian community not to abandon its confession.","verses":[{"ref":"1:1–3","why":"Son reveals God"},{"ref":"4:14–16","why":"great high priest"},{"ref":"12:1–2","why":"run with endurance"}],"summary":"Hebrews presents Jesus as greater than angels, Moses, and the Levitical priesthood. His once-for-all sacrifice opens enduring access to God under a better covenant. Through examples of faithful endurance and serious warnings, the author urges believers not to abandon their hope in Christ.","outline":["Christ's superiority (1–4)","Priesthood and sacrifice (5–10)","Faith and endurance (11–13)"],"themes":["Priesthood","Faith","Perseverance"],"era":10,"authorOptions":["Paul (ancient attribution; now widely doubted)","Barnabas (early church proposal)","Apollos (later influential proposal)"],"places":["Jerusalem","Rome"],"relations":["Leviticus","Psalms"]},{"id":58,"name":"James","section":7,"testament":"NT","author":"James, brother of Jesus (traditional identification; exact authorship is debated).","date":"Often c. AD 40–90","purpose":"Instruct dispersed believers on enduring trials, avoiding favoritism, caring for the poor, controlling speech, and reconciling faith with deeds. Its practical teaching exposes the difference between merely professing belief and living it in a community.","verses":[{"ref":"1:22","why":"doers of the word"},{"ref":"2:17","why":"faith and works"},{"ref":"3:17","why":"wisdom from above"}],"summary":"James writes practical exhortations for believers facing trials and social tensions. He warns against favoritism, careless speech, self-centered ambition, and neglect of the poor. Living faith is shown in endurance, humility, prayer, and concrete obedience.","outline":["Trials and obedience (1)","Faith, works, and speech (2–3)","Humility and prayer (4–5)"],"themes":["Works","Wisdom","Integrity"],"era":8,"places":["Jerusalem"],"relations":["Proverbs","Galatians"]},{"id":59,"name":"1 Peter","section":7,"testament":"NT","author":"Peter the apostle (traditional attribution; some scholars question direct authorship, and Silvanus is mentioned in 5:12).","date":"Often c. AD 60–90","purpose":"Address Christians scattered across Asia Minor who face hostility and social exclusion, reminding them of their identity and instructing them in holy conduct. The letter treats suffering, public witness, and relationships within households and churches as part of following Christ.","verses":[{"ref":"1:3–5","why":"living hope"},{"ref":"2:9","why":"chosen people"},{"ref":"3:15","why":"gentle witness"}],"summary":"First Peter addresses believers living as outsiders amid hostility. It grounds their identity in the resurrection of Christ and calls them to holiness, love, and honorable conduct. Jesus' suffering and vindication provide the pattern and hope for enduring unjust treatment.","outline":["Living hope and identity (1–2)","Witness amid trials (2–4)","Shepherding and perseverance (5)"],"themes":["Hope","Suffering","Holiness"],"era":10,"places":["Rome","Ephesus"],"relations":["2 Peter","James"]},{"id":60,"name":"2 Peter","section":7,"testament":"NT","author":"Peter the apostle (traditional attribution; direct authorship is widely disputed, with an anonymous later writer also proposed).","date":"c. AD 60–130; debated","purpose":"Warn churches about teachers who exploit others, promote immoral conduct, and mock the promise of Christ's return. By appealing to apostolic testimony and earlier biblical judgments, it urges readers to recognize deception and await the promised renewal.","verses":[{"ref":"1:3–8","why":"grow in virtue"},{"ref":"1:20–21","why":"prophecy and Spirit"},{"ref":"3:9","why":"divine patience"}],"summary":"Second Peter urges believers to grow in godliness and hold fast to apostolic witness. The writer exposes false teachers who exploit others and mock judgment. God's patience should lead to repentance, while the promise of a renewed creation calls for holy living.","outline":["Virtue and witness (1)","False teachers (2)","Lord's return and holy living (3)"],"themes":["Truth","Holiness","Hope"],"era":11,"places":["Rome"],"relations":["1 Peter","Jude"]},{"id":61,"name":"1 John","section":7,"testament":"NT","author":"John the apostle (traditional attribution; the letter itself is anonymous and a Johannine associate may have written it).","date":"Often c. AD 85–100","purpose":"Address a community shaken by teachers who departed and disputed central claims about Jesus. The letter offers tests of authentic fellowship—confessing Jesus Christ come in the flesh, obedience, and love—and reassurance of eternal life.","verses":[{"ref":"1:9","why":"confess sins"},{"ref":"3:16","why":"love in action"},{"ref":"5:13","why":"assurance of life"}],"summary":"First John addresses confusion caused by teachers who deny essential truths about Jesus. It ties genuine fellowship with God to confession of Christ, obedience, and love for fellow believers. The letter repeatedly offers assurance of eternal life while warning against deception and hatred.","outline":["Walking in light (1–2)","Love and discernment (3–4)","Assurance and prayer (5)"],"themes":["Love","Truth","Assurance"],"era":11,"authorOptions":["John son of Zebedee (tradition)","John the Elder (proposal)","A Johannine community teacher"],"places":["Ephesus"],"relations":["John","2 John"]},{"id":62,"name":"2 John","section":7,"testament":"NT","author":"John the apostle (traditional identification; the author calls himself 'the elder,' potentially a different Johannine leader).","date":"Often c. AD 85–100","purpose":"Urge the recipient, addressed as the 'elect lady,' to maintain love and truth while refusing hospitality that would assist teachers who deny Jesus Christ's coming in the flesh. It applies doctrinal discernment to the practical question of whom a church should support.","verses":[{"ref":"1:6","why":"walk in love"},{"ref":"1:7","why":"beware deceivers"},{"ref":"1:9","why":"remain in Christ's teaching"}],"summary":"The elder commends a community for walking in truth and love. He warns against itinerant teachers who deny the full reality of Jesus Christ's coming in the flesh. Love and discernment must remain together in the church's hospitality and mission.","outline":["Love and truth (1–6)","Caution against deceivers (7–11)","Farewell (12–13)"],"themes":["Truth","Love","Discernment"],"era":11,"authorOptions":["John son of Zebedee (tradition)","John the Elder (proposal)","A Johannine community teacher"],"places":["Ephesus"],"relations":["1 John","3 John"]},{"id":63,"name":"3 John","section":7,"testament":"NT","author":"John the apostle (traditional identification; the author calls himself 'the elder,' potentially a different Johannine leader).","date":"Often c. AD 85–100","purpose":"Praise Gaius for welcoming traveling Christian teachers, criticize Diotrephes for rejecting and obstructing them, and commend Demetrius. The short letter addresses hospitality, authority, and cooperation among early Christian congregations.","verses":[{"ref":"1:4","why":"walk in truth"},{"ref":"1:8","why":"support coworkers"},{"ref":"1:11","why":"imitate good"}],"summary":"The elder praises Gaius for showing hospitality to traveling Christian workers. He criticizes Diotrephes for rejecting legitimate authority and treating others harshly. The letter contrasts self-serving control with generosity, truth, and constructive leadership.","outline":["Gaius commended (1–8)","Diotrephes rebuked (9–10)","Demetrius and farewell (11–15)"],"themes":["Hospitality","Truth","Leadership"],"era":11,"authorOptions":["John son of Zebedee (tradition)","John the Elder (proposal)","A Johannine community teacher"],"places":["Ephesus"],"relations":["2 John","1 John"]},{"id":64,"name":"Jude","section":7,"testament":"NT","author":"Jude, brother of James and Jesus (traditional identification; exact authorial identity is debated).","date":"Often c. AD 60–90","purpose":"Warn believers that corrupt teachers have entered their community, using stories of earlier biblical judgment to expose their behavior. Jude calls readers to defend the receive
