 (7–14)","Resurrection and closing (15–16)"],"themes":["Church","Unity","Resurrection"],"era":9,"places":["Corinth","Ephesus"],"relations":["2 Corinthians","Romans"]},{"id":46,"name":"2 Corinthians","section":6,"testament":"NT","author":"Paul (named author; Timothy also appears in the greeting).","date":"c. AD 55–56","purpose":"Respond to tensions between Paul and the Corinthian church, defend his apostleship against rival claims, and encourage participation in a collection for believers in Jerusalem. His account of weakness, suffering, and reconciliation clarifies what credible Christian ministry looks like.","verses":[{"ref":"5:17","text":"Therefore if anyone is in Christ, he is a new creation. The old things have passed away. Behold, all things have become new."},{"ref":"12:9","text":"He has said to me, “My grace is sufficient for you, for my power is made perfect in weakness.” Most gladly therefore I will rather glory in my weaknesses, that the power of Christ may rest on me."},{"ref":"9:7","text":"Let each man give according as he has determined in his heart, not grudgingly or under compulsion, for God loves a cheerful giver."}],"summary":"Paul opens his heart about suffering, comfort, and the integrity of his ministry. He urges the Corinthians toward reconciliation and generous support for believers in need. Against boasts of impressive power, he portrays authentic service as Christlike weakness sustained by divine grace.","outline":["Comfort and ministry (1–7)","Generosity (8–9)","Apostolic defense (10–13)"],"themes":["Weakness","Reconciliation","Generosity"],"era":9,"places":["Corinth"],"relations":["1 Corinthians","Philippians"]},{"id":47,"name":"Galatians","section":6,"testament":"NT","author":"Paul (named author; he defends his apostolic commission in the letter).","date":"c. AD 48–55; destination and chronology debated","purpose":"Oppose teachers pressuring Gentile Christians in Galatia to accept circumcision and Mosaic-law observance as necessary for full belonging. Paul defends his apostolic gospel, argues from Abraham and Christ, and explains freedom and life by the Spirit.","verses":[{"ref":"5:22","text":"But the fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faith,"},{"ref":"2:20","text":"I have been crucified with Christ, and it is no longer I who live, but Christ lives in me. That life which I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself up for me."},{"ref":"6:9","text":"Let’s not be weary in doing good, for we will reap in due season if we don’t give up."}],"summary":"Paul confronts teachers who require Gentile Christians to adopt the Jewish law as a condition of belonging. He insists that people are justified through faith in Christ rather than works of the law. Genuine freedom is not selfish license but loving service and a life shaped by the Spirit.","outline":["Gospel defended (1–2)","Promise and law (3–4)","Freedom and Spirit (5–6)"],"themes":["Grace","Freedom","Spirit"],"era":9,"places":["Antioch","Ephesus"],"relations":["Romans","Acts"]},{"id":48,"name":"Ephesians","section":6,"testament":"NT","author":"Paul (traditional attribution; some scholars propose an anonymous later Pauline writer).","date":"c. AD 60–90, depending on authorship","purpose":"Explain how Christ has formed one people from Jews and Gentiles, then describe the church as his body and household. The letter applies that identity to unity, maturity, family relationships, and resistance to spiritual evil.","verses":[{"ref":"2:8","text":"for by grace you have been saved through faith, and that not of yourselves; it is the gift of God,"},{"ref":"6:11","text":"Put on the whole armor of God, that you may be able to stand against the wiles of the devil."},{"ref":"4:32","text":"And be kind to one another, tender hearted, forgiving each other, just as God also in Christ forgave you."}],"summary":"Ephesians praises God's grace in choosing, redeeming, and uniting people through Christ. The church is portrayed as one new humanity, breaking down hostility between Jews and Gentiles. Believers are called to mature unity, holiness, love, and faithfulness in their households and spiritual lives.","outline":["New identity in Christ (1–3)","Life in community (4–5)","Households and spiritual struggle (5–6)"],"themes":["Unity","Grace","Church"],"era":10,"places":["Ephesus"],"relations":["Colossians","Romans"]},{"id":49,"name":"Philippians","section":6,"testament":"NT","author":"Paul (named author; Timothy also appears in the greeting).","date":"c. AD 55–62; imprisonment location debated","purpose":"Thank the Philippian church for its partnership and financial gift, update them on Paul's imprisonment, and urge unity amid opposition. The portrait of Christ's humility and Paul's own circumstances show how a congregation can persevere together.","verses":[{"ref":"4:13","text":"I can do all things through Christ who strengthens me."},{"ref":"4:6","text":"In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God."},{"ref":"2:3","text":"doing nothing through rivalry or through conceit, but in humility, each counting others better than himself;"}],"summary":"Writing from imprisonment, Paul thanks the Philippians for their partnership in the gospel. He points to Christ's self-emptying humility as the model for Christian unity and service. The letter calls for joy, perseverance, contentment, and prayer amid hardship.","outline":["Partnership in suffering (1)","Christlike humility (2)","Press on with joy (3–4)"],"themes":["Joy","Humility","Perseverance"],"era":10,"places":["Philippi","Rome"],"relations":["2 Corinthians","1 Thessalonians"]},{"id":50,"name":"Colossians","section":6,"testament":"NT","author":"Paul (traditional attribution; Timothy is named in the greeting, and some scholars propose a later Pauline disciple).","date":"c. AD 60–80, depending on authorship","purpose":"Address teachings that threatened to supplement or diminish Christ through religious regulations and spiritual intermediaries. Paul emphasizes Christ's supremacy over creation and the church, then describes how belonging to him changes worship, conduct, and household life.","verses":[{"ref":"3:23","text":"And whatever you do, work heartily, as for the Lord and not for men,"},{"ref":"3:2","text":"Set your mind on the things that are above, not on the things that are on the earth."},{"ref":"1:16","text":"For by him all things were created in the heavens and on the earth, visible things and invisible things, whether thrones or dominions or principalities or powers. All things have been created through him and for him."}],"summary":"Colossians exalts Jesus Christ as the image of the invisible God and head of the church. The letter warns against philosophies and regulations that distract from his sufficiency. Because believers are raised with Christ, they are to reject old patterns and practice compassion, forgiveness, and love.","outline":["Supremacy of Christ (1)","Fullness and freedom (2)","New life and relationships (3–4)"],"themes":["Christ","Fullness","New life"],"era":10,"places":["Colossae"],"relations":["Ephesians","Philemon"]},{"id":51,"name":"1 Thessalonians","section":6,"testament":"NT","author":"Paul (principal named author; Silvanus and Timothy also appear in the greeting).","date":"c. AD 49–51","purpose":"Reassure a newly established Thessalonian church facing hostility, encourage sexual holiness and mutual care, and answer concerns about believers who died before Christ's return. It preserves one of Paul's earliest pastoral explanations of Christian hope in the resurrection.","verses":[{"ref":"5:17","text":"Pray without ceasing."},{"ref":"4:16","text":"For the Lord himself will descend from heaven with a shout, with the voice of the archangel and with God’s trumpet. The dead in Christ will rise first,"},{"ref":"5:18","text":"In everything give thanks, for this is the will of God in Christ Jesus toward you."}],"summary":"Paul encourages Thessalonian believers who have remained faithful despite persecution. He commends their love and urges sexual holiness, brotherly care, and diligent work. Teaching about Christ's return comforts those grieving deceased believers and strengthens alert, hopeful living.","outline":["Thanksgiving and example (1–3)","Holiness and hope (4–5)"],"themes":["Hope","Holiness","Endurance"],"era":9,"places":["Thessalonica"],"relations":["2 Thessalonians","Acts"]},{"id":52,"name":"2 Thessalonians","section":6,"testament":"NT","author":"Paul (traditional attribution; Silvanus and Timothy are also named; some scholars question Pauline authorship).","date":"c. AD 50–52, or later if non-Pauline","purpose":"Correct claims that the day of the Lord had already arrived, strengthen a persecuted church, and rebuke members refusing to work. It clarifies the community's response to end-times speculation and insists on steady, responsible living.","verses":[{"ref":"3:3","text":"But the Lord is faithful, who will establish you and guard you from the evil one."},{"ref":"3:10","text":"For even when we were with you, we commanded you this: “If anyone is not willing to work, don’t let him eat.”"},{"ref":"2:15","text":"So then, brothers, stand firm and hold the traditions which you were taught by us, whether by word or by letter."}],"summary":"The church faces persecution and anxiety about the timing of Christ's return. Paul or a writer in his name warns against false claims and calls believers to stand firm in apostolic teaching. Practical instruction addresses idleness and encourages quiet, responsible work.","outline":["Endurance in trouble (1)","Day of the Lord (2)","Work and steadfastness (3)"],"themes":["Endurance","Hope","Responsibility"],"era":9,"places":["Thessalonica"],"relations":["1 Thessalonians","Revelation"]},{"id":53,"name":"1 Timothy","section":6,"testament":"NT","author":"Paul (traditional attribution; some scholars favor an anonymous later writer in the Pauline tradition).","date":"c. AD 62–65 or late 1st–early 2nd c.","purpose":"Instruct Timothy on confronting false teaching in Ephesus and organizing church life, public worship, care for widows, and qualifications for overseers and deacons. The letter supplies practical guidance for safeguarding teaching and selecting congregational leaders.","verses":[{"ref":"4:12","text":"Let no man despise your youth; but be an example to those who believe, in word, in your way of life, in love, in spirit, in faith, and in purity."},{"ref":"6:10","text":"For the love of money is a root of all kinds of evil. Some have been led astray from the faith in their greed, and have pierced themselves through with many sorrows."},{"ref":"2:5","text":"For there is one God and one mediator between God and men, the man Christ Jesus,"}],"summary":"Paul instructs Timothy in guarding the church against false teaching. The letter discusses prayer, worship, leadership qualifications, and care for vulnerable members. It emphasizes that doctrinal integrity must be matched by godly character and wise stewardship.","outline":["Truth and worship (1–2)","Leaders and community (3–5)","Contentment and charge (6)"],"themes":["Leadership","Doctrine","Godliness"],"era":10,"places":["Ephesus"],"relations":["2 Timothy","Titus"]},{"id":54,"name":"2 Timothy","section":6,"testament":"NT","author":"Paul (traditional attribution; some scholars favor an anonymous later writer in the Pauline tradition).","date":"c. AD 64–67 or later if pseudonymous","purpose":"Present Paul's urgent instructions to Timothy to preserve and teach the apostolic message, train dependable successors, endure opposition, and preach Scripture. Written in the voice of a final pastoral charge, it emphasizes continuity of the gospel beyond one generation of leaders.","verses":[{"ref":"1:7","text":"For God didn’t give us a spirit of fear, but of power, love, and self-control."},{"ref":"3:16","text":"Every Scripture is God-breathed and profitable for teaching, for reproof, for correction, and for instruction in righteousness,"},{"ref":"4:7","text":"I have fought the good fight. I have finished the course. I have kept the faith."}],"summary":"In a personal and urgent letter, Paul encourages Timothy to remain courageous under opposition. He warns about corrupt teaching and stresses the enduring authority of Scripture. His reflections on approaching death reinforce the call to preach faithfully and complete one's ministry.","outline":["Guard the gospel (1)","Endure as worker (2)","Scripture and final charge (3–4)"],"themes":["Scripture","Courage","Perseverance"],"era":10,"places":["Rome"],"relations":["1 Timothy","Titus"]},{"id":55,"name":"Titus","section":6,"testament":"NT","author":"Paul (traditional attribution; some scholars favor an anonymous later writer in the Pauline tradition).","date":"c. AD 62–65 or later if pseudonymous","purpose":"Direct Titus to appoint qualified elders on Crete, counter misleading teachers, and instruct different groups within the churches. It links sound teaching to visible conduct as emerging congregations establish healthy leadership and communal practices.","verses":[{"ref":"2:11","text":"For the grace of God has appeared, bringing salvation to all men,"},{"ref":"3:5","text":"not by works of righteousness which we did ourselves, but according to his mercy, he saved us through the washing of regeneration and renewing by the Holy Spirit,"},{"ref":"2:7","text":"In all things show yourself an example of good works. In your teaching, show integrity, seriousness, incorruptibility,"}],"summary":"Paul instructs Titus to appoint qualified elders and resist destructive teaching in Crete. The letter addresses conduct across generations and social roles, linking sound doctrine with visible good works. It grounds transformed living in God's saving grace and mercy rather than human merit.","outline":["Leaders and false teaching (1)","Gospel-shaped living (2)","Grace and public conduct (3)"],"themes":["Leadership","Grace","Good works"],"era":10,"places":["Crete"],"relations":["1 Timothy","James"]},{"id":56,"name":"Philemon","section":6,"testament":"NT","author":"Paul (named author; Timothy also appears in the greeting).","date":"c. AD 55–62; imprisonment location debated","purpose":"Ask Philemon, a Christian householder, to receive Onesimus—an enslaved man who has become Paul's fellow believer—not merely in his former social role but as a brother. The personal appeal shows the consequences of Christian reconciliation for an unequal relationship.","verses":[{"ref":"1:6","text":"that the fellowship of your faith may become effective in the knowledge of every good thing which is in us in Christ Jesus."},{"ref":"1:16","text":"no longer as a slave, but more than a slave, a beloved brother—especially to me, but how much rather to you, both in the flesh and in the Lord."},{"ref":"1:7","text":"For we have much joy and comfort in your love, because the hearts of the saints have been refreshed through you, brother."}],"summary":"Paul writes to Philemon on behalf of Onesimus, a man bound to Philemon's household who has become Paul's beloved brother in Christ. Rather than issuing a harsh command, Paul appeals to love and shared faith. The brief letter shows how the gospel presses believers to treat one another with costly dignity and reconciliation.","outline":["Thanksgiving (1–7)","Appeal for Onesimus (8–21)","Closing (22–25)"],"themes":["Reconciliation","Brotherhood","Love"],"era":10,"places":["Colossae"],"relations":["Colossians","Ephesians"]},{"id":57,"name":"Hebrews","section":7,"testament":"NT","author":"Unknown (Apollos, Barnabas, Paul, and Priscilla are among historical proposals, but none has scholarly consensus).","date":"Often c. AD 60–90; precise dating debated","purpose":"Argue that Jesus surpasses angels, Moses, the Levitical priesthood, and the old sacrificial system because his priesthood and self-offering establish a better covenant. Using Israel's Scriptures, the sermon urges a pressured Christian community not to abandon its confession.","verses":[{"ref":"11:1","text":"Now faith is assurance of things hoped for, proof of things not seen."},{"ref":"4:12","text":"For the word of God is living and active, and sharper than any two-edged sword, piercing even to the dividing of soul and spirit, of both joints and marrow, and is able to discern the thoughts and intentions of the heart."},{"ref":"12:1","text":"Therefore let’s also, seeing we are surrounded by so great a cloud of witnesses, lay aside every weight and the sin which so easily entangles us, and let’s run with perseverance the race that is set before us,"}],"summary":"Hebrews presents Jesus as greater than angels, Moses, and the Levitical priesthood. His once-for-all sacrifice opens enduring access to God under a better covenant. Through examples of faithful endurance and serious warnings, the author urges believers not to abandon their hope in Christ.","outline":["Christ's superiority (1–4)","Priesthood and sacrifice (5–10)","Faith and endurance (11–13)"],"themes":["Priesthood","Faith","Perseverance"],"era":10,"authorOptions":["Paul (ancient attribution; now widely doubted)","Barnabas (early church proposal)","Apollos (later influential proposal)"],"places":["Jerusalem","Rome"],"relations":["Leviticus","Psalms"]},{"id":58,"name":"James","section":7,"testament":"NT","author":"James, brother of Jesus (traditional identification; exact authorship is debated).","date":"Often c. AD 40–90","purpose":"Instruct dispersed believers on enduring trials, avoiding favoritism, caring for the poor, controlling speech, and reconciling faith with deeds. Its practical teaching exposes the difference between merely professing belief and living it in a community.","verses":[{"ref":"1:15","text":"Then the lust, when it has conceived, bears sin. The sin, when it is full grown, produces death."},{"ref":"1:5","text":"But if any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach, and it will be given to him."},{"ref":"1:22","text":"But be doers of the word, and not only hearers, deluding your own selves."}],"summary":"James writes practical exhortations for believers facing trials and social tensions. He warns against favoritism, careless speech, self-centered ambition, and neglect of the poor. Living faith is shown in endurance, humility, prayer, and concrete obedience.","outline":["Trials and obedience (1)","Faith, works, and speech (2–3)","Humility and prayer (4–5)"],"themes":["Works","Wisdom","Integrity"],"era":8,"places":["Jerusalem"],"relations":["Proverbs","Galatians"]},{"id":59,"name":"1 Peter","section":7,"testament":"NT","author":"Peter the apostle (traditional attribution; some scholars question direct authorship, and Silvanus is mentioned in 5:12).","date":"Often c. AD 60–90","purpose":"Address Christians scattered across Asia Minor who face hostility and social exclusion, reminding them of their identity and instructing them in holy conduct. The letter treats suffering, public witness, and relationships within households and churches as part of following Christ.","verses":[{"ref":"5:7","text":"casting all your worries on him, because he cares for you."},{"ref":"2:9","text":"But you are a chosen race, a royal priesthood, a holy nation, a people for God’s own possession, that you may proclaim the excellence of him who called you out of darkness into his marvelous light."},{"ref":"3:15","text":"But sanctify the Lord God in your hearts. Always be ready to give an answer to everyone who asks you a reason concerning the hope that is in you, with humility and fear,"}],"summary":"First Peter addresses believers living as outsiders amid hostility. It grounds their identity in the resurrection of Christ and calls them to holiness, love, and honorable conduct. Jesus' suffering and vindication provide the pattern and hope for enduring unjust treatment.","outline":["Living hope and identity (1–2)","Witness amid trials (2–4)","Shepherding and perseverance (5)"],"themes":["Hope","Suffering","Holiness"],"era":10,"places":["Rome","Ephesus"],"relations":["2 Peter","James"]},{"id":60,"name":"2 Peter","section":7,"testament":"NT","author":"Peter the apostle (traditional attribution; direct authorship is widely disputed, with an anonymous later writer also proposed).","date":"c. AD 60–130; debated","purpose":"Warn churches about teachers who exploit others, promote immoral conduct, and mock the promise of Christ's return. By appealing to apostolic testimony and earlier biblical judgments, it urges readers to recognize deception and await the promised renewal.","verses":[{"ref":"3:9","text":"The Lord is not slow concerning his promise, as some count slowness; but he is patient with us, not wishing that anyone should perish, but that all should come to repentance."},{"ref":"1:3","text":"seeing that his divine power has granted to us all things that pertain to life and godliness, through the knowledge of him who called us by his own glory and virtue,"},{"ref":"1:21","text":"For no prophecy ever came by the will of man, but holy men of God spoke, being moved by the Holy Spirit."}],"summary":"Second Peter urges believers to grow in godliness and hold fast to apostolic witness. The writer exposes false teachers who exploit others and mock judgment. God's patience should lead to repentance, while the promise of a renewed creation calls for holy living.","outline":["Virtue and witness (1)","False teachers (2)","Lord's return and holy living (3)"],"themes":["Truth","Holiness","Hope"],"era":11,"places":["Rome"],"relations":["1 Peter","Jude"]},{"id":61,"name":"1 John","section":7,"testament":"NT","author":"John the apostle (traditional attribution; the letter itself is anonymous and a Johannine associate may have written it).","date":"Often c. AD 85–100","purpose":"Address a community shaken by teachers who departed and disputed central claims about Jesus. The letter offers tests of authentic fellowship—confessing Jesus Christ come in the flesh, obedience, and love—and reassurance of eternal life.","verses":[{"ref":"1:9","text":"If we confess our sins, he is faithful and righteous to forgive us the sins and to cleanse us from all unrighteousness."},{"ref":"4:8","text":"He who doesn’t love doesn’t know God, for God is love."},{"ref":"4:19","text":"We love him, because he first loved us."}],"summary":"First John addresses confusion caused by teachers who deny essential truths about Jesus. It ties genuine fellowship with God to confession of Christ, obedience, and love for fellow believers. The letter repeatedly offers assurance of eternal life while warning against deception and hatred.","outline":["Walking in light (1–2)","Love and discernment (3–4)","Assurance and prayer (5)"],"themes":["Love","Truth","Assurance"],"era":11,"authorOptions":["John son of Zebedee (tradition)","John the Elder (proposal)","A Johannine community teacher"],"places":["Ephesus"],"relations":["John","2 John"]},{"id":62,"name":"2 John","section":7,"testament":"NT","author":"John the apostle (traditional identification; the author calls himself 'the elder,' potentially a different Johannine leader).","date":"Often c. AD 85–100","purpose":"Urge the recipient, addressed as the 'elect lady,' to maintain love and truth while refusing hospitality that would assist teachers who deny Jesus Christ's coming in the flesh. It applies doctrinal discernment to the practical question of whom a church should support.","verses":[{"ref":"1:6","text":"This is love, that we should walk according to his commandments. This is the commandment, even as you heard from the beginning, that you should walk in it."},{"ref":"1:9","text":"Whoever transgresses and doesn’t remain in the teaching of Christ doesn’t have God. He who remains in the teaching has both the Father and the Son."},{"ref":"1:4","text":"I rejoice greatly that I have found some of your children walking in truth, even as we have been commanded by the Father."}],"summary":"The elder commends a community for walking in truth and love. He warns against itinerant teachers who deny the full reality of Jesus Christ's coming in the flesh. Love and discernment must remain together in the church's hospitality and mission.","outline":["Love and truth (1–6)","Caution against deceivers (7–11)","Farewell (12–13)"],"themes":["Truth","Love","Discernment"],"era":11,"authorOptions":["John son of Zebedee (tradition)","John the Elder (proposal)","A Johannine community teacher"],"places":["Ephesus"],"relations":["1 John","3 John"]},{"id":63,"name":"3 John","section":7,"testament":"NT","author":"John the apostle (traditional identification; the author calls himself 'the elder,' potentially a different Johannine leader).","date":"Often c. AD 85–100","purpose":"Praise Gaius for welcoming traveling Christian teachers, criticize Diotrephes for rejecting and obstructing them, and commend Demetrius. The short letter addresses hospitality, authority, and cooperation among early Christian congregations.","verses":[{"ref":"1:2","text":"Beloved, I pray that you may prosper in all things and be healthy, even as your soul prospers."},{"ref":"1:4","text":"I have no greater joy than this: to hear about my children walking in truth."},{"ref":"1:11","text":"Beloved, don’t imitate that which is evil, but that which is good. He who does good is of God. He who does evil hasn’t seen God."}],"summary":"The elder praises Gaius for showing hospitality to traveling Christian workers. He criticizes Diotrephes for rejecting legitimate authority and treating others harshly. The letter contrasts self-serving control with generosity, truth, and constructive leadership.","outline":["Gaius commended (1–8)","Diotrephes rebuked (9–10)","Demetrius and farewell (11–15)"],"themes":["Hospitality","Truth","Leadership"],"era":11,"authorOptions":["John son of Zebedee (tradition)","John the Elder (proposal)","A Johannine community teacher"],"places":["Ephesus"],"relations":["2 John","1 John"]},{"id":64,"name":"Jude","section":7,"testament":"NT","author":"Jude, brother of James and Jesus (traditional identification; exact authorial identity is debated).","date":"Often c. AD 60–90","purpose":"Warn believers that corrupt teachers have entered their community, using stories of earlier biblical judgment to expose their behavior. Jude calls readers to defend the received faith, remain grounded in prayer and love, and show appropriate mercy to those in danger.","verses":[{"ref":"1:24","text":"Now to him who is able to keep them from stumbling, and to present you faultless before the presence of his glory in great joy,"},{"ref":"1:3","text":"Beloved, while I was very eager to write to you about our common salvation, I was constrained to write to you exhorting you to contend earnestly for the faith which was once for all delivered to the saints."},{"ref":"1:20","text":"But you, beloved, keep building up yourselves on your most holy faith, praying in the Holy Spirit."}],"summary":"Jude warns that false teachers have slipped into the church and turned grace into license. Drawing on vivid examples of rebellion and judgment, he calls believers to remember apostolic teaching. The letter ends by urging prayer, mercy, and confidence in God's ability to preserve his people.","outline":["Warning about intruders (1–16)","Perseverance and mercy (17–25)"],"themes":["Truth","Mercy","Perseverance"],"era":11,"places":["Jerusalem"],"relations":["2 Peter","Revelation"]},{"id":65,"name":"Revelation","section":7,"testament":"NT","author":"John of Patmos (the named writer; identification with John the apostle remains disputed).","date":"Often c. AD 90–96; earlier dating proposed","purpose":"Address seven churches in Roman Asia through letters and symbolic visions of the heavenly throne, beasts, Babylon, final judgment, and new Jerusalem. It places their experience of pressure and compromise within a larger portrayal of Christ's victory and the renewal of creation.","verses":[{"ref":"3:20","text":"Behold, I stand at the door and knock. If anyone hears my voice and opens the door, then I will come in to him and will dine with him, and he with me."},{"ref":"21:4","text":"He will wipe away every tear from their eyes. Death will be no more; neither will there be mourning, nor crying, nor pain any more. The first things have passed away.”"},{"ref":"22:13","text":"I am the Alpha and the Omega, the First and the Last, the Beginning and the End."}],"summary":"John receives symbolic visions addressed to seven churches confronting pressure and compromise. The visions portray the conflict between God's kingdom and the powers of evil, centering victory on the slain and risen Lamb. The book ends with final judgment and the promise that God will dwell with his people in a renewed heaven and earth.","outline":["Messages to churches (1–3)","Visions of conflict and victory (4–20)","New creation and invitation (21–22)"],"themes":["Hope","Worship","New creation"],"era":11,"places":["Ephesus"],"relations":["Daniel","John","Zechariah"]}],"sections":[{"title":"The Pentateuch","desc":"Origins, covenant, and Israel’s formation","kind":"Origins","count":5},{"title":"Leadership History","desc":"Israel’s land, kings, exile, and return","kind":"History","count":12},{"title":"Wisdom Literature","desc":"Worship, wisdom, suffering, and love","kind":"Wisdom","count":5},{"title":"Major Prophets","desc":"Judgment, redemption, and future hope","kind":"Prophecy","count":5},{"title":"Minor Prophets","desc":"Twelve prophetic voices to God’s people","kind":"Prophecy","count":12},{"title":"Gospels + Acts","desc":"Jesus Christ and the early church","kind":"Gospels","count":5},{"title":"Pauline Epistles","desc":"Paul’s letters to churches and coworkers","kind":"Letters","count":13},{"title":"General Epistles + Prophecy","desc":"Christian endurance, truth, and hope","kind":"Letters","count":9}],"eras":[{"name":"Beginnings & Patriarchs","date":"Primeval history; patriarchs traditionally c. 2100–1700 BC","testament":"OT","short":"Origins"},{"name":"Exodus & Wilderness","date":"Traditionally 15th–13th centuries BC","testament":"OT","short":"Exodus"},{"name":"Land & Judges","date":"Traditionally c. 1400–1050 BC","testament":"OT","short":"Judges"},{"name":"United Monarchy","date":"c. 1050–930 BC","testament":"OT","short":"Monarchy"},{"name":"Divided Kingdoms","date":"c. 930–586 BC","testament":"OT","short":"Kingdoms"},{"name":"Exile","date":"c. 586–539 BC","testament":"OT","short":"Exile"},{"name":"Return & Restoration","date":"c. 539–400 BC","testament":"OT","short":"Return"},{"name":"Life of Jesus","date":"c. 6 BC–AD 30","testament":"NT","short":"Jesus"},{"name":"Early Church","date":"c. AD 30–48","testament":"NT","short":"Church"},{"name":"Missionary Expansion","date":"c. AD 48–60","testament":"NT","short":"Missions"},{"name":"Later Apostolic Ministry","date":"c. AD 60–70","testament":"NT","short":"Ministry"},{"name":"Late Apostolic Era","date":"c. AD 70–100","testament":"NT","short":"Witness"}],"locations":{"Rome":[12.5,41.9],"Corinth":[22.93,37.91],"Philippi":[24.29,41.01],"Thessalonica":[22.94,40.64],"Ephesus":[27.34,37.94],"Colossae":[29.25,37.79],"Crete":[25.1,35.22],"Antioch":[36.16,36.2],"Galilee":[35.5,32.76],"Jerusalem":[35.23,31.78],"Bethlehem":[35.2,31.71],"Egypt":[31.25,30.04],"Sinai":[33.8,28.7],"Moab":[35.77,31.48],"Nineveh":[43.15,36.36],"Babylon":[44.42,32.54],"Susa":[48.26,32.19],"Damascus":[36.3,33.51],"Edom":[35.4,30.6],"Samaria":[35.19,32.28],"Bethel":[35.22,31.94],"Canaan":[35.3,31.9],"Judah":[35.2,31.65]}};

const bibleUrl=(b,ref='1')=>'https://www.biblegateway.com/passage/?search='+encodeURIComponent(b.name+' '+ref)+'&version=ESV';

function route(){let h=decodeURIComponent(location.hash.replace(/^#\/?/,''));if(!h||h==='home'){state={type:'home'}}else if(h.startsWith('section/')){let n=+h.slice(8);state={type:'section',section:Math.max(0,Math.min(7,n))}}else if(h.startsWith('book/')){let name=h.slice(5),idx=B.findIndex(b=>b.name===name);state=idx<0?{type:'home'}:{type:'book',book:idx}}else state={type:'home'};closeDrawer();render();window.scrollTo({top:0,behavior:'instant'});closeMenu()}
function navigate(type,v){location.hash=type==='home'?'#/home':type==='section'?'#/section/'+v:'#/book/'+encodeURIComponent(B[v].name);if(location.hash==='#/home'&&state.type==='home')route()}
function menu(){let current=state.type==='book'?B[state.book].section:state.section;let str='<div class="navlabel">EXPLORE</div><button class="navbutton '+(state.type==='home'?'active':'')+'" onclick="navigate(\'home\')"><span class="navnumber">⌂</span><span>Overview & timelines</span></button><div class="navlabel">THE EIGHT SECTIONS</div>';S.forEach((s,i)=>{let a=(state.type==='section'&&current===i)||(state.type==='book'&&current===i);str+='<button class="navbutton '+(a?'active':'')+'" onclick="navigate(\'section\','+i+')"><span class="navnumber">'+String(i+1).padStart(2,'0')+'</span><span>'+safe(s.title)+'</span><span class="counter">'+s.count+'</span></button>'});$('nav').innerHTML=str}
function breadcrumbs(){let h='<button onclick="navigate(\'home\')">Bible Overview</button>';if(state.type==='home')h+=' <span class="current">› Overview</span>';if(state.type==='section')h+=' <span>›</span> <span class="current">'+safe(S[state.section].title)+'</span>';if(state.type==='book'){let b=B[state.book];h+=' <span>›</span> <button class="anc" onclick="navigate(\'section\','+b.section+')">'+safe(S[b.section].title)+'</button> <span>›</span> <span class="current">'+safe(b.name)+'</span>'}$('crumb').innerHTML=h}
function bookcard(b){return '<button class="bookcard" onclick="navigate(\'book\','+b.id+')"><div class="topline"><span class="bookindex">BOOK '+String(b.id+1).padStart(2,'0')+'</span><span class="bookarrow">↗</span></div><h3>'+safe(b.name)+'</h3><p>'+safe(b.purpose)+'</p><div class="bookmeta">'+safe(E[b.era].short.toUpperCase())+' · '+safe(b.themes[0].toUpperCase())+'</div></button>'}
function timeliner(testament){let eras=E.map((e,i)=>({...e,id:i})).filter(e=>e.testament===testament);let count=B.filter(b=>b.testament===testament).length;let h='<section class="timeline-panel"><div class="timeline-top"><strong>'+(testament==='OT'?'Old Testament':'New Testament')+'</strong><span class="timeline-tag">'+count+' books</span></div><div class="timeline-scroll"><div class="timeline-track">';eras.forEach(e=>{let books=B.filter(b=>b.era===e.id);h+='<div class="era '+testament.toLowerCase()+'"><span class="era-date">'+safe(e.date)+'</span><h4>'+safe(e.name)+'</h4><div class="era-books">';books.forEach(b=>h+='<button class="era-chip" title="Open '+safe(b.name)+'" onclick="navigate(\'book\','+b.id+')"><i></i>'+safe(b.name)+'</button>');h+='</div></div>'});h+='</div></div><div class="timeline-note">Books appear in a representative historical setting, not their order of composition. Some span multiple periods; dates are disputed. Scroll sideways to explore →</div></section>';return h}

function formatAuthor(v){const i=v.indexOf(' (');return i<0?safe(v):'<strong>'+safe(v.slice(0,i))+'</strong>'+safe(v.slice(i));}
function formatDate(v){
 const terms=['monarchic to postexilic era','Collected over centuries','Date uncertain','Late 7th–early 6th c. BC'];
 const x=terms.find(t=>v.includes(t));
 if(x){const i=v.indexOf(x);return safe(v.slice(0,i))+'<strong>'+safe(x)+'</strong>'+safe(v.slice(i+x.length));}
 const match=/(?:\bc\.\s*)?(?:AD\s*)?\d{1,4}(?:st|nd|rd|th|s)?(?:\s*[–-]\s*(?:AD\s*)?\d{1,4}(?:st|nd|rd|th|s)?)?(?:\s*c\.)?(?:\s*(?:BC|AD))?/i.exec(v);
 if(!match){const i=v.indexOf(';');return '<strong>'+safe(i<0?v:v.slice(0,i))+'</strong>'+safe(i<0?'':v.slice(i));}
 return safe(v.slice(0,match.index))+'<strong>'+safe(match[0])+'</strong>'+safe(v.slice(match.index+match[0].length));
}
function formatPurpose(b){
 const value=b.purpose,picks=BOLD_PHRASES[b.id]||[],ranges=[];
 for(const p of picks){const i=value.toLowerCase().indexOf(p.toLowerCase());if(i>=0)ranges.push([i,i+p.length]);}
 ranges.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);
 let out='',pos=0;
 for(const [a,z] of ranges){if(a<pos)continue;out+=safe(value.slice(pos,a))+'<strong>'+safe(value.slice(a,z))+'</strong>';pos=z;}
 return out+safe(value.slice(pos));
}

 function beginning(text,range){
   const source=range||text.match(/Psalms\s+(\d+(?:[–-]\d+)?)/i)?.[1]||"";
   const match=source.match(/^(\d+)(?::(\d+))?/);
   if(!match)return "1";
   return match[1]+(match[2]?":"+match[2]:"");
 }
 const list=document.createElement("div");
 list.innerHTML='<div class="reading-outline-head"><strong>Literary divisions</strong><span>'+original.length+' sections</span></div>'+
   '<ol class="trad-outline">'+original.map((item,i)=>{
     const first=beginning(item.text,item.range);
     const url=bibleUrl(b,first);
     const ref=item.range||item.text.match(/Psalms\s+(\d+(?:[–-]\d+)?)/i)?.[1]||first;
     return '<li><a class="trad-row-link" href="'+url+'" target="_blank" rel="noopener noreferrer" title="Read '+safe(b.name)+' '+safe(first)+' in Bible Gateway"><span class="trad-roman">'+roman(i+1)+'.</span><span class="trad-text">'+safe(item.text)+'</span><span class="trad-range">CH. '+safe(ref)+' ↗</span></a></li>';
   }).join('')+'</ol>';
 sec.querySelector(".desc").textContent="Select any division to read from its opening chapter in Bible Gateway.";
 sec.querySelector(".outline")?.replaceWith(list);
}
function timePosition(era){return [0.04,0.13,0.19,0.25,0.36,0.50,0.60,0.75,0.82,0.88,0.94,0.99][era]??0.5;}
function timelineRedesign(panel,b){
 const sec=[...panel.querySelectorAll(":scope > .drawer-section")].find(el=>el.querySelector(".eyebrow")?.textContent.includes("HISTORICAL CONTEXT"));
 if(!sec)return;
 const era=E[b.era];
 const markup='<div class="bible-chronology"><p class="story-heading">This book: '+safe(era.name)+' · '+safe(era.date)+'</p><p class="story-note">Five reference milestones across biblical history, with approximate historical dates.</p><div class="bible-time-scroll" tabindex="0" aria-label="Biblical timeline, scroll sideways"><div class="bible-time-track" style="--location:'+(10+80*timePosition(b.era)).toFixed(1)+'%">'+
  milestones.map(m=>'<div class="bible-time-milestone"><span class="time-dot"></span><div class="time-title">'+safe(m.title)+'</div><div class="time-date">'+safe(m.date)+'</div><p class="time-context">'+safe(m.desc)+'</p></div>').join('')+
  '<span class="book-era-dot" role="img" aria-label="Approximate position of '+safe(b.name)+'"></span></div></div><p class="bible-time-legend">Position is illustrative, not to scale. Creation has no established historical date; Revelation’s marker indicates approximate composition, not a date for predicted future events.</p><p class="footnote">Estimated writing date: '+safe(b.date)+'. Historical setting and composition date may differ.</p></div>';
 sec.innerHTML='<div class="eyebrow">HISTORICAL CONTEXT</div><h3>Place in the biblical story</h3>'+markup;
}
function mapLocations(b){
 return b.places.map(name=>({name,lat:LOC[name]?.[1],lng:LOC[name]?.[0]})).filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lng));
}
function bboxFor(points){const lat=points.map(p=>p.lat),lng=points.map(p=>p.lng);const lo=Math.min(...lat),hi=Math.max(...lat),left=Math.min(...lng),right=Math.max(...lng);const padLat=Math.max(1.6,(hi-lo)*.35),padLng=Math.max(2.2,(right-left)*.35);return [left-padLng,lo-padLat,right+padLng,hi+padLat];}
function fallbackMap(container,pts){
 if(!container||!pts.length)return;
 const [left,bottom,right,top]=bboxFor(pts);const p=pts[0];
 const url="https://www.openstreetmap.org/export/embed.html?bbox="+encodeURIComponent([left,bottom,right,top].join(","))+"&layer=mapnik&marker="+encodeURIComponent(p.lat+","+p.lng);
 container.innerHTML='<iframe class="bible-map-fallback" src="'+url+'" loading="lazy" title="OpenStreetMap showing '+safe(p.name)+'" referrerpolicy="strict-origin-when-cross-origin"></iframe>';
}
function loadLeaflet(){
 if(window.L?.map)return Promise.resolve(window.L);
 if(mapLibraryPromise)return mapLibraryPromise;
 mapLibraryPromise=new Promise((resolve,reject)=>{
   if(!document.querySelector('link[data-bible-leaflet]')){
     const link=document.createElement("link");link.rel="stylesheet";link.dataset.bibleLeaflet="yes";link.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(link);
   }
   const s=document.createElement("script");
   s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";s.async=true;s.onload=()=>window.L?.map?resolve(window.L):reject(new Error("Leaflet not ready"));s.onerror=()=>reject(new Error("Map library blocked"));document.head.appendChild(s);
 }).catch(e=>{mapLibraryPromise=null;throw e;});
 return mapLibraryPromise;
}
function setupMap(b,pts){
 const elem=document.getElementById("book-geography-map");
 if(!elem||!pts.length)return;
 const sameBook=b.id;
 const pillButtons=[...document.querySelectorAll(".bible-map-pill")];
 loadLeaflet().then(L=>{
   if(!document.getElementById("book-geography-map")||state.book!==sameBook||!document.getElementById("overlay").classList.contains("open"))return;
   if(activeMap){activeMap.remove();activeMap=null;}
   elem.innerHTML="";
   const map=L.map(elem,{scrollWheelZoom:false,minZoom:2,maxZoom:15,zoomControl:true});
   activeMap=map;
   L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
       maxZoom:15,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a>'
   }).addTo(map);
   const marks=[];
   pts.forEach(p=>{
     const m=L.circleMarker([p.lat,p.lng],{radius:8,color:"#fff",weight:2,fillColor:"#9b6736",fillOpacity:1}).addTo(map);
     m.bindTooltip(p.name,{permanent:true,direction:"top",offset:[0,-7],className:"bible-place-tooltip"});
     m.bindPopup('<strong>'+safe(p.name)+'</strong><br>Location associated with '+safe(b.name));
     marks.push(m);
   });
   if(pts.length===1)map.setView([pts[0].lat,pts[0].lng],7);
   else map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])),{padding:[65,55],maxZoom:7});
   pillButtons.forEach((btn,i)=>btn.addEventListener("click",()=>{if(!activeMap||state.book!==sameBook)return;map.setView([pts[i].lat,pts[i].lng],Math.max(map.getZoom(),7),{animate:true});marks[i].openPopup();}));
   setTimeout(()=>map.invalidateSize(),160);
 }).catch(()=>fallbackMap(elem,pts));
}
function geographyRedesign(panel,b){
 const sec=[...panel.querySelectorAll(":scope > .drawer-section")].find(el=>el.querySelector(".eyebrow")?.textContent.includes("GEOGRAPHY"));
 if(!sec)return;
 const pts=mapLocations(b);
 const mapNo=historicalLinks[b.name]||(b.testament==="OT"?9:11);
 const atlas="https://www.churchofjesuschrist.org/study/scriptures/bible-maps/map-"+mapNo+"?lang=eng";
 sec.innerHTML='<div class="eyebrow">BIBLICAL GEOGRAPHY</div><h3>Places in their geographical setting</h3>'+
  '<p class="desc">A real modern basemap with markers for biblical locations. Some names represent wider ancient regions; their pins are approximate.</p>'+
  '<div id="book-geography-map" class="bible-real-map" aria-label="Geographical map for '+safe(b.name)+'"><div class="bible-map-loading">Loading geographical map…</div></div>'+
  '<div class="bible-map-pills">'+pts.map(p=>'<button class="bible-map-pill" type="button">'+safe(p.name)+' ↗</button>').join('')+'</div>'+
  ''+
  '<div class="bible-atlas-links"><a href="'+atlas+'" target="_blank" rel="noopener noreferrer">Historical atlas: '+safe(mapCaptions[mapNo]||"Biblical lands")+' ↗</a><a href="https://open.bible/resources" target="_blank" rel="noopener noreferrer">Browse licensed Bible maps ↗</a></div>';
 setTimeout(()=>setupMap(b,pts),60);
}
function cleanReflection(panel){
 [...panel.querySelectorAll(":scope > .drawer-section")].forEach(el=>{
   const heading=el.querySelector("h3")?.textContent||"";
   if(heading.includes("Questions for reflection"))el.remove();
 });
}
function cleanupMap(){if(activeMap){activeMap.remove();activeMap=null;}}
const priorOpen=openDrawer;
openDrawer=function(){
 cleanupMap();
 priorOpen();
 const panel=document.getElementById("drawer-content");
 const b=B[state.book];
 if(!panel||!b)return;
 outlineRedesign(panel);
 timelineRedesign(panel,b);
 geographyRedesign(panel,b);
 cleanReflection(panel);
};
const priorClose=closeDrawer;
closeDrawer=function(){cleanupMap();priorClose();};
})();
</script>

<script>
/* Bible Overview: anonymous authors, chronological index, YouTube thumbnails */
(function(){
"use strict";
const ot=[
 {name:"Creation",years:"Undated"},
 {name:"Patriarchs",years:"c. 2100–1700 BC"},
 {name:"Exodus",years:"c. 15th–13th c. BC"},
 {name:"Conquest",years:"c. 1400–1200 BC"},
 {name:"Judges",years:"c. 1375–1050 BC"},
 {name:"Kingdom",years:"c. 1050–586 BC"},
 {name:"Exile",years:"586–539 BC"},
 {name:"Return",years:"c. 539–400 BC"},
 {name:"Silence",years:"c. 400–4 BC"}
];
const nt=[
 {name:"Gospels",years:"c. 6 BC–AD 30"},
 {name:"Church",years:"c. AD 30–48"},
 {name:"Missions",years:"c. AD 48–100"},
 {name:"Future",years:"Undated"}
];
function highlighted(b){
 if(b.name==="Genesis")return [1,2];
 if(b.name==="Job")return [2];
 if(b.name==="Revelation")return [13];
 if(b.name==="Acts")return [11,12];
 if(b.testament==="NT")return b.era===7?[10]:b.era===8?[11]:[12];
 if(b.era===0)return [2];
 if(b.era===1)return [3];
 if(b.era===2)return b.name==="Joshua"?[4]:[5];
 if(b.era===3||b.era===4)return [6];
 if(b.era===5)return [7];
 if(b.era===6)return [8];
 return [];
}
function chronologyTable(label,items,start,active){
 const rowHeaders='<div class="history-table-headers"><span>No.</span><span>Era</span><span>Approx. Years</span></div>';
 const rows=items.map((it,i)=>{
   const n=start+i,now=active.includes(n);
   return '<li class="history-item'+(now?' is-current':'')+'"'+(now?' aria-current="true"':'')+'><span class="history-index">'+String(n).padStart(2,"0")+'</span><span class="history-name">'+safe(it.name)+'</span><span class="history-years">'+safe(it.years)+'</span></li>';
 }).join('');
 return '<div class="history-column"><div class="history-column-title"><strong>'+label+'</strong><span>'+items.length+' eras</span></div>'+rowHeaders+'<ol class="history-list">'+rows+'</ol></div>';
}
function replaceHistoricalPanel(panel,b){
 const sec=[...panel.querySelectorAll(":scope > .drawer-section")].find(s=>s.querySelector(".eyebrow")?.textContent.includes("HISTORICAL CONTEXT"));
 if(!sec)return;
 const era=E[b.era];
 const root=panel.querySelector(".trad-outline");
 const items=[...(root?.querySelectorAll("li")||[])].map(el=>({
   title:el.querySelector(".trad-text")?.textContent?.trim()||"",
   range:(el.querySelector(".trad-range")?.textContent||"").replace(/^CH\.\s*/,"").replace(/\s*↗\s*$/,"").trim()
 })).filter(x=>x.title);
 const count=Math.min(5,items.length);
 const indices=[...new Set(Array.from({length:count},(_,i)=>count===1?0:Math.round((items.length-1)*i/(count-1))))];
 const progression=indices.map((n,i)=>{
   const item=items[n];
   return '<li class="book-history-step"><span class="book-history-dot" aria-hidden="true">'+String(i+1).padStart(2,"0")+'</span><div class="book-history-step-body"><strong>'+safe(item.title)+'</strong><small>'+safe(item.range?("Ch. "+item.range):("Part "+(n+1)))+'</small></div></li>';
 }).join("");
 sec.innerHTML='<div class="eyebrow">HISTORICAL CONTEXT</div><h3>'+safe(b.name)+' — Historical Timeline</h3>'+
 '<div class="book-history-facts"><div class="book-history-fact"><div class="book-history-label">HISTORICAL SETTING</div><strong>'+safe(era.name)+'</strong><span>'+safe(era.date)+'</span></div>'+
 '<div class="book-history-fact"><div class="book-history-label">TIME WRITTEN</div><strong>'+safe(b.date)+'</strong></div></div>'+
 '<div class="book-history-heading">MAJOR MOVEMENTS IN '+safe(b.name.toUpperCase())+'</div>'+
 '<ol class="book-history-steps">'+progression+'</ol>';
}
function decorateVideos(panel){
 const section=[...panel.querySelectorAll(':scope > .drawer-section')].find(s=>s.querySelector('.eyebrow')?.textContent.includes('WATCH & STUDY'));
 if(!section)return;
 const links=section.querySelectorAll('a.video-link');
 links.forEach(link=>{
   let id;
   try{
     const url=new URL(link.href);
     if(url.hostname!=="www.youtube.com"&&url.hostname!=="youtube.com")return;
     id=url.searchParams.get('v');
   }catch(e){return;}
   if(!/^[a-zA-Z0-9_-]{11}$/.test(id||""))return;
   const originalIcon=link.querySelector('.video-play');
   if(originalIcon)originalIcon.remove();
   const desc=link.querySelector('span');
   if(desc)desc.classList.add('video-info');
   const poster=document.createElement('span');
   poster.className="video-poster";
   const thumb=document.createElement('img');
   thumb.src="https://i.ytimg.com/vi/"+id+"/hqdefault.jpg";
   thumb.alt="BibleProject video thumbnail";
   thumb.loading="lazy";
   thumb.decoding="async";
   const play=document.createElement('span');
   play.className="video-poster-play";
   play.textContent="▶";
   play.setAttribute("aria-hidden","true");
   poster.append(thumb,play);
   link.insertBefore(poster,desc||null);
   if(desc){
     const small=desc.querySelector("small");
     if(small)small.textContent="▶ Watch on YouTube ↗";
   }
 });
}
const oldOpen=openDrawer;
openDrawer=function(){
 oldOpen();
 const panel=document.getElementById("drawer-content"),b=B[state.book];
 if(!panel||!b)return;
 replaceHistoricalPanel(panel,b);
 decorateVideos(panel);
 // Remove explanatory subnotes after all existing drawer enrichments have run.
 // Leave substantive authorship data, source links, and map tile attribution intact.
 panel.querySelectorAll('p.desc, p.footnote, p.bible-map-caption').forEach(note=>note.remove());
};
})();
</script>
