/* Book abstract: readable, content-sized cards with a shorter first screen. */
.book-back{margin-bottom:13px}
.book-intro h1{margin:5px 0 7px}
.book-header{margin-bottom:17px}
.details-grid{grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:12px}
.book-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.book-fact{padding:14px 21px 15px;min-width:0}
.book-fact + .book-fact{border-left:1px solid var(--line)}
.book-fact .info-title{color:#8b7258;font-size:10px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;margin-bottom:5px}
.book-fact p{margin:0;font-size:16px;line-height:1.5;color:#253a4f;overflow-wrap:anywhere}
.info-box{min-height:0;padding:14px 21px 16px;border-radius:13px}
.info-box .info-title{margin-bottom:6px}
.info-box p{font-size:16px;line-height:1.55;color:#43566a}
.verse-list{gap:9px}
.verse{padding:10px 12px;display:flex;flex-direction:column;justify-content:center;min-height:61px;gap:2px}
.verse strong{font-size:14px;margin-bottom:0;line-height:1.4}
.verse span{font-size:12px;line-height:1.4}
.summarycard{padding:20px 23px 23px;border-radius:13px}
.summarycard h2{font-size:24px;margin:2px 0 7px}
.summarycard p{font-size:17px;line-height:1.72}
.actions{margin-top:14px}
@media(max-width:600px){
 .book-header{gap:10px}
 .details-grid{grid-template-columns:1fr;gap:9px}

 .verse-list{grid-template-columns:1fr;gap:6px}
 .verse{min-height:0;flex-direction:row;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 11px}

.era-chip:hover { background:#EFF3F4; border-color:#B8C8D2; }
.timeline-more { color:#3A627F; }
.timeline-more summary { background:#ECEFEB; }
.timeline-more summary:hover { background:#E2E9E6; }
.timeline-note, .bible-time-legend { color:#5D6B78; font-size:12px; line-height:1.65; }

/* Browse cards use one consistent visual language */
.collection, .bookcard {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:13px;
  box-shadow:0 1px 2px rgba(37,48,59,.025);
  transition:transform .17s ease,box-shadow .17s ease,border-color .17s ease;
}
.collection { min-height:173px; padding:20px 20px 19px; }
.collection .clnum { color:#9A7850; }
.collection h3 { color:var(--navy); font-size:20px; margin:13px 0 8px; }
.collection p { color:#566777; font-size:12.5px; line-height:1.48; }
.collection .clcount { color:#6F593D; font-size:11px; }
.collection .clarrow, .bookcard .bookarrow { color:#59768A; }
.bookgrid { gap:14px; }
.bookcard { min-height:177px; padding:20px; }
.bookcard .bookindex { color:#80603F; font-size:11px; }
.bookcard h3 { color:var(--navy); margin:15px 0 8px; }
.bookcard p { color:#566676; font-size:13px; line-height:1.58; }
.bookcard .bookmeta { color:#745B3E; font-size:11px; }
@media(hover:hover) {
  .collection:hover, .bookcard:hover {
    border-color:#B9C9CD;
    box-shadow:0 9px 25px rgba(34,49,58,.08);
    transform:translateY(-2px);
  }
}

/* Book pages: let the summary feel like the central reading surface */
.book-facts, .info-box {
  background:var(--paper);
  border-color:var(--line);
  border-radius:12px;
}
.book-fact + .book-fact { border-left-color:var(--line); }
.book-fact .info-title, .info-box .info-title {
  color:#80603F;
  font-size:11px;
  letter-spacing:1.1px;
  margin-bottom:8px;
}
.book-fact p, .info-box p { color:#32475B; line-height:1.6; }
.info-box { padding:17px 22px 19px; }
.purpose-box p { font-size:15.5px; }
.summarycard {
  background:#FBF8F1;
  border:1px solid #E0D8C9;
  border-left:3px solid #A68A64;
  border-radius:12px;
  padding:25px 27px 27px;
}
.summarycard h2 { color:var(--navy); font-size:27px; margin:4px 0 10px; }
.summarycard p { color:#354A5D; font-size:17.5px; line-height:1.77; }
.verses-box .verse-intro { color:#5D6D7C; font-size:12.5px; }
.verses-box .verse-quotation {
  background:#FBFAF7;
  border-color:#E3DFD7;
  border-radius:9px;
  padding:15px 16px;
}
.verses-box .verse-quotation:hover { background:#F1F2EE; border-color:#B8C6CD; }
.verses-box .verse-quotation strong { color:#285675; font-size:13.5px; }
.verses-box .verse-quotation span { color:#34475A; font-size:15.5px; line-height:1.6; }
.mutebtn, .secondarybtn { background:var(--paper); border-color:#DADDD8; color:#385872; }
.mutebtn:hover, .secondarybtn:hover { background:#F1F0EB; }
.primarybtn { background:#243B53; border-color:#243B53; }
.primarybtn:hover { background:#315772; }
.pager { border-top-color:var(--line); }
.pager button { color:#365E7B; font-size:14px; }
.pager small { color:#607385; font-size:11px; }

/* Deep study panel: warmer reading surface, quiet outlines and accessible notes */
.drawer { background:#F6F4EF; }
.drawer-head { background:#FFFEFC; border-bottom-color:var(--line); }
.drawer-head h2, .drawer-section h3 { color:var(--navy); }
.drawer-section { background:var(--paper); border-color:var(--line); border-radius:13px; }
.drawer-section .desc { color:#5E6F7D; font-size:13px; line-height:1.55; }
.drawer-section .reading-outline-head { border-bottom-color:#334A5E; }
.drawer-section .reading-outline-head span { color:#5F7182; }
.trad-outline { border-color:#E0DBD2; background:#FFFEFC; }
.trad-outline li { border-bottom-color:#E5E0D7; }
.trad-outline li:nth-child(2n) { background:#FAF9F6; }
.trad-outline li:hover { background:#F1F1EC; }
.trad-outline .trad-range { background:#EFEEE8; border-color:#E1DCD3; }
.bible-chronology { border-top-color:#354A5E; }
.bible-chronology .story-note { color:#5F7080; font-size:12px; }
.bible-time-milestone .time-context { color:#5D6C7A; font-size:11px; }
.bible-time-legend { color:#5E6C78; }
.bible-map-caption, .footnote { color:#5E6C79; font-size:12px; }
.bible-real-map { border-color:#DFDBD3; }
.video-link { background:#F2F5F4; border-color:#DEE6E6; }
.video-link:hover { background:#E7EEEE; }
.video-link small { color:#526E83; font-size:12px; }
.study-links a { background:#F7F6F2; border-color:#E5E0D9; color:#3C607D; }
.themechips span { background:#F0F1EB; border-color:#E2E3DA; color:#3F5E71; }
.sources { border-top-color:var(--line); color:#657281; }
.sources strong { color:#526477; }
.sources a { color:#355B7B; }

/* Keep the original compact mobile layout while making text more comfortable */
@media(max-width:850px) {
  .sidebar { background:#FAF9F6; }
  .content { padding-top:27px; }
}
@media(max-width:600px) {
  .content { padding-top:22px; }
  .hero h1 { font-size:40px; }
  .hero p { font-size:14.5px; }
  .stats { margin:18px 0 25px; }
  .stat { padding:11px 10px; }
  .stat .statno { font-size:27px; }
  .stat .statlabel { font-size:10px; letter-spacing:.3px; }
  .section-heading h2 { font-size:25px; }
  .section-heading p { font-size:12.5px; }
  .collection { padding:17px 14px; min-height:167px; }
  .collection h3 { font-size:18px; }
  .collection p { font-size:12px; }
  .bookcard { min-height:155px; padding:18px; }
  .bookcard p { font-size:13px; }
  .book-fact + .book-fact { border-left:0; border-top:1px solid var(--line); }
  .info-box { padding:15px 17px; }
  .book-fact .info-title, .info-box .info-title { font-size:11px; }
  .book-fact p, .info-box p { font-size:15px; }
  .verses-box .verse-quotation { padding:12px 14px; }
  .verses-box .verse-quotation span { font-size:15px; }
  .summarycard { padding:21px 19px 23px; }
  .summarycard h2 { font-size:25px; }
  .summarycard p { font-size:16.5px; line-height:1.73; }
  .drawer-section { padding:21px 18px; }
  .drawer-section .desc { font-size:12.5px; }
  .epoch-card p { font-size:12px; }
}
@media(prefers-reduced-motion:reduce) {
  .collection,.bookcard { transition:none; }
}

<script>
const DATA={"books":[{"id":0,"name":"Genesis","section":0,"testament":"OT","author":"Moses (traditional author; final compilation and editing are debated).","date":"Traditionally 15th–13th c. BC; final form debated","purpose":"Recount creation, humanity's rebellion, the flood, and Babel before tracing Abraham, Isaac, Jacob, and Joseph. These accounts explain the origins of Israel and the covenant promises of land, descendants, and blessing that drive the rest of Scripture.","verses":[{"ref":"1:1","text":"In the beginning, God created the heavens and the earth."},{"ref":"1:27","text":"God created man in his own image. In God’s image he created him; male and female he created them."},{"ref":"50:20","text":"As for you, you meant evil against me, but God meant it for good, to save many people alive, as is happening today."}],"summary":"Genesis begins with God's good creation and humanity's rebellion, followed by judgment and mercy. God calls Abraham and makes covenant promises of land, descendants, and worldwide blessing. The stories of Isaac, Jacob, and Joseph show God preserving that promise through flawed people and unexpected circumstances.","outline":["Creation and fall (1–11)","Patriarchs and covenant (12–36)","Joseph and preservation (37–50)"],"themes":["Creation","Covenant","Providence"],"era":0,"places":["Canaan","Egypt","Babylon"],"relations":["Exodus","Romans","Hebrews"]},{"id":1,"name":"Exodus","section":0,"testament":"OT","author":"Moses (traditional author; final compilation and editing are debated).","date":"Traditionally 15th–13th c. BC; final form debated","purpose":"Tell how Moses led Israel out of Egypt through the plagues, Passover, and Red Sea crossing, then received the covenant law at Sinai and instructions for the tabernacle. It records how an enslaved people became a nation organized around God's presence and worship.","verses":[{"ref":"14:14","text":"The LORD will fight for you, and you shall be still.”"},{"ref":"20:12","text":"“Honor your father and your mother, that your days may be long in the land which the LORD your God gives you."},{"ref":"3:14","text":"God said to Moses, “I AM WHO I AM,” and he said, “You shall tell the children of Israel this: ‘I AM has sent me to you.’”"}],"summary":"Israel suffers in Egypt until God raises Moses to lead the people out through mighty acts and the Passover. At Sinai, God establishes his covenant and gives the law to shape Israel as a holy nation. The tabernacle instructions and completion emphasize God's presence among his people despite their unfaithfulness.","outline":["Slavery and rescue (1–18)","Sinai covenant (19–24)","Tabernacle and divine presence (25–40)"],"themes":["Deliverance","Covenant","Presence"],"era":1,"places":["Egypt","Sinai","Canaan"],"relations":["Leviticus","John","Hebrews"]},{"id":2,"name":"Leviticus","section":0,"testament":"OT","author":"Moses (traditional author; priestly compilation and later editing are debated).","date":"Traditionally 15th–13th c. BC; final form debated","purpose":"Preserve the laws governing Israel's sacrifices, priests, ritual purity, Day of Atonement, festivals, and everyday holiness. It explains how Israel was to approach and worship God at the tabernacle and supplies the background for the New Testament's account of sacrifice and priesthood.","verses":[{"ref":"19:18","text":"“‘You shall not take vengeance, nor bear any grudge against the children of your people; but you shall love your neighbor as yourself. I am the LORD."},{"ref":"11:44","text":"For I am the LORD your God. Sanctify yourselves therefore, and be holy; for I am holy. You shall not defile yourselves with any kind of creeping thing that moves on the earth."},{"ref":"20:26","text":"You shall be holy to me, for I, the LORD, am holy, and have set you apart from the peoples, that you should be mine."}],"summary":"Leviticus explains sacrifices and priestly service as part of Israel's covenant worship. Laws concerning purity, the Day of Atonement, and holiness teach how a sinful people may live near a holy God. Its ethical commands connect worship of God with justice, love, and daily conduct.","outline":["Sacrifices and priests (1–10)","Purity and atonement (11–16)","Holy living and feasts (17–27)"],"themes":["Holiness","Atonement","Worship"],"era":1,"places":["Sinai"],"relations":["Hebrews","Romans"]},{"id":3,"name":"Numbers","section":0,"testament":"OT","author":"Moses (traditional author; later compilation and editing are debated).","date":"Traditionally 15th–13th c. BC; final form debated","purpose":"Record Israel's census, camp organization, rebellion after the spies' report, forty years of wilderness wandering, and preparations to enter Canaan. It explains why the exodus generation did not inherit the land and how a new generation arrived at its borders.","verses":[{"ref":"6:24","text":"‘The LORD bless you, and keep you."},{"ref":"6:25","text":"The LORD make his face to shine on you, and be gracious to you."},{"ref":"23:19","text":"God is not a man, that he should lie, nor a son of man, that he should repent. Has he said, and he won’t do it? Or has he spoken, and he won’t make it good?"}],"summary":"Numbers follows Israel from Sinai through the wilderness toward the promised land. Complaints, rebellion, and refusal to trust God's promise lead to a generation's prolonged wandering. Yet God preserves the nation and prepares a new generation to enter Canaan.","outline":["Preparation at Sinai (1–10)","Rebellion and wandering (11–25)","New generation (26–36)"],"themes":["Faithfulness","Unbelief","Journey"],"era":1,"places":["Sinai","Moab","Canaan"],"relations":["Deuteronomy","1 Corinthians"]},{"id":4,"name":"Deuteronomy","section":0,"testament":"OT","author":"Moses (principal speaker and traditional author; the final chapter and later editing reflect other hands).","date":"Traditionally 15th–13th c. BC; final form debated","purpose":"Preserve Moses' final speeches to the generation preparing to enter Canaan: a review of the journey, a restatement of the law, and a renewal of the covenant. It establishes the terms by which Israel's later kings, prophets, and history are evaluated.","verses":[{"ref":"6:5","text":"You shall love the LORD your God with all your heart, with all your soul, and with all your might."},{"ref":"31:6","text":"Be strong and courageous. Don’t be afraid or scared of them, for the LORD your God himself is who goes with you. He will not fail you nor forsake you.”"},{"ref":"6:4","text":"Hear, Israel: The LORD is our God. The LORD is one."}],"summary":"Moses addresses a new generation on the plains of Moab before Israel enters Canaan. He retells God's acts and renews the covenant, emphasizing wholehearted love and obedience. The book sets blessings and curses before Israel while anticipating both failure and God's future restoration.","outline":["Remember God's work (1–4)","Covenant instruction (5–26)","Choice, blessing, and succession (27–34)"],"themes":["Love","Law","Covenant"],"era":1,"places":["Moab","Canaan"],"relations":["Joshua","Matthew"]},{"id":5,"name":"Joshua","section":1,"testament":"OT","author":"Joshua (traditional attribution; author unknown; later materials are linked to Eleazar, Phinehas, or later Israelite editors).","date":"Often placed in exilic or later final form; events traditionally c. 1400s–1200s BC","purpose":"Record how Joshua led Israel across the Jordan, captured Jericho and other Canaanite strongholds, divided the land among the tribes, and renewed the covenant at Shechem. It explains how Israel came to occupy the homeland promised to its ancestors.","verses":[{"ref":"1:9","text":"Haven’t I commanded you? Be strong and courageous. Don’t be afraid. Don’t be dismayed, for the LORD your God is with you wherever you go.”"},{"ref":"24:15","text":"If it seems evil to you to serve the LORD, choose today whom you will serve; whether the gods which your fathers served that were beyond the River, or the gods of the Amorites, in whose land you dwell; but as for me and my house, we will serve the LORD.”"},{"ref":"1:8","text":"This book of the law shall not depart from your mouth, but you shall meditate on it day and night, that you may observe to do according to all that is written in it; for then you shall make your way prosperous, and then you shall have good success."}],"summary":"Joshua leads Israel across the Jordan and into the promised land. Battles, land allotments, and covenant ceremonies depict God's fulfillment of his promises, while also revealing Israel's incomplete obedience. Joshua concludes by urging the nation to reject idols and serve the Lord faithfully.","outline":["Entrance and conquest (1–12)","Land allotments (13–21)","Covenant renewal (22–24)"],"themes":["Promise","Faith","Obedience"],"era":2,"authorOptions":["Joshua (traditional attribution)","Eleazar or another early witness (traditional proposals)","A later covenant historian/editor"],"places":["Canaan","Jerusalem"],"relations":["Judges","Hebrews"]},{"id":6,"name":"Judges","section":1,"testament":"OT","author":"Unknown (traditionally linked to Samuel; many scholars instead propose one or more unnamed Israelite historians or compilers).","date":"Likely exilic or later final form; events c. 1200s–1000s BC","purpose":"Recount Israel's life between Joshua and the monarchy through leaders such as Deborah, Gideon, Jephthah, and Samson. Its repeated episodes of idolatry, oppression, deliverance, and civil disorder explain the instability that preceded Israel's demand for a king.","verses":[{"ref":"6:12","text":"The LORD’s angel appeared to him, and said to him, “The LORD is with you, you mighty man of valor!”"},{"ref":"21:25","text":"In those days there was no king in Israel. Everyone did that which was right in his own eyes."},{"ref":"5:31","text":"“So let all your enemies perish, LORD, but let those who love him be as the sun when it rises in its strength.” Then the land had rest forty years."}],"summary":"After Joshua, Israel repeatedly abandons God and falls under oppression. God raises judges to deliver the people, but each cycle exposes deepening moral and spiritual disorder. The book ends with disturbing accounts of violence and a refrain that points to the need for righteous leadership.","outline":["Early deliverers (1–5)","Cycles of decline (6–16)","Moral chaos (17–21)"],"themes":["Leadership","Idolatry","Deliverance"],"era":2,"authorOptions":["Samuel (traditional attribution)","An unnamed monarchic-period writer","A later exilic compiler"],"places":["Canaan"],"relations":["Ruth","1 Samuel"]},{"id":7,"name":"Ruth","section":1,"testament":"OT","author":"Unknown (traditionally attributed to Samuel; an unnamed Israelite storyteller from the monarchy or a later period is also proposed).","date":"Possibly monarchic to postexilic era; uncertain","purpose":"Tell how the widowed Ruth accompanied Naomi to Bethlehem, gleaned in Boaz's field, and married him through a family-redeemer arrangement. The account explains how a Moabite woman entered the family line of King David, and ultimately Jesus, amid the troubled era of the judges.","verses":[{"ref":"1:16","text":"Ruth said, “Don’t urge me to leave you, and to return from following you, for where you go, I will go; and where you stay, I will stay. Your people will be my people, and your God my God."},{"ref":"2:12","text":"May the LORD repay your work, and a full reward be given to you from the LORD, the God of Israel, under whose wings you have come to take refuge.”"},{"ref":"1:17","text":"Where you die, I will die, and there I will be buried. May the LORD do so to me, and more also, if anything but death parts you and me.”"}],"summary":"In a period of famine and loss, Ruth remains loyal to her mother-in-law Naomi and follows her to Bethlehem. Through the integrity of Ruth and Boaz, God provides protection, redemption, and a new family. Their child becomes an ancestor of King David, linking a small family story to God's larger purposes.","outline":["Loss and loyalty (1)","Kindness in the fields (2)","Redemption and lineage (3–4)"],"themes":["Loyalty","Providence","Redemption"],"era":2,"authorOptions":["Samuel (traditional attribution)","An unnamed royal-era storyteller","A later postexilic writer"],"places":["Moab","Bethlehem"],"relations":["Matthew","1 Samuel"]},{"id":8,"name":"1 Samuel","section":1,"testament":"OT","author":"Unknown (early material is traditionally linked to Samuel, Nathan, and Gad; the final author or compiler is unidentified).","date":"Likely assembled in exilic era; events c. 1100s–1000 BC","purpose":"Trace Israel's transition from the judges to kingship through Samuel's ministry, Saul's selection and downfall, and David's anointing and rise—including his encounter with Goliath. It establishes how the monarchy began and why David, rather than Saul, became the central royal figure.","verses":[{"ref":"16:7","text":"But the LORD said to Samuel, “Don’t look on his face, or on the height of his stature, because I have rejected him; for I don’t see as man sees. For man looks at the outward appearance, but the LORD looks at the heart.”"},{"ref":"15:22","text":"Samuel said, “Has the LORD as great delight in burnt offerings and sacrifices, as in obeying the LORD’s voice? Behold, to obey is better than sacrifice, and to listen than the fat of rams."},{"ref":"17:47","text":"and that all this assembly may know that the LORD doesn’t save with sword and spear; for the battle is the LORD’s, and he will give you into our hand.”"}],"summary":"Samuel guides Israel at a turning point from judges to monarchy. Saul becomes king but repeatedly fails to obey God, while David is chosen and anointed as his successor. The book contrasts human expectations of power with God's concern for the heart and covenant faithfulness.","outline":["Samuel and the ark (1–7)","Rise and failure of Saul (8–15)","David and Saul (16–31)"],"themes":["Kingship","Obedience","Heart"],"era":3,"authorOptions":["Samuel (early traditions)","Nathan (prophetic records)","Gad (prophetic records)"],"places":["Samaria","Jerusalem"],"relations":["2 Samuel","Psalms"]},{"id":9,"name":"2 Samuel","section":1,"testament":"OT","author":"Unknown (Nathan and Gad are traditionally associated with source records; the final author or compiler is unidentified).","date":"Likely assembled in exilic era; events c. 1000–970 BC","purpose":"Document David's reign: the unification of the tribes, establishment of Jerusalem, promise of an enduring dynasty, and crises following his sin with Bathsheba. It preserves the origins of the Davidic kingship that later biblical writers associate with the promised Messiah.","verses":[{"ref":"22:31","text":"As for God, his way is perfect. The LORD’s word is tested. He is a shield to all those who take refuge in him."},{"ref":"7:22","text":"Therefore you are great, LORD God. For there is no one like you, neither is there any God besides you, according to all that we have heard with our ears."},{"ref":"22:2","text":"and he said: “The LORD is my rock, my fortress, and my deliverer, even mine;"}],"summary":"David consolidates his kingdom and receives God's promise of an enduring royal dynasty. His adultery with Bathsheba and the killing of Uriah bring grievous consequences to his family and nation. Even through judgment and disorder, the book keeps God's covenant promise in view.","outline":["Kingdom established (1–10)","David's sin and aftermath (11–20)","Reflections on his reign (21–24)"],"themes":["Covenant","Leadership","Repentance"],"era":3,"authorOptions":["Nathan (prophetic records)","Gad (prophetic records)","A later historical compiler"],"places":["Jerusalem"],"relations":["1 Kings","Luke"]},{"id":10,"name":"1 Kings","section":1,"testament":"OT","author":"Unknown (traditionally attributed to Jeremiah; many scholars instead identify an anonymous exilic historian or compiler).","date":"Likely 6th c. BC final form; covers c. 970–850 BC","purpose":"Recount Solomon's reign and construction of the Jerusalem temple, the kingdom's division after his death, and the rival royal houses that followed, including Elijah's confrontations with Ahab. It explains the split between Israel and Judah and the struggle over legitimate worship.","verses":[{"ref":"3:9","text":"Give your servant therefore an understanding heart to judge your people, that I may discern between good and evil; for who is able to judge this great people of yours?”"},{"ref":"8:23","text":"and he said, “LORD, the God of Israel, there is no God like you, in heaven above, or on earth beneath; who keeps covenant and loving kindness with your servants who walk before you with all their heart;"},{"ref":"18:21","text":"Elijah came near to all the people, and said, “How long will you waver between the two sides? If the LORD is God, follow him; but if Baal, then follow him.” The people didn’t say a word."}],"summary":"Solomon begins his reign with wisdom and builds the temple in Jerusalem. His compromises contribute to the kingdom's division after his death, and later rulers repeatedly turn toward idolatry. Elijah's ministry confronts false worship and calls Israel back to the living God.","outline":["Solomon and temple (1–11)","Divided kingdom (12–16)","Elijah and royal conflict (17–22)"],"themes":["Wisdom","Idolatry","Kingship"],"era":4,"authorOptions":["Jeremiah (traditional attribution)","A Deuteronomistic historian","An exilic editorial school"],"places":["Jerusalem","Samaria"],"relations":["2 Kings","Ecclesiastes"]},{"id":11,"name":"2 Kings","section":1,"testament":"OT","author":"Unknown (traditionally attributed to Jeremiah; many scholars instead identify an anonymous exilic historian or compiler).","date":"Likely 6th c. BC final form; covers c. 850–560 BC","purpose":"Continue the history of Israel and Judah through Elisha, royal reforms, the Assyrian conquest of Samaria, and Babylon's destruction of Jerusalem. It explains the loss of both kingdoms and the exile, ending with a small sign that David's royal line has not disappeared.","verses":[{"ref":"6:16","text":"He answered, “Don’t be afraid, for those who are with us are more than those who are with them.”"},{"ref":"17:13","text":"Yet the LORD testified to Israel and to Judah, by every prophet and every seer, saying, “Turn from your evil ways, and keep my commandments and my statutes, according to all the law which I commanded your fathers, and which I sent to you by my servants the prophets.”"},{"ref":"20:5","text":"“Turn back, and tell Hezekiah the prince of my people, ‘The LORD, the God of David your father, says, “I have heard your prayer. I have seen your tears. Behold, I will heal you. On the third day, you will go up to the LORD’s house."}],"summary":"Elisha's ministry opens the book amid turmoil in Israel and Judah. Despite prophetic warnings and occasional reforms, Israel falls to Assyria and Judah eventually falls to Babylon. The exile displays the consequences of persistent covenant rejection, while the ending offers a small sign of hope for David's line.","outline":["Elisha and both kingdoms (1–13)","Assyrian judgment (14–17)","Judah to Babylonian exile (18–25)"],"themes":["Judgment","Prophets","Exile"],"era":4,"authorOptions":["Jeremiah (traditional attribution)","A Deuteronomistic historian","An exilic editorial school"],"places":["Samaria","Jerusalem","Babylon"],"relations":["Jeremiah","Ezra"]},{"id":12,"name":"1 Chronicles","section":1,"testament":"OT","author":"Ezra (traditional attribution; author unknown; many scholars posit an anonymous Chronicler).","date":"Likely 5th–4th c. BC","purpose":"Retell Israel's ancestry through genealogies and revisit David's reign, with special attention to the ark, Levites, temple worship, and preparations for Solomon's temple. Written for a later community, it connects the people returning from exile to their ancestral and religious institutions.","verses":[{"ref":"16:11","text":"Seek the LORD and his strength. Seek his face forever more."},{"ref":"16:34","text":"Oh give thanks to the LORD, for he is good, for his loving kindness endures forever."},{"ref":"29:11","text":"Yours, LORD, is the greatness, the power, the glory, the victory, and the majesty! For all that is in the heavens and in the earth is yours. Yours is the kingdom, LORD, and you are exalted as head above all."}],"summary":"Genealogies connect postexilic readers to the story of God's covenant people. The narrative then focuses on David, emphasizing worship, priestly organization, and preparation for the temple. By retelling Israel's past selectively, the book offers hope and a renewed identity centered on God's promises.","outline":["Genealogies (1–9)","David's rise (10–21)","Temple preparation (22–29)"],"themes":["Identity","Worship","Davidic covenant"],"era":3,"authorOptions":["Ezra (traditional attribution)","An unknown temple-connected scribe","A later postexilic compiler"],"places":["Jerusalem"],"relations":["2 Samuel","Ezra"]},{"id":13,"name":"2 Chronicles","section":1,"testament":"OT","author":"Ezra (traditional attribution; author unknown; many scholars posit an anonymous Chronicler).","date":"Likely 5th–4th c. BC","purpose":"Retell the reigns of Solomon and Judah's kings, focusing on the temple, priesthood, worship reforms, and reasons for exile. Its conclusion with Cyrus's decree to rebuild the temple helps a postexilic community understand both its collapse and its opportunity to begin again.","verses":[{"ref":"7:14","text":"if my people who are called by my name will humble themselves, pray, seek my face, and turn from their wicked ways, then I will hear from heaven, will forgive their sin, and will heal their land."},{"ref":"20:15","text":"and he said, “Listen, all Judah, and you inhabitants of Jerusalem, and you, King Jehoshaphat. The LORD says to you, ‘Don’t be afraid, and don’t be dismayed because of this great multitude; for the battle is not yours, but God’s."},{"ref":"16:9","text":"For the LORD’s eyes run back and forth throughout the whole earth, to show himself strong in the behalf of them whose heart is perfect toward him. You have done foolishly in this; for from now on you will have wars.”"}],"summary":"Solomon's temple and dedication occupy the opening chapters. The rest of the book recounts Judah's kings with particular emphasis on worship, reform, and the consequences of forsaking God. It closes with exile and Cyrus's decree, looking toward restoration and renewed worship.","outline":["Solomon's temple (1–9)","Judah's kings (10–35)","Exile and return decree (36)"],"themes":["Worship","Reform","Restoration"],"era":4,"authorOptions":["Ezra (traditional attribution)","An unknown temple-connected scribe","A later postexilic compiler"],"places":["Jerusalem","Babylon"],"relations":["1 Kings","Ezra"]},{"id":14,"name":"Ezra","section":1,"testament":"OT","author":"Ezra (source of memoir material; final editor unknown).","date":"Likely 5th–4th c. BC","purpose":"Describe the return of Judean exiles under Persian authorization, the rebuilding of Jerusalem's altar and temple, and Ezra's later instruction in the law. It documents how temple worship and a distinct Jewish covenant community were reestablished after Babylonian exile.","verses":[{"ref":"7:10","text":"For Ezra had set his heart to seek the LORD’s law, and to do it, and to teach statutes and ordinances in Israel."},{"ref":"8:22","text":"For I was ashamed to ask of the king a band of soldiers and horsemen to help us against the enemy on the way, because we had spoken to the king, saying, “The hand of our God is on all those who seek him, for good; but his power and his wrath is against all those who forsake him.”"},{"ref":"3:11","text":"They sang to one another in praising and giving thanks to the LORD, “For he is good, for his loving kindness endures forever toward Israel.” All the people shouted with a great shout, when they praised the LORD, because the foundation of the LORD’s house had been laid."}],"summary":"Exiles return to Judah under Persian rule and rebuild the temple despite opposition. Decades later, Ezra arrives to teach the law and confront serious covenant failures. The book highlights the spiritual as well as physical work of rebuilding God's people.","outline":["Return and temple (1–6)","Ezra's mission (7–8)","Covenant crisis (9–10)"],"themes":["Return","Scripture","Reform"],"era":6,"authorOptions":["Ezra (memoirs and some material)","An anonymous postexilic compiler","A scribal circle that preserved return traditions"],"places":["Babylon","Jerusalem"],"relations":["Nehemiah","Haggai"]},{"id":15,"name":"Nehemiah","section":1,"testament":"OT","author":"Nehemiah (source of memoir material; final editor unknown).","date":"Likely 5th–4th c. BC","purpose":"Tell how Nehemiah organized the rebuilding of Jerusalem's walls despite opposition, alongside the public reading of the law and reforms of community life. It records the practical and religious reorganization of Jerusalem after exile, beyond the earlier rebuilding of the temple.","verses":[{"ref":"8:10","text":"Then he said to them, “Go your way. Eat the fat, drink the sweet, and send portions to him for whom nothing is prepared, for today is holy to our Lord. Don’t be grieved, for the joy of the LORD is your strength.”"},{"ref":"2:18","text":"I told them about the hand of my God which was good on me, and also about the king’s words that he had spoken to me. They said, “Let’s rise up and build.” So they strengthened their hands for the good work."},{"ref":"6:3","text":"I sent messengers to them, saying, “I am doing a great work, so that I can’t come down. Why should the work cease while I leave it and come down to you?”"}],"summary":"Nehemiah returns to Jerusalem and leads the rebuilding of its walls despite hostility and internal pressures. Ezra and the Levites help the people hear the law, confess sin, and renew their covenant. Further reforms expose the ongoing need for perseverance and wholehearted faithfulness.","outline":["Wall rebuilding (1–7)","Law and covenant renewal (8–10)","Community reform (11–13)"],"themes":["Leadership","Renewal","Perseverance"],"era":6,"authorOptions":["Nehemiah (memoir sections)","Ezra or a scribal associate (traditional theory)","An anonymous postexilic compiler"],"places":["Susa","Jerusalem"],"relations":["Ezra","Malachi"]},{"id":16,"name":"Esther","section":1,"testament":"OT","author":"Unknown (Mordecai is a traditional proposal; an unnamed Jewish writer familiar with Persian court life is another explanation).","date":"Possibly 4th–2nd c. BC; events in 5th c. BC","purpose":"Recount how Esther and Mordecai thwarted Haman's plan to destroy Jews living in the Persian Empire. The story explains the origin of the festival of Purim and preserves the memory of Jewish survival and courage while living far from Jerusalem.","verses":[{"ref":"4:14","text":"For if you remain silent now, then relief and deliverance will come to the Jews from another place, but you and your father’s house will perish. Who knows if you haven’t come to the kingdom for such a time as this?”"},{"ref":"4:16","text":"“Go, gather together all the Jews who are present in Susa, and fast for me, and neither eat nor drink three days, night or day. I and my maidens will also fast the same way. Then I will go in to the king, which is against the law; and if I perish, I perish.”"},{"ref":"8:17","text":"In every province and in every city, wherever the king’s commandment and his decree came, the Jews had gladness, joy, a feast and a holiday. Many from among the peoples of the land became Jews, for the fear of the Jews had fallen on them."}],"summary":"Esther becomes queen of Persia while concealing her Jewish identity. When Haman plots to destroy the Jews, Mordecai urges Esther to act with courage. A dramatic reversal preserves the people and establishes the celebration of Purim, illustrating providence operating through human choices.","outline":["Danger in Persia (1–4)","Reversal and rescue (5–8)","Purim and remembrance (9–10)"],"themes":["Providence","Courage","Deliverance"],"era":6,"authorOptions":["Mordecai (traditional proposal)","Ezra (later attribution)","An anonymous Jewish author familiar with Persia"],"places":["Susa"],"relations":["Ezra","Daniel"]},{"id":17,"name":"Job","section":2,"testament":"OT","author":"Unknown (Moses and Solomon are among ancient proposals; an anonymous Israelite wisdom author is also suggested. No candidate is established).","date":"Perhaps 7th–4th c. BC; setting intentionally archaic","purpose":"Present the ordeal of a righteous sufferer, debates with friends who blame him, and God's final response from the whirlwind. The book challenges the assumption that suffering always results from personal wrongdoing and explores how people can speak about justice when they cannot see the whole story.","verses":[{"ref":"19:25","text":"But as for me, I know that my Redeemer lives. In the end, he will stand upon the earth."},{"ref":"1:21","text":"He said, “Naked I came out of my mother’s womb, and naked will I return there. The LORD gave, and the LORD has taken away. Blessed be the LORD’s name.”"},{"ref":"42:2","text":"“I know that you can do all things, and that no purpose of yours can be restrained."}],"summary":"Job, a righteous man, loses his possessions, children, and health in a profound test. His friends insist that suffering must signal wrongdoing, while Job challenges their simplistic explanations. God finally speaks of creation's vast complexity, inviting humility even where full explanations remain unavailable.","outline":["Trial and lament (1–3)","Debates and speeches (4–37)","God's answer and restoration (38–42)"],"themes":["Suffering","Wisdom","Trust"],"era":0,"authorOptions":["Moses (traditional proposal)","Solomon (traditional proposal)","An anonymous wisdom poet"],"places":["Edom"],"relations":["Psalms","James"]},{"id":18,"name":"Psalms","section":2,"testament":"OT","author":"David (principal named contributor; Asaph, the sons of Korah, Solomon, Moses, and anonymous poets also contributed).","date":"Collected over centuries; final form likely postexilic","purpose":"Collect Israel's prayers and songs—praise, lament, thanksgiving, royal psalms, confession, and wisdom—for personal devotion and communal worship. Their inclusion gives generations of worshipers biblical language for grief, joy, repentance, kingship, and expectation of God's future rule.","verses":[{"ref":"23:1","text":"A Psalm by David. The LORD is my shepherd; I shall lack nothing."},{"ref":"46:10","text":"“Be still, and know that I am God. I will be exalted among the nations. I will be exalted in the earth.”"},{"ref":"139:14","text":"I will give thanks to you, for I am fearfully and wonderfully made. Your works are wonderful. My soul knows that very well."}],"summary":"Psalms gathers Israel's songs and prayers across generations. Its poems move through lament, gratitude, confession, trust, royal hope, and exuberant worship. Together they teach believers to bring every season of life before God while awaiting his righteous reign.","outline":["Books I–II (1–72)","Books III–IV (73–106)","Book V and final praise (107–150)"],"themes":["Prayer","Worship","Hope"],"era":3,"places":["Jerusalem"],"relations":["Matthew","Hebrews"]},{"id":19,"name":"Proverbs","section":2,"testament":"OT","author":"Solomon (primary author by attribution; Agur, Lemuel, Hezekiah's scribes, and later editors also contributed).","date":"Collections from 10th c. BC onward; edited later","purpose":"Gather sayings and instructions about speech, money, work, family, friendship, sexuality, and leadership, framed by the fear of the Lord. It teaches practical discernment in ordinary life rather than recounting a single narrative or issuing laws for specific situations.","verses":[{"ref":"3:5","text":"Trust in the LORD with all your heart, and don’t lean on your own understanding."},{"ref":"3:6","text":"In all your ways acknowledge him, and he will make your paths straight."},{"ref":"22:6","text":"Train up a child in the way he should go, and when he is old he will not depart from it."}],"summary":"Proverbs presents wisdom as a life shaped by reverence for God. Short sayings address speech, diligence, money, friendship, marriage, parenting, and justice. Its teachings invite readers to pursue discernment while recognizing that proverbs describe general patterns rather than unconditional guarantees.","outline":["Wisdom invitations (1–9)","Solomon's sayings (10–29)","Agur and Lemuel (30–31)"],"themes":["Wisdom","Character","Speech"],"era":3,"places":["Jerusalem"],"relations":["James","Ecclesiastes"]},{"id":20,"name":"Ecclesiastes","section":2,"testament":"OT","author":"Solomon (traditional identification with Qoheleth; author unknown; an anonymous wisdom teacher using a royal voice is also proposed).","date":"Possibly 5th–3rd c. BC; disputed","purpose":"Record the Teacher's examination of work, pleasure, wealth, injustice, time, and death under the sun. By repeatedly showing the limits of human achievement and control, it gives Scripture a sustained reflection on mortality and what makes life worth living.","verses":[{"ref":"3:1","text":"For everything there is a season, and a time for every purpose under heaven:"},{"ref":"4:9","text":"Two are better than one, because they have a good reward for their labor."},{"ref":"12:13","text":"This is the end of the matter. All has been heard. Fear God and keep his commandments; for this is the whole duty of man."}],"summary":"The Teacher reflects on work, pleasure, injustice, time, and death under the sun. He finds that human efforts cannot secure lasting control or ultimate satisfaction in a fleeting world. The book commends receiving life as God's gift and concludes by calling readers to fear God and keep his commandments.","outline":["The puzzle of life (1–3)","Limits of toil and wisdom (4–11)","Aging and conclusion (12)"],"themes":["Meaning","Mortality","Reverence"],"era":3,"authorOptions":["Solomon (traditional identification)","A later sage using a Solomonic literary voice","An anonymous compiler/editor"],"places":["Jerusalem"],"relations":["Proverbs","James"]},{"id":21,"name":"Song of Solomon","section":2,"testament":"OT","author":"Solomon (traditional association; author unknown; an anonymous poet or several poets have also been proposed).","date":"Date uncertain; perhaps monarchic to postexilic","purpose":"Present a collection of poems voiced by lovers, depicting attraction, longing, delight, separation, and reunion. It gives romantic and embodied love a distinctive place in biblical wisdom literature, celebrating mutual desire and relationship rather than narrating Israel's public history.","verses":[{"ref":"8:7","text":"Many waters can’t quench love, neither can floods drown it. If a man would give all the wealth of his house for love, he would be utterly scorned."},{"ref":"2:16","text":"My beloved is mine, and I am his. He browses among the lilies."},{"ref":"8:6","text":"Set me as a seal on your heart, as a seal on your arm; for love is strong as death. Jealousy is as cruel as Sheol. Its flashes are flashes of fire, a very flame of the LORD."}],"summary":"Song of Solomon is a collection of passionate love poetry expressed by lovers and their companions. It celebrates physical attraction, longing, admiration, and the desire for enduring commitment. Read within the wider canon, it honors the goodness of covenant love while leaving room for careful theological reflection.","outline":["Longing and courtship (1–3)","Delight and separation (4–6)","Reunion and lasting love (7–8)"],"themes":["Love","Delight","Commitment"],"era":3,"authorOptions":["Solomon (traditional attribution)","An anonymous court poet","An editor of earlier love poems"],"places":["Jerusalem"],"relations":["Genesis","Ephesians"]},{"id":22,"name":"Isaiah","section":3,"testament":"OT","author":"Isaiah son of Amoz (named prophet and traditional primary author; composition of later chapters is disputed).","date":"Core prophecies in 8th c. BC; later composition debated","purpose":"Collect prophecies responding to Judah's political crises, Assyrian threats, idolatry, exile, and eventual restoration. The book moves from warnings to visions of a coming Davidic ruler, the Lord's servant, renewed Zion, and blessing reaching the nations—central texts for later messianic interpretation.","verses":[{"ref":"41:10","text":"Don’t you be afraid, for I am with you. Don’t be dismayed, for I am your God. I will strengthen you. Yes, I will help you. Yes, I will uphold you with the right hand of my righteousness."},{"ref":"40:31","text":"but those who wait for the LORD will renew their strength. They will mount up with wings like eagles. They will run, and not be weary. They will walk, and not faint."},{"ref":"53:5","text":"But he was pierced for our transgressions. He was crushed for our iniquities. The punishment that brought our peace was on him; and by his wounds we are healed."}],"summary":"Isaiah condemns Judah's injustice and misplaced trust in political power. Alongside warnings of judgment, he announces a holy God who will preserve a remnant and bring future redemption. Images of the promised king, suffering servant, and new creation make Isaiah central to the Bible's hope of salvation.","outline":["Judgment and royal hope (1–39)","Comfort and servant (40–55)","Restoration and new creation (56–66)"],"themes":["Holiness","Servant","Restoration"],"era":4,"places":["Jerusalem","Babylon"],"relations":["Matthew","Romans"]},{"id":23,"name":"Jeremiah","section":3,"testament":"OT","author":"Jeremiah (named prophet; Baruch assisted as scribe, and later editors likely shaped the book).","date":"Late 7th–early 6th c. BC; final form later","purpose":"Preserve Jeremiah's warnings to Judah before Babylon conquered Jerusalem, his confrontations with false prophets, and his counsel to the exiles. It interprets the catastrophe as the consequence of long-standing covenant violations while announcing a future return and a new covenant.","verses":[{"ref":"29:11","text":"For I know the thoughts that I think toward you,” says the LORD, “thoughts of peace, and not of evil, to give you hope and a future."},{"ref":"17:9","text":"The heart is deceitful above all things and it is exceedingly corrupt. Who can know it?"},{"ref":"33:3","text":"‘Call to me, and I will answer you, and will show you great and difficult things, which you don’t know.’"}],"summary":"Jeremiah warns Judah that idolatry and injustice will bring Babylonian conquest. His personal suffering reflects the cost of faithful prophecy amid rejection. Even as Jerusalem falls, God promises eventual restoration and a new covenant written on his people's hearts.","outline":["Calls to repent (1–25)","Conflict and new covenant (26–45)","Nations and Jerusalem's fall (46–52)"],"themes":["Repentance","New covenant","Hope"],"era":4,"places":["Jerusalem","Babylon"],"relations":["Lamentations","Hebrews"]},{"id":24,"name":"Lamentations","section":3,"testament":"OT","author":"Jeremiah (leading traditional proposal; author unknown because the book does not identify its writer; alternative views propose an anonymous eyewitness poet or multiple poets).","date":"Shortly after Jerusalem's fall in 586 BC; final author unknown","purpose":"Give poetic voice to the siege, destruction, hunger, and grief that followed Jerusalem's fall in 586 BC. Its five laments preserve a way for a devastated community to mourn, confess, question, and appeal for mercy after losing its city and temple.","verses":[{"ref":"3:22","text":"It is because of the LORD’s loving kindnesses that we are not consumed, because his mercies don’t fail."},{"ref":"3:23","text":"They are new every morning. Great is your faithfulness."},{"ref":"3:25","text":"The LORD is good to those who wait for him, to the soul who seeks him."}],"summary":"Five poems mourn the destruction of Jerusalem and the suffering of its people. The speaker acknowledges the gravity of sin and judgment without minimizing human pain. At the center, the poems recall God's compassion and encourage persistent hope and prayer for restoration.","outline":["City's grief (1–2)","Hope amid sorrow (3)","Ruin and plea for renewal (4–5)"],"themes":["Lament","Judgment","Mercy"],"era":5,"authorOptions":["Jeremiah (traditional attribution)","An unnamed survivor of Jerusalem’s fall","A poet or group of poets preserving communal lament"],"places":["Jerusalem"],"relations":["Jeremiah","Psalms"]},{"id":25,"name":"Ezekiel","section":3,"testament":"OT","author":"Ezekiel (named prophet; later collection and editing are possible).","date":"c. 593–571 BC; editing may be later","purpose":"Record the exiled priest Ezekiel's visions and prophetic actions surrounding Jerusalem's destruction, including the departure of God's glory, the valley of dry bones, and a restored temple. It explains exile to displaced Judeans and portrays their anticipated renewal and return.","verses":[{"ref":"36:26","text":"I will also give you a new heart, and I will put a new spirit within you. I will take away the stony heart out of your flesh, and I will give you a heart of flesh."},{"ref":"37:5","text":"The Lord GOD says to these bones: “Behold, I will cause breath to enter into you, and you will live."},{"ref":"18:32","text":"For I have no pleasure in the death of him who dies,” says the Lord GOD. “Therefore turn yourselves, and live!"}],"summary":"Ezekiel prophesies among exiles in Babylon through vivid visions and symbolic actions. He describes Jerusalem's judgment and exposes Israel's idolatry, but also foresees a transformed heart and restored community. The final vision of a renewed temple expresses hope for God's life-giving presence.","outline":["Judgment on Judah (1–24)","Oracles against nations (25–32)","New heart and restored presence (33–48)"],"themes":["Glory","Renewal","Presence"],"era":5,"places":["Babylon","Jerusalem"],"relations":["Jeremiah","Revelation"]},{"id":26,"name":"Daniel","section":3,"testament":"OT","author":"Daniel (traditional attribution; authorship and final composition disputed, with a later anonymous Jewish writer also proposed).","date":"Events 6th c. BC; composition dated 6th or 2nd c. BC across traditions","purpose":"Relate stories of Jewish fidelity under Babylonian and Persian rulers—such as the fiery furnace and lions' den—alongside visions of successive empires and divine judgment. It addresses how God's people can endure foreign domination while expecting a kingdom beyond earthly empires.","verses":[{"ref":"3:17","text":"If it happens, our God whom we serve is able to deliver us from the burning fiery furnace; and he will deliver us out of your hand, O king."},{"ref":"6:22","text":"My God has sent his angel, and has shut the lions’ mouths, and they have not hurt me, because innocence was found in me before him; and also before you, O king, I have done no harm.”"},{"ref":"2:21","text":"He changes the times and the seasons. He removes kings and sets up kings. He gives wisdom to the wise, and knowledge to those who have understanding."}],"summary":"Daniel and his companions remain faithful while serving in foreign courts. God protects them through trials and reveals the limits of seemingly powerful empires. Apocalyptic visions depict conflict, judgment, and God's final rule, calling readers to patient endurance.","outline":["Court narratives (1–6)","Kingdom visions (7–9)","Final visions (10–12)"],"themes":["Kingdom","Faithfulness","Hope"],"era":5,"places":["Babylon","Susa"],"relations":["Matthew","Revelation"]},{"id":27,"name":"Hosea","section":4,"testament":"OT","author":"Hosea (named prophet; later editorial collection is possible).","date":"c. 750–715 BC","purpose":"Use Hosea's troubled marriage and the names of his children to portray the northern kingdom's infidelity through Baal worship and political alliances. The prophecies explain Israel's approaching collapse and describe the possibility of restoration after judgment.","verses":[{"ref":"6:6","text":"For I desire mercy, and not sacrifice; and the knowledge of God more than burnt offerings."},{"ref":"4:6","text":"My people are destroyed for lack of knowledge. Because you have rejected knowledge, I will also reject you, that you may be no priest to me. Because you have forgotten your God’s law, I will also forget your children."},{"ref":"14:4","text":"“I will heal their waywardness. I will love them freely; for my anger is turned away from them."}],"summary":"Hosea's difficult marriage becomes a prophetic picture of Israel's covenant infidelity. The prophet denounces idolatry, corruption, and shallow religion in the northern kingdom. Yet God's love remains steadfast, and the book ends by calling Israel to repentance and renewed fruitfulness.","outline":["Marriage as sign (1–3)","Charges against Israel (4–13)","Call to return (14)"],"themes":["Steadfast love","Idolatry","Repentance"],"era":4,"places":["Samaria"],"relations":["Romans","Matthew"]},{"id":28,"name":"Joel","section":4,"testament":"OT","author":"Joel (named prophet; his identity beyond the book is unknown).","date":"Date highly disputed, often 9th–5th c. BC","purpose":"Interpret a devastating locust plague as a summons to communal mourning and repentance, then look toward the day of the Lord. Its promise that God's Spirit will be poured out on all kinds of people becomes especially important in Acts 2.","verses":[{"ref":"2:25","text":"I will restore to you the years that the swarming locust has eaten, the great locust, the grasshopper, and the caterpillar, my great army, which I sent among you."},{"ref":"2:28","text":"“It will happen afterward, that I will pour out my Spirit on all flesh; and your sons and your daughters will prophesy. Your old men will dream dreams. Your young men will see visions."},{"ref":"2:12","text":"“Yet even now,” says the LORD, “turn to me with all your heart, and with fasting, and with weeping, and with mourning.”"}],"summary":"A devastating locust plague becomes the setting for a warning about the day of the Lord. Joel summons the whole community to repentance and prayer, trusting God's compassion. He anticipates restoration, the Spirit poured out broadly, and God's final judgment of evil.","outline":["Locust disaster (1)","Repentance and Spirit (2)","Judgment and refuge (3)"],"themes":["Day of the Lord","Spirit","Repentance"],"era":4,"places":["Jerusalem"],"relations":["Acts","Revelation"]},{"id":29,"name":"Amos","section":4,"testament":"OT","author":"Amos (named prophet from Tekoa; later editing is possible).","date":"c. 760–750 BC","purpose":"Deliver warnings to the prosperous northern kingdom for exploiting the poor, corrupting justice, and relying on religious ceremonies while practicing wrongdoing. Amos explains why apparent national success cannot shield Israel from judgment and ends with a vision of restoration.","verses":[{"ref":"5:24","text":"But let justice roll on like rivers, and righteousness like a mighty stream."},{"ref":"3:3","text":"Do two walk together, unless they have agreed?"},{"ref":"5:14","text":"Seek good, and not evil, that you may live; and so the LORD, the God of Armies, will be with you, as you say."}],"summary":"Amos, a shepherd from Judah, confronts the prosperous northern kingdom of Israel. He exposes oppression of the poor and worship that conceals unrighteousness. Divine judgment is announced, yet the book closes with hope for a renewed people under God's restoring rule.","outline":["Oracles against nations (1–2)","Israel's injustice (3–6)","Visions and restoration (7–9)"],"themes":["Justice","Worship","Restoration"],"era":4,"places":["Samaria","Jerusalem"],"relations":["James","Acts"]},{"id":30,"name":"Obadiah","section":4,"testament":"OT","author":"Obadiah (named prophet; his identity is otherwise uncertain, and no widely accepted alternative named author exists).","date":"Date disputed, often around or after 586 BC","purpose":"Announce judgment against Edom for standing against its brother nation Judah during Jerusalem's calamity. The short prophecy addresses betrayal between neighboring peoples and envisions the reversal of Edom's triumph as the Lord's kingdom is established.","verses":[{"ref":"1:15","text":"For the day of the LORD is near all the nations! As you have done, it will be done to you. Your deeds will return upon your own head."},{"ref":"1:17","text":"But in Mount Zion, there will be those who escape, and it will be holy. The house of Jacob will possess their possessions."},{"ref":"1:3","text":"The pride of your heart has deceived you, you who dwell in the clefts of the rock, whose habitation is high, who says in his heart, ‘Who will bring me down to the ground?’"}],"summary":"Obadiah addresses Edom's pride and its betrayal of Judah during calamity. The prophet warns that those who exploit others' suffering will face God's judgment. The short book moves from Edom's downfall to the hope of deliverance and divine kingship.","outline":["Edom's arrogance (1–9)","Violence against Judah (10–14)","Day of the Lord (15–21)"],"themes":["Pride","Justice","Kingdom"],"era":5,"places":["Edom","Jerusalem"],"relations":["Jeremiah","Revelation"]},{"id":31,"name":"Jonah","section":4,"testament":"OT","author":"Jonah (traditional association with the prophet; actual narrator unknown and not identified in the story).","date":"Possibly 8th–4th c. BC; debated","purpose":"Tell how Jonah fled his commission to Nineveh, survived a great fish, saw the city repent, and resented God's mercy. The narrative challenges Israel's reluctance to see compassion extended to an enemy people and confronts the prophet's own attitudes.","verses":[{"ref":"2:9","text":"But I will sacrifice to you with the voice of thanksgiving. I will pay that which I have vowed. Salvation belongs to the LORD.”"},{"ref":"4:2","text":"He prayed to the LORD, and said, “Please, LORD, wasn’t this what I said when I was still in my own country? Therefore I hurried to flee to Tarshish, for I knew that you are a gracious God and merciful, slow to anger, and abundant in loving kindness, and you relent of doing harm."},{"ref":"1:17","text":"The LORD prepared a huge fish to swallow up Jonah, and Jonah was in the belly of the fish three days and three nights."}],"summary":"Jonah flees God's call to warn the Assyrian city of Nineveh and is rescued from the sea by a great fish. When Nineveh repents, God shows mercy rather than bringing the threatened destruction. Jonah's anger exposes the contrast between divine compassion and a prophet's reluctance to love enemies.","outline":["Flight and rescue (1–2)","Nineveh repents (3)","Mercy questioned (4)"],"themes":["Mercy","Repentance","Mission"],"era":4,"authorOptions":["Jonah son of Amittai (traditional proposal)","An unnamed preexilic narrator","A later postexilic storyteller"],"places":["Nineveh"],"relations":["Matthew","Nahum"]},{"id":32,"name":"Micah","section":4,"testament":"OT","author":"Micah of Moresheth (named prophet; later compilation is possible).","date":"c. 735–700 BC","purpose":"Condemn land seizures, dishonest rulers, and corrupt religious leaders in Samaria and Jerusalem while warning of the cities' coming downfall. It also preserves promises of a ruler from Bethlehem and a restored people gathered under God's peaceful reign.","verses":[{"ref":"6:8","text":"He has shown you, O man, what is good. What does the LORD require of you, but to act justly, to love mercy, and to walk humbly with your God?"},{"ref":"5:2","text":"But you, Bethlehem Ephrathah, being small among the clans of Judah, out of you one will come out to me who is to be ruler in Israel; whose goings out are from of old, from ancient times."},{"ref":"7:18","text":"Who is a God like you, who pardons iniquity, and passes over the disobedience of the remnant of his heritage? He doesn’t retain his anger forever, because he delights in loving kindness."}],"summary":"Micah warns Samaria and Jerusalem that corruption and exploitation invite judgment. He especially confronts leaders who misuse power and religious people who neglect justice. Alongside these warnings, the prophet anticipates a ruler from Bethlehem and a future restoration grounded in God's mercy.","outline":["Judgment and hope (1–2)","Leaders and coming ruler (3–5)","Covenant lawsuit and mercy (6–7)"],"themes":["Justice","Messiah","Mercy"],"era":4,"places":["Jerusalem"],"relations":["Matthew","Isaiah"]},{"id":33,"name":"Nahum","section":4,"testament":"OT","author":"Nahum of Elkosh (named prophet; little other biographical information survives).","date":"c. 663–612 BC","purpose":"Proclaim the approaching downfall of Nineveh, the capital of Assyria, in vivid poetry about siege and destruction. Written against the backdrop of imperial brutality, it explains why the collapse of this oppressive power would be welcomed by those it conquered.","verses":[{"ref":"1:7","text":"The LORD is good, a stronghold in the day of trouble; and he knows those who take refuge in him."},{"ref":"1:3","text":"The LORD is slow to anger, and great in power, and will by no means leave the guilty unpunished. The LORD has his way in the whirlwind and in the storm, and the clouds are the dust of his feet."},{"ref":"1:15","text":"Behold, on the mountains the feet of him who brings good news, who publishes peace! Keep your feasts, Judah! Perform your vows, for the wicked one will no more pass through you. He is utterly cut off."}],"summary":"Nahum declares that the violent Assyrian capital of Nineveh will fall. The poetry portrays God's opposition to cruelty, exploitation, and arrogant imperial power. For Judah, the message offers comfort that injustice will not endure forever.","outline":["God's judgment (1)","Nineveh's downfall (2)","Reasons for judgment (3)"],"themes":["Justice","Judgment","Refuge"],"era":4,"places":["Nineveh"],"relations":["Jonah","Revelation"]},{"id":34,"name":"Habakkuk","section":4,"testament":"OT","author":"Habakkuk (named prophet; his personal background is otherwise unknown).","date":"c. 609–597 BC, commonly","purpose":"Preserve a prophet's dialogue with God over violence in Judah and the troubling prospect of Babylon being used to punish it. The exchange and closing prayer wrestle with delayed justice and ask how the righteous should live while awaiting God's answer.","verses":[{"ref":"2:4","text":"Behold, his soul is puffed up. It is not upright in him, but the righteous will live by his faith."},{"ref":"3:17","text":"For even though the fig tree doesn’t flourish, nor fruit be in the vines, the labor of the olive fails, the fields yield no food, the flocks are cut off from the fold, and there is no herd in the stalls,"},{"ref":"3:19","text":"GOD, the Lord, is my strength. He makes my feet like deer’s feet, and enables me to go in high places. For the music director, on my stringed instruments."}],"summary":"Habakkuk questions why God tolerates violence and then why a wicked empire will be used in judgment. God responds that arrogant power will not ultimately prevail and that the righteous must live by faithfulness. The prophet closes in worship, choosing joy in God even when circumstances fail.","outline":["Questions and answers (1–2)","Prayer and trust (3)"],"themes":["Faith","Justice","Trust"],"era":4,"places":["Jerusalem","Babylon"],"relations":["Romans","Galatians"]},{"id":35,"name":"Zephaniah","section":4,"testament":"OT","author":"Zephaniah (named prophet active in Josiah's reign).","date":"c. 640–609 BC","purpose":"Warn Judah, Jerusalem, and surrounding nations of a sweeping day of judgment during the era of King Josiah. Alongside the warnings, it anticipates a purified people and a restored Jerusalem, showing that judgment is not the book's final word.","verses":[{"ref":"3:17","text":"The LORD, your God, is among you, a mighty one who will save. He will rejoice over you with joy. He will calm you in his love. He will rejoice over you with singing."},{"ref":"2:3","text":"Seek the LORD, all you humble of the land, who have kept his ordinances. Seek righteousness. Seek humility. It may be that you will be hidden in the day of the LORD’s anger."},{"ref":"3:15","text":"The LORD has taken away your judgments. He has thrown out your enemy. The King of Israel, the LORD, is among you. You will not be afraid of evil any more."}],"summary":"Zephaniah warns Judah and surrounding nations of God's coming judgment. Religious complacency, pride, and injustice are exposed as dangers for everyone. The book ends with a vision of a purified people gathered into God's joyful presence.","outline":["Coming judgment (1)","Seek the Lord (2)","Restoration and joy (3)"],"themes":["Judgment","Humility","Joy"],"era":4,"places":["Jerusalem"],"relations":["Revelation","Malachi"]},{"id":36,"name":"Haggai","section":4,"testament":"OT","author":"Haggai (named prophet whose messages form the book; a later compiler may have shaped it).","date":"520 BC","purpose":"Record dated prophetic messages urging returned exiles, including Zerubbabel and the high priest Joshua, to resume rebuilding Jerusalem's neglected temple. It explains the urgency of restoring a place of worship after the exile despite economic hardship and discouragement.","verses":[{"ref":"1:5","text":"Now therefore this is what the LORD of Armies says: ‘Consider your ways."},{"ref":"2:9","text":"‘The latter glory of this house will be greater than the former,’ says the LORD of Armies; ‘and in this place I will give peace,’ says the LORD of Armies.”"},{"ref":"1:8","text":"Go up to the mountain, bring wood, and build the house. I will take pleasure in it, and I will be glorified,” says the LORD."}],"summary":"Haggai speaks to returned exiles who have neglected rebuilding the temple while improving their own homes. He urges them to reorder their priorities around worship and trust God's presence. The people respond, and the prophet points toward a future glory surpassing their immediate circumstances.","outline":["Rebuild the house (1)","Encouragement and promise (2)"],"themes":["Priorities","Presence","Worship"],"era":6,"places":["Jerusalem"],"relations":["Ezra","Zechariah"]},{"id":37,"name":"Zechariah","section":4,"testament":"OT","author":"Zechariah (named prophet associated with chapters 1–8; authorship of chapters 9–14 is disputed).","date":"c. 520–518 BC for early oracles; later material debated","purpose":"Encourage Jerusalem's rebuilding community through night visions, symbolic acts, and prophecies concerning the priesthood, temple, a humble king, and future restoration. The book connects the immediate task of rebuilding with a larger hope for Jerusalem and the nations.","verses":[{"ref":"4:6","text":"Then he answered and spoke to me, saying, “This is the LORD’s word to Zerubbabel, saying, ‘Not by might, nor by power, but by my Spirit,’ says the LORD of Armies."},{"ref":"9:9","text":"Rejoice greatly, daughter of Zion! Shout, daughter of Jerusalem! Behold, your King comes to you! He is righteous, and having salvation; lowly, and riding on a donkey, even on a colt, the foal of a donkey."},{"ref":"13:1","text":"“In that day there will be a fountain opened to David’s house and to the inhabitants of Jerusalem, for sin and for uncleanness."}],"summary":"Zechariah uses night visions and prophetic messages to encourage a discouraged postexilic community. God promises to cleanse his people and empower their rebuilding by his Spirit. Later oracles anticipate a humble king, a pierced figure, and the Lord's ultimate reign.","outline":["Night visions (1–6)","True fasting and hope (7–8)","Coming king and kingdom (9–14)"],"themes":["Spirit","Messiah","Hope"],"era":6,"places":["Jerusalem"],"relations":["Matthew","Revelation"]},{"id":38,"name":"Malachi","section":4,"testament":"OT","author":"Malachi (traditional name; possibly a title meaning 'my messenger,' so the writer's identity is uncertain).","date":"Often c. 460–430 BC","purpose":"Confront corrupt priestly offerings, broken marriage commitments, withheld contributions, and public doubts about divine justice in the postexilic community. It closes the prophetic collection with an expectation of a coming messenger and day of the Lord.","verses":[{"ref":"3:10","text":"Bring the whole tithe into the storehouse, that there may be food in my house, and test me now in this,” says the LORD of Armies, “if I will not open you the windows of heaven, and pour you out a blessing, that there will not be enough room for."},{"ref":"4:2","text":"But to you who fear my name shall the sun of righteousness arise with healing in its wings. You will go out and leap like calves of the stall."},{"ref":"3:6","text":"“For I, the LORD, don’t change; therefore you, sons of Jacob, are not consumed."}],"summary":"Malachi challenges priests and people who offer careless worship and break covenant commitments. The prophet addresses marriage, justice, giving, and the widespread belief that serving God is futile. He promises God's refining arrival and urges Israel to remember the law while awaiting a coming messenger.","outline":["Corrupt worship and relationships (1–2)","Purification and coming day (3–4)"],"themes":["Faithfulness","Worship","Preparation"],"era":6,"places":["Jerusalem"],"relations":["Mark","Luke"]},{"id":39,"name":"Matthew","section":5,"testament":"NT","author":"Matthew the apostle (traditional attribution; the Gospel itself is anonymous and authorship remains debated).","date":"Often c. AD 60–90","purpose":"Narrate Jesus' genealogy, birth, teaching, miracles, death, and resurrection, repeatedly linking his life with Israel's Scriptures. Its sustained presentation of Jesus as Messiah and teacher—including the Sermon on the Mount—explains the kingdom and commissions disciples to all nations.","verses":[{"ref":"6:33","text":"But seek first God’s Kingdom and his righteousness; and all these things will be given to you as well."},{"ref":"28:19","text":"Go and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit,"},{"ref":"5:16","text":"Even so, let your light shine before men, that they may see your good works and glorify your Father who is in heaven."}],"summary":"Matthew traces Jesus' life from his genealogy and birth through his teachings, miracles, death, and resurrection. Repeated connections to Israel's Scriptures present him as the promised king who fulfills God's purposes. The Gospel emphasizes kingdom ethics and ends with a commission to make disciples of all nations.","outline":["Messiah arrives (1–4)","Teaching and ministry (5–25)","Passion and resurrection (26–28)"],"themes":["Messiah","Kingdom","Discipleship"],"era":7,"authorOptions":["Matthew the apostle (church tradition)","An anonymous Greek-writing Jewish Christian author","An early church compiler drawing on apostolic traditions"],"places":["Bethlehem","Galilee","Jerusalem"],"relations":["Genesis","Isaiah","Mark"]},{"id":40,"name":"Mark","section":5,"testament":"NT","author":"John Mark (traditional attribution associated with Peter; the Gospel itself is anonymous).","date":"Often c. AD 60–75","purpose":"Tell the story of Jesus' public ministry, confrontations, journey to Jerusalem, suffering, crucifixion, and empty tomb in a fast-moving narrative. It centers on the question of Jesus' identity and explains why the Messiah's mission included suffering and death.","verses":[{"ref":"10:45","text":"For the Son of Man also came not to be served but to serve, and to give his life as a ransom for many.”"},{"ref":"8:34","text":"He called the multitude to himself with his disciples and said to them, “Whoever wants to come after me, let him deny himself, and take up his cross, and follow me."},{"ref":"1:15","text":"and saying, “The time is fulfilled, and God’s Kingdom is at hand! Repent, and believe in the Good News.”"}],"summary":"Mark tells Jesus' story in a swift narrative of healings, exorcisms, and confrontations. As the disciples struggle to understand, Jesus explains that the Messiah must suffer and calls them to take up the cross. The story culminates in his crucifixion and the announcement of resurrection.","outline":["Authority revealed (1–8)","Road to Jerusalem (8–10)","Passion and resurrection announcement (11–16)"],"themes":["Servanthood","Cross","Discipleship"],"era":7,"authorOptions":["John Mark (church tradition)","An anonymous early Christian narrator","A writer preserving Petrine memories"],"places":["Galilee","Jerusalem"],"relations":["Matthew","Luke"]},{"id":41,"name":"Luke","section":5,"testament":"NT","author":"Luke (traditional attribution to Paul's companion; the Gospel itself is anonymous).","date":"Often c. AD 60–90","purpose":"Provide an orderly account of Jesus' birth, ministry, parables, journey to Jerusalem, death, and resurrection for Theophilus and other readers. Its attention to women, the poor, Samaritans, and outsiders establishes the first volume of a story continued in Acts.","verses":[{"ref":"6:31","text":"“As you would like people to do to you, do exactly so to them."},{"ref":"19:10","text":"For the Son of Man came to seek and to save that which was lost.”"},{"ref":"2:11","text":"For there is born to you today, in David’s city, a Savior, who is Christ the Lord."}],"summary":"Luke tells the story of Jesus with attention to historical setting, prayer, women, the poor, and social outsiders. Jesus announces God's salvation and demonstrates mercy through teaching, healing, and table fellowship. His death and resurrection lead into the church's mission continued in Acts.","outline":["Birth and preparation (1–4)","Galilean ministry and journey (4–19)","Jerusalem, cross, and resurrection (19–24)"],"themes":["Salvation","Mercy","Mission"],"era":7,"authorOptions":["Luke, companion of Paul (church tradition)","An anonymous educated early Christian author","A member of the Pauline mission circle"],"places":["Bethlehem","Galilee","Jerusalem"],"relations":["Acts","Matthew"]},{"id":42,"name":"John","section":5,"testament":"NT","author":"John the apostle (traditional attribution; other Johannine writers or editors are also proposed).","date":"Often c. AD 80–100","purpose":"Select Jesus' signs, conversations, 'I am' sayings, death, and resurrection to make a case for his identity as the Messiah and Son of God. The Gospel states its aim directly: that readers may believe and have life in his name (20:30–31).","verses":[{"ref":"3:16","text":"For God so loved the world, that he gave his only born Son, that whoever believes in him should not perish, but have eternal life."},{"ref":"14:6","text":"Jesus said to him, “I am the way, the truth, and the life. No one comes to the Father, except through me."},{"ref":"8:12","text":"Again, therefore, Jesus spoke to them, saying, “I am the light of the world. He who follows me will not walk in the darkness, but will have the light of life.”"}],"summary":"John opens by identifying Jesus as the eternal Word made flesh. Selected signs, extended conversations, and intimate teaching reveal his identity and invite faith. The Gospel culminates in the cross, resurrection, and a commission to bear witness to him.","outline":["Prologue and signs (1–12)","Farewell and passion (13–19)","Resurrection and witness (20–21)"],"themes":["Belief","Eternal life","Love"],"era":7,"authorOptions":["John son of Zebedee (church tradition)","John the Elder (ancient proposal)","A Johannine community writer/editor"],"places":["Galilee","Jerusalem"],"relations":["1 John","Revelation"]},{"id":43,"name":"Acts","section":5,"testament":"NT","author":"Luke (traditional attribution to Paul's companion; Acts itself is anonymous).","date":"Often c. AD 62–90","purpose":"Continue Luke's account from Jesus' ascension and Pentecost through Peter's preaching, the inclusion of Gentiles, the Jerusalem council, and Paul's journeys to Rome. It explains how the early Christian movement grew from Jerusalem into an international church.","verses":[{"ref":"1:8","text":"But you will receive power when the Holy Spirit has come upon you. You will be witnesses to me in Jerusalem, in all Judea and Samaria, and to the uttermost parts of the earth.”"},{"ref":"4:12","text":"There is salvation in no one else, for there is no other name under heaven that is given among men, by which we must be saved!”"},{"ref":"2:38","text":"Peter said to them, “Repent and be baptized, every one of you, in the name of Jesus Christ for the forgiveness of sins, and you will receive the gift of the Holy Spirit."}],"summary":"Acts begins with Jesus' ascension and the coming of the Holy Spirit at Pentecost. The gospel spreads from Jerusalem through Judea and Samaria, then across the Roman world through witnesses including Peter and Paul. The book emphasizes the Spirit's guidance, perseverance under opposition, and the inclusion of Gentiles in God's people.","outline":["Jerusalem church (1–7)","Beyond Jerusalem (8–12)","Paul's missions and Rome (13–28)"],"themes":["Spirit","Church","Mission"],"era":8,"authorOptions":["Luke, companion of Paul (church tradition)","An anonymous writer of Luke–Acts","A Pauline mission associate"],"places":["Jerusalem","Antioch","Ephesus","Corinth","Rome"],"relations":["Luke","Romans","Galatians"]},{"id":44,"name":"Romans","section":6,"testament":"NT","author":"Paul (named author; Tertius served as scribe).","date":"c. AD 56–58","purpose":"Explain Paul's gospel to Christians in Rome: humanity's sin, justification through Christ, life in the Spirit, Israel's place in God's purposes, and the ethics of a united church. The letter addresses tensions between Jewish and Gentile believers and prepares for Paul's hoped-for mission to Spain.","verses":[{"ref":"6:23","text":"For the wages of sin is death, but the free gift of God is eternal life in Christ Jesus our Lord."},{"ref":"8:28","text":"We know that all things work together for good for those who love God, for those who are called according to his purpose."},{"ref":"12:2","text":"Don’t be conformed to this world, but be transformed by the renewing of your mind, so that you may prove what is the good, well-pleasing, and perfect will of God."}],"summary":"Paul explains humanity's universal need for salvation and God's justification through faith in Jesus Christ. He explores new life in the Spirit, Israel's place in God's purposes, and the mercy shown to Jews and Gentiles. The letter concludes with practical instructions for transformed relationships and unity in the church.","outline":["Sin and justification (1–5)","New life and Israel (6–11)","Christian conduct (12–16)"],"themes":["Justification","Grace","Unity"],"era":9,"places":["Rome","Corinth"],"relations":["Galatians","Ephesians"]},{"id":45,"name":"1 Corinthians","section":6,"testament":"NT","author":"Paul (named author; Sosthenes also appears in the greeting).","date":"c. AD 53–55","purpose":"Address specific problems reported in Corinth: church factions, sexual misconduct, lawsuits, marriage questions, food offered to idols, disorder in worship, spiritual gifts, and confusion about resurrection. It shows how the gospel should reshape an actual, deeply divided congregation.","verses":[{"ref":"13:4","text":"Love is patient and is kind. Love doesn’t envy. Love doesn’t brag, is not proud,"},{"ref":"10:13","text":"No temptation has taken you except what is common to man. God is faithful, who will not allow you to be tempted above what you are able, but will with the temptation also make the way of escape, that you may be able to endure it."},{"ref":"16:13","text":"Watch! Stand firm in the faith! Be courageous! Be strong!"}],"summary":"Paul writes to a gifted but divided church struggling with morality, worship, and public witness. He addresses disputes, marriage, spiritual gifts, and the necessity of self-giving love. His lengthy defense of bodily resurrection anchors Christian hope and faithful labor.","outline":["Unity and holiness (1–6)","Relationships and worship
